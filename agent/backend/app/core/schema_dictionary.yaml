      - CRUISE_BICYCLISTORTRICYCLISTCROSS
      - CRUISE_FREESPACEYIELD
      - CRUISE_FOLLOWCARORTRUCKBRAKE
      - CRUISE_CARORTRUCKCUTIN
      - CRUISE_BICYCLISTORTRICYCLISTCUTOUT
      - CRUISE_CARORTRUCKCROSS
      - CRUISE_FOLLOWVRUBRAKE
      - CRUISE_VRUCUTIN
      - CRUISE_NRUBRAKE
      - CRUISE_CLOSECUTIN
      - CRUISE_VRUCUTOUT
      - CRUISE_OVERTAKECUTIN
