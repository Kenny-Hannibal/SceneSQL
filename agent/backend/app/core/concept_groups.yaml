composition_rules:
  single_tag:
    description: 1个range_tag概念，直接查range_tag
    sql_template: 'SELECT start_ts, end_ts, tag_name, param

      FROM range_tag

      WHERE tag_name IN ({tag_names})

      ORDER BY start_ts

      '
  multi_tag:
    description: 2+个range_tag概念，需要时间窗口交叉（range_tag自连接）
    sql_template: "SELECT r1.start_ts, r1.end_ts,\n       r1.tag_name AS {c1}_tag,\
      \ r2.tag_name AS {c2}_tag\nFROM range_tag r1\nJOIN range_tag r2\n  ON r1.start_ts\
      \ <= r2.end_ts AND r1.end_ts >= r2.start_ts\nWHERE r1.tag_name IN ({c1_tags})\n\
      \  AND r2.tag_name IN ({c2_tags})\nORDER BY r1.start_ts\n"
  tag_join_ego:
    description: range_tag概念 + ego表字段（时间对齐JOIN）
    sql_template: "SELECT r.start_ts, r.end_ts, r.tag_name, r.param,\n       e.{ego_fields}\n\
      FROM range_tag r\nJOIN ego e\n  ON e.ts BETWEEN r.start_ts AND r.end_ts\nWHERE\
      \ r.tag_name IN ({tag_names})\nORDER BY r.start_ts, e.ts\n"
  tag_join_dynamic_obj:
    description: range_tag概念 + dynamic_obj表字段（时间对齐JOIN）
    sql_template: "SELECT r.start_ts, r.end_ts, r.tag_name,\n       d.obj_id, d.x,\
      \ d.y, d.type, d.heading,\n       d.absolute_velocity_x, d.absolute_velocity_y\n\
      FROM range_tag r\nJOIN dynamic_obj d\n  ON d.ts BETWEEN r.start_ts AND r.end_ts\n\
      WHERE r.tag_name IN ({tag_names})\n  AND d.is_static = 0\nORDER BY r.start_ts,\
      \ d.ts\n"
  cross_table:
    description: range_tag概念 + ego + dynamic_obj（多表JOIN）
    sql_template: "SELECT r.start_ts, r.end_ts, r.tag_name,\n       e.{ego_fields},\n\
      \       d.obj_id, d.x, d.y, d.type\nFROM range_tag r\nJOIN ego e\n  ON e.ts\
      \ BETWEEN r.start_ts AND r.end_ts\nJOIN dynamic_obj d\n  ON d.ts BETWEEN r.start_ts\
      \ AND r.end_ts\nWHERE r.tag_name IN ({tag_names})\n  AND d.is_static = 0\nORDER\
      \ BY r.start_ts, e.ts\n"
  tag_join_intersection_info:
    description: range_tag概念 + intersection_info表（路口详细属性）
    sql_template: "SELECT r.start_ts, r.end_ts, r.tag_name, r.param,\n       i.intersection_id,\
      \ i.lane_count, i.ego_lane_index, i.lane_info\nFROM range_tag r\nJOIN intersection_info\
      \ i\n  ON json_extract(r.param, '$.intersection_id') = i.intersection_id\nWHERE\
      \ r.tag_name IN ({tag_names})\nORDER BY r.start_ts\n"
  tag_join_dynamic_lane:
    description: range_tag概念 + dynamic_lane表（车道级信息，时间对齐JOIN）
    sql_template: "SELECT r.start_ts, r.end_ts, r.tag_name, r.param,\n       dl.lane_id,\
      \ dl.lane_type, dl.lane_turn_type,\n       dl.ref_link_id, dl.predecessors,\
      \ dl.successors\nFROM range_tag r\nJOIN dynamic_lane dl\n  ON dl.ts BETWEEN\
      \ r.start_ts AND r.end_ts\nWHERE r.tag_name IN ({tag_names})\nORDER BY r.start_ts,\
      \ dl.ts\n"
  ego_only:
    description: 不涉及任何概念，直接查ego表
    sql_template: 'SELECT {ego_fields}

      FROM ego

      WHERE {ego_conditions}

      ORDER BY ts

      '
  cte_analysis:
    description: 复杂CTE分析：轨迹交叉、聚合统计、多步推理
    sql_template: 'WITH ... AS (...)

      SELECT ... FROM ...

      '
