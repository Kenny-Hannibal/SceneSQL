not_in_sqlite:
  description: 以下标签/结果明确不会回写到 SQLite，只输出到 JSON 文件
  categories:
  - name: db_py_rule_query_results
    description: db_py_rule/ 中 SQL SELECT 查询结果
    output: sql_query_result.json
    examples:
    - cross_conflict
    - pedestrian_crossing
    - obj_cut_in
    - ego_cut_in
    - meeting_oncoming
    - left_turn_conflict
    - right_turn_conflict
    - Intersection_Crossing
    - Intersection_Stop
    note: 这些 SQL 查询 SQLite 的 ego/dynamic_obj/range_tag 等表，结果写入 JSON
  - name: release_db_rule_py_convert_results
    description: release_db_rule_py/ 和 raw_convert_rules/ 中标签转换结果
    output: convert_sql.json
    examples:
    - Solid_LaneChange
    - Run_RedLight
    - Car_Cutin
    - VruPed_Cross
    - turning_left
    note: 基于 range_tag 已有标签做名字映射或规则转换，输出到 JSON
  - name: track_tags
    description: TrackConverter 生成的 track 标签
    output: '{bag_id}_api_track.json'
    examples:
    - ego_speed_track
    - lng_action_track
    - lat_action_track
    - navigation_command_track
    - intent_phase_track
    - traffic_light_state_track
    - lane_curvature_track
    - link_type_track
    - link_attribute_track
    - link_class_track
    note: TrackConverter 读取 sql_query_result JSON，按时间轴生成 track 片段
  - name: user_workspace_disabled
    description: user_workspace 中被 disabled 的算子
    examples:
    - CustomOperator (sufei/op_custom_operator.py, enabled=false)
    note: 即使 enabled，也只添加示例行，不是真实业务标签
  - name: unregistered_operators
    description: 代码中存在但 tokenizer_processor_new.py 中未注册的算子
    examples:
    - BrakeStop
    - AbnormalRightLaneChangeToRightestStopV4
    - AbnormalRightLaneChangeToRightestStopV6
    - SpeedIncreaseStatsOperator
    - DataStatistics
    - IntersectionCountOperator
    note: 这些算子的 add_event 不会被执行
