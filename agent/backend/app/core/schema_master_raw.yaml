range_tag:
  injection_sources:
  - id: cloud_operators_add_event
    description: tokenizer_processor_new.py 中注册的 cloud 端算子通过 add_event() 添加
    path: L2_Pred/rule_based_mining/semantic_mining/activity_new/
    mechanism: '算子调用 add_event() → events DataFrame → TokenizerResult.activity_list → to_sqlite_db._inject_range_tag_to_virtual_table() → virtual_table → SQLite

      '
    note: 标签是否出现取决于算子是否被触发（场景匹配）
  - id: car_end_behavior_tags
    description: 车端 bag 文件中的行为标签
    parser: gsbag_parser/topic_parser/em_behavior_tag_parser.py
    mechanism: 'bag 文件 beh_tag 消息 → em_behavior_tag_parser → behavior_tag_list → 经 Filter 合并后存入 label_info JSON。 在部分 pipeline 版本中，label_info 会被合并到 TokenizerResult，最终进入 SQLite。

      '
    note: 车端标签命名规范与 cloud 端不同（如 CRUISE_STRAIGHT, INTERSECTION_RIGHTTURN）
  - id: user_workspace_add_event
    description: user_workspace 自定义算子通过 add_event() 注入
    current_operators:
    - name: SlopeSchemaOperator
      author: zhanglikai
      label_id: Slope
      enabled: true
    note: 其他 user_workspace 算子（DrTrajectory, EgoAcc, MapSchema）不写 range_tag
  - id: add_table_direct
    description: 算子绕过 add_event，直接通过 add_table("range_tag") 写入 virtual_table
    current_operators:
    - name: LaneKeep
      file: op_lane_keep.py
      note: add_event 被注释掉，改用 add_table 直接写入 horizontal table
  actual_tags_from_sample_db:
    description: 从样本 DB 中 DISTINCT 查询得到的实际存在的标签（30个）
    sample_db: /mnt/gacrnd-oss/gac_liulian/common_data/sqlite_dbs/20260515_T68_1131_5bb5ec_1.5w/101ZW4jVEfmiEK5lqQEAOz202605.db
