name: turn_back_with_2_lanechange
version: '1.0'
description: turn_back_with_2_lanechange：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: turn_back_with_2_lanechange
    output_tag_name: turn_back_with_2_lanechange
    raw_sql: "SELECT \n  (SELECT MAX(ts) \n   FROM ego \n   WHERE ts <= r.start_ts\
      \ \n     AND cumulative_distance <= (SELECT e.cumulative_distance FROM ego e\
      \ WHERE e.ts = r.start_ts LIMIT 1) - 60 \n  ) AS start_ts, \n  r.end_ts + 5\
      \ AS end_ts, \n  (r.end_ts + 5) - (SELECT MAX(ts) \n                    FROM\
      \ ego \n                    WHERE ts <= r.start_ts \n                      AND\
      \ cumulative_distance <= (SELECT e.cumulative_distance FROM ego e WHERE e.ts\
      \ = r.start_ts LIMIT 1) - 60 \n                   ) AS duration, \n  -- Intersection\
      \ 关键信息 \n  r.param AS Intersection参数, \n  json_extract(r.param, '$.intersection_id')\
      \ AS 路口ID, \n  json_extract(r.param, '$.duration') AS 路口持续时间, \n  r.start_ts\
      \ AS 路口开始时间, \n  r.end_ts AS 路口结束时间, \n  -- Turning 掉头信息 \n  (SELECT json_extract(t.param,\
      \ '$.duration') \n   FROM range_tag t \n   WHERE t.tag_name = 'Turning' \n \
      \    AND json_extract(t.param, '$.sub_tag') = 'turn_back' \n     AND t.start_ts\
      \ <= r.end_ts \n     AND t.end_ts >= r.start_ts \n   LIMIT 1 \n  ) AS 掉头持续时间\
      \ \nFROM range_tag r \nWHERE r.tag_name = 'Intersection' \n  -- 路口持续时间筛选\n \
      \ AND r.end_ts - r.start_ts > 4  \n  AND json_extract(r.param, '$.sub_tag')\
      \ = 'LuturnIntersection' \n  AND (SELECT count(*) \n       FROM range_tag r2\
      \ \n       WHERE r2.tag_name = 'Turning' \n         AND json_extract(r2.param,\
      \ '$.sub_tag') = 'turn_back' \n         AND r2.start_ts <= r.end_ts \n     \
      \    AND r2.end_ts >= r.start_ts \n      ) > 0 \n  -- LANECHANGE行为筛选\n  AND\
      \ (SELECT count(*) \n       FROM range_tag lc \n       WHERE lc.tag_name LIKE\
      \ 'LANECHANGE_%' \n         AND lc.start_ts >= (SELECT MAX(ts) \n          \
      \                   FROM ego \n                             WHERE ts <= r.start_ts\
      \ \n                               AND cumulative_distance <= (SELECT e.cumulative_distance\
      \ FROM ego e WHERE e.ts = r.start_ts LIMIT 1) - 60) \n         -- 修正：从 r.start_ts\
      \ 改为 r.end_ts + 2，用2秒时间做容错率\n         AND lc.end_ts <= r.end_ts + 2\n  -- 变道数量指定\n\
      \      ) = 2"
