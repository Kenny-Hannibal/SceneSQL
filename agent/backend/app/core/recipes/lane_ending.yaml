name: lane_ending
version: '1.0'
description: 车道结束：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: lane_ending
    raw_sql: "-- 查询车道消亡场景，合并连续帧（相同lane_id且在5帧间隔内），排除倒挡，过滤持续时间小于3秒的场景\n\n-- 第一步：筛选 lane_trans_type = TRANS_TYPE_Ending 的记录\nWITH ending_frames AS (\n    SELECT\n        ts,\n        lane_id,\n        lane_trans_type,\n        lane_type,\n        lane_turn_type,\n        ref_link_id,\n        left_boundary_id,\n        right_boundary_id\n    FROM dynamic_lane\n    WHERE lane_trans_type = 'TRANS_TYPE_Ending'\n),\n\n-- 第二步：按 lane_id 分组，找到每个 lane_id 的所有时间段（5帧间隔内合并）\nlane_segments AS (\n    SELECT\n        lane_id,\n        ts,\n        -- 判断是否为新的segment：同一lane_id的前一个记录间隔超过5帧\n        CASE\n            WHEN LAG(ts) OVER (PARTITION BY lane_id ORDER BY ts) IS NULL THEN 1\n            WHEN ts - LAG(ts) OVER (PARTITION BY lane_id ORDER BY ts) > 5 THEN 1\n            ELSE 0\n        END as is_new_segment\n    FROM ending_frames\n),\n\n-- 第三步：为每个lane_id的segment分配ID，并计算每个segment的起止时间\nlane_segment_groups AS (\n    SELECT\n        lane_id,\n        ts,\n        SUM(is_new_segment) OVER (PARTITION BY lane_id\
      \ ORDER BY ts ROWS UNBOUNDED PRECEDING) as segment_id\n    FROM lane_segments\n),\n\n-- 第四步：计算每个lane_id每个segment的起止时间\nsegment_ranges AS (\n    SELECT\n        lane_id,\n        segment_id,\n        MIN(ts) as seg_start,\n        MAX(ts) as seg_end\n    FROM lane_segment_groups\n    GROUP BY lane_id, segment_id\n),\n\n-- 第五步：找到需要合并的segment（相邻segment间隔<=5帧则合并）\n-- 使用递归CTE或多次LAG来找到连通区域\nsegment_gaps AS (\n    SELECT\n        lane_id,\n        segment_id,\n        seg_start,\n        seg_end,\n        LAG(seg_end) OVER (PARTITION BY lane_id ORDER BY segment_id) as prev_seg_end,\n        -- 判断是否与上一个segment间隔<=5帧\n        CASE\n            WHEN LAG(seg_end) OVER (PARTITION BY lane_id ORDER BY segment_id) IS NULL THEN 1\n            WHEN seg_start - LAG(seg_end) OVER (PARTITION BY lane_id ORDER BY segment_id) <= 5 THEN 0\n            ELSE 1\n        END as is_new_group\n    FROM segment_ranges\n),\n\n-- 第六步：为连通区域分配group_id\nmerged_groups AS (\n    SELECT\n        lane_id,\n        segment_id,\n\
      \        seg_start,\n        seg_end,\n        SUM(is_new_group) OVER (PARTITION BY lane_id ORDER BY segment_id ROWS UNBOUNDED PRECEDING) as group_id\n    FROM segment_gaps\n),\n\n-- 第七步：计算每个连通区域的总起止时间\nfinal_ranges AS (\n    SELECT\n        lane_id,\n        group_id,\n        MIN(seg_start) as range_start,\n        MAX(seg_end) as range_end\n    FROM merged_groups\n    GROUP BY lane_id, group_id\n),\n\n-- 第八步：获取原始数据，并关联到对应的range\nenriched_frames AS (\n    SELECT\n        ef.*,\n        fr.range_start,\n        fr.range_end\n    FROM ending_frames ef\n    INNER JOIN final_ranges fr\n        ON ef.lane_id = fr.lane_id\n        AND ef.ts >= fr.range_start\n        AND ef.ts <= fr.range_end\n),\n\n-- 第九步：按range聚合统计信息\naggregated AS (\n    SELECT\n        lane_id,\n        range_start as start_ts,\n        range_end as end_ts,\n        COUNT(*) as frame_count,\n        GROUP_CONCAT(DISTINCT lane_type) as lane_types,\n        GROUP_CONCAT(DISTINCT lane_trans_type) as lane_trans_type,\n\
      \        GROUP_CONCAT(DISTINCT ref_link_id) as ref_link_ids,\n        -- 获取第一帧的lane_id\n        (SELECT lane_id FROM enriched_frames ef2\n         WHERE ef2.lane_id = ef.lane_id AND ef2.range_start = ef.range_start\n         ORDER BY ef2.ts LIMIT 1) as first_frame_lane_id\n    FROM enriched_frames ef\n    GROUP BY lane_id, range_start, range_end\n),\n\n-- 第十步：获取 ego 表中对应 start_ts 的 ego_lane_id\nego_match AS (\n    SELECT\n        a.*,\n        e.ego_lane_id\n    FROM aggregated a\n    INNER JOIN ego e ON e.ts = a.start_ts\n),\n\n-- 第十一步：筛选 ego_lane_id 与 first_frame_lane_id 匹配的记录\nmatched_scenarios AS (\n    SELECT\n        lane_id,\n        start_ts,\n        end_ts+2 as end_ts,\n        frame_count,\n        (end_ts - start_ts) as duration_sec,\n        lane_types,\n        lane_trans_type,\n        ref_link_ids,\n        ego_lane_id,\n        first_frame_lane_id\n    FROM ego_match\n    WHERE ego_lane_id = first_frame_lane_id\n),\n\n-- 第十二步：排除存在倒挡的时间段\nno_reversing_scenarios AS (\n\
      \    SELECT\n        ms.*\n    FROM matched_scenarios ms\n    WHERE NOT EXISTS (\n        SELECT 1\n        FROM range_tag rt\n        WHERE rt.tag_name = 'reversing'\n          AND rt.start_ts < ms.end_ts\n          AND rt.end_ts > ms.start_ts\n    )\n)\n\n-- 最终输出：过滤掉持续时间小于3秒的场景\nSELECT\n    'lane_ending' as tag_name,\n    lane_id,\n    start_ts,\n    end_ts,\n    frame_count,\n    duration_sec,\n    lane_types,\n    lane_trans_type,\n    ref_link_ids,\n    ego_lane_id,\n    first_frame_lane_id\nFROM no_reversing_scenarios\nWHERE duration_sec >= 3\nORDER BY start_ts;"
