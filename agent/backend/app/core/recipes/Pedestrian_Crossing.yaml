name: Pedestrian_Crossing
version: '1.0'
description: 行人横穿：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: pedestrian_crossing
    raw_sql: "-- 场景：行人出现在自车前方影响自车行为\n-- 说明：检测行人出现在自车前方10米正前方通道内的连续时间段\n--       包括行人横穿前方和行人走到车前面的情况\n--       排除在车侧面平行行走的行人（不影响车外显）\n--       不依赖obj_id追踪，按时间帧聚合\n--       要求自车不完全静止（静止车辆没有冲突价值）\n--       行人出现至少2秒\n--       输出时间前后各扩展1秒\n\nWITH \n-- 第一步：筛选前方10米正前方通道内有运动的行人帧（排除路边静止/平行走的行人）\npedestrian_frames AS (\n    SELECT DISTINCT\n        d.ts,\n        -- 统计该时间点前方行人的信息\n        COUNT(*) OVER (PARTITION BY d.ts) AS pedestrian_count,\n        MIN(SQRT(d.x * d.x + d.y * d.y)) OVER (PARTITION BY d.ts) AS min_distance,\n        AVG(SQRT(d.x * d.x + d.y * d.y)) OVER (PARTITION BY d.ts) AS avg_distance,\n        -- 标记行人是否在正前方窄通道内（ABS(y)<2，真正影响车的路径）\n        CASE \n            WHEN SUM(CASE WHEN ABS(d.y) < 2 THEN 1 ELSE 0 END) OVER (PARTITION BY d.ts) > 0\n            THEN 1 ELSE 0\n        END AS in_path_flag,\n        -- 判断行人位置分布：是否横穿（左右两侧都有行人）\n        CASE \n            WHEN SUM(CASE WHEN d.y > 0 THEN 1 ELSE 0 END) OVER (PARTITION BY d.ts) > 0\n             AND SUM(CASE WHEN d.y < 0 THEN 1\
      \ ELSE 0 END) OVER (PARTITION BY d.ts) > 0\n            THEN 'crossing'  -- 左右两侧都有行人，横穿特征\n            ELSE 'front'     -- 行人只在一侧或前方，走到车前\n        END AS presence_type\n    FROM dynamic_obj d\n    WHERE d.type = 'pedestrian'           -- 行人类型\n      AND d.x > 0                         -- 前方\n      AND d.x < 10                        -- 前方10米内\n      AND ABS(d.y) < 3                    -- 左右各3米内（收紧：排除侧面太远的行人）\n      AND (d.is_static = 0 OR d.is_static IS NULL)  -- 排除静止物体（路边停放的不是活人行为）\n      AND SQRT(d.relative_velocity_x * d.relative_velocity_x + d.relative_velocity_y * d.relative_velocity_y) > 0.5\n                                          -- 行人相对自车有明显运动（>0.5km/h），排除同向低速平行走的路人\n),\n\n-- 第二步：关联自车信息，排除自车完全静止的帧\nego_with_pedestrian AS (\n    SELECT \n        pf.ts,\n        pf.pedestrian_count,\n        pf.min_distance,\n        pf.avg_distance,\n        pf.in_path_flag,\n        pf.presence_type,\n        e.speed,\n        e.cumulative_distance,\n        -- 标记自车是否在运动（速度>0.1km/h视为运动）\n\
      \        CASE WHEN ABS(e.speed) > 0.1 THEN 1 ELSE 0 END AS is_moving\n    FROM pedestrian_frames pf\n    INNER JOIN ego e ON e.ts = pf.ts\n    WHERE ABS(e.speed) > 0.1              -- 自车必须有速度（不完全静止）\n),\n\n-- 第三步：识别连续时间段（使用Gaps & Islands技巧，不依赖obj_id）\ncontinuous_segments AS (\n    SELECT \n        MIN(ts) AS start_ts,\n        MAX(ts) AS end_ts,\n        MAX(ts) - MIN(ts) AS duration,\n        -- 统计片段内的行人信息\n        SUM(pedestrian_count) AS total_pedestrian_frames,\n        AVG(pedestrian_count) AS avg_pedestrian_count,\n        MAX(pedestrian_count) AS max_pedestrian_count,\n        ROUND(AVG(min_distance), 2) AS avg_min_distance,\n        ROUND(MIN(min_distance), 2) AS closest_distance,\n        -- 统计行人出现在正前方窄通道的帧数（真正影响车路径）\n        SUM(in_path_flag) AS in_path_frames,\n        -- 统计行人位置分布：是否包含横穿特征\n        SUM(CASE WHEN presence_type = 'crossing' THEN 1 ELSE 0 END) AS crossing_frames,\n        SUM(CASE WHEN presence_type = 'front' THEN 1 ELSE 0 END) AS front_frames,\n        --\
      \ 统计自车信息\n        ROUND(AVG(speed), 2) AS avg_speed,\n        ROUND(MIN(speed), 2) AS min_speed,\n        ROUND(MAX(speed), 2) AS max_speed,\n        MAX(cumulative_distance) - MIN(cumulative_distance) AS distance_traveled\n    FROM (\n        SELECT \n            ts,\n            pedestrian_count,\n            min_distance,\n            avg_distance,\n            in_path_flag,\n            presence_type,\n            speed,\n            cumulative_distance,\n            -- Gaps & Islands：连续时间戳的差值恒定\n            ts - ROW_NUMBER() OVER (ORDER BY ts) AS grp\n        FROM ego_with_pedestrian\n    ) t\n    GROUP BY grp\n    HAVING (MAX(ts) - MIN(ts)) >= 2     -- 行人出现至少2秒\n      AND SUM(in_path_flag) >= 1          -- 至少有1帧行人出现在正前方窄通道(ABS(y)<2)，排除全程在侧面远处的case\n),\n\n-- 第四步：过滤有效片段，并扩展时间前后各1秒\nvalid_segments AS (\n    SELECT \n        -- 输出时间前后各扩展1秒\n        start_ts - 1 AS start_ts,\n        end_ts + 1 AS end_ts,\n        duration + 2 AS duration,\n        total_pedestrian_frames,\n     \
      \   avg_pedestrian_count,\n        max_pedestrian_count,\n        avg_min_distance,\n        closest_distance,\n        in_path_frames,\n        crossing_frames,\n        front_frames,\n        -- 判断场景类型：横穿为主还是前方出现为主\n        CASE \n            WHEN crossing_frames > front_frames THEN 'crossing'\n            WHEN front_frames > crossing_frames THEN 'front'\n            ELSE 'mixed'\n        END AS scene_type,\n        avg_speed,\n        min_speed,\n        max_speed,\n        distance_traveled\n    FROM continuous_segments\n    WHERE start_ts IS NOT NULL\n      AND end_ts IS NOT NULL\n      AND end_ts > start_ts\n      -- 自车必须在片段中有位移（完全静止车辆没有冲突价值）\n      AND distance_traveled > 0\n)\n\n-- 最终输出\nSELECT \n    start_ts,\n    end_ts,\n    duration,\n    total_pedestrian_frames,\n    avg_pedestrian_count,\n    max_pedestrian_count,\n    avg_min_distance,\n    closest_distance,\n    in_path_frames,\n    crossing_frames,\n    front_frames,\n    scene_type,\n    avg_speed,\n    min_speed,\n\
      \    max_speed,\n    distance_traveled\nFROM valid_segments\nORDER BY start_ts;"
