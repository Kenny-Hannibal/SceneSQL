name: continuous_lane_change
version: '2.0'
description: 连续变道场景检测（block组装 + raw_sql直通双模式）
blocks:
  - name: tag_gap_merge
    cte_name: lane_change_groups
    params:
      tag_filter: "tag_name IN ('LANECHANGE_NAVIGATION', 'LaneChange')"
      gap_seconds: 6.0
      min_duration: 0
      pre_pad: 0.0
      post_pad: 0.0
final_select_template: |
  SELECT
      'continuous_lane_change' AS tag_name,
      scene_start_ts AS start_ts,
      scene_end_ts AS end_ts
  FROM lane_change_groups
  WHERE total_duration > 1
  ORDER BY start_ts
variants:
  default:
    tag_name: continuous_lane_change
    output_tag_name: continuous_lane_change
    raw_sql: "WITH lane_change AS (\n    SELECT *\n    FROM range_tag \n    WHERE\
      \ tag_name = 'LANECHANGE_NAVIGATION'\n)\n\nSELECT\n    'continuous_lane_change'\
      \ AS tag_name,\n    l1.start_ts AS start_ts,  -- 整体开始\n    l2.end_ts   AS end_ts\
      \     -- 整体结束\nFROM lane_change l1\nJOIN lane_change l2\n    ON l2.start_ts\
      \ between l1.end_ts and l1.end_ts+6   --第二次换道发生在第一次结束后0~6秒内"
