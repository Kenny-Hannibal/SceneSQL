name: ego_yellowlight_action
version: '1.0'
description: 黄灯行为：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: ego_yellowlight_action
    raw_sql: "-- Ego Yellowlight Action - 自车黄灯行为\n-- 功能：对黄灯状态帧打动作标签（waiting/moving/unknown）\n-- 子标签优先级（高→低）：yellowlight_waiting > yellowlight_moving > unknown\n\nWITH\n-- =====================================================\n-- Step 1: 为每帧打上动作标签（按优先级顺序，保证互斥）\n-- =====================================================\nframe_labeled AS (\n    SELECT\n        e.ts,\n        e.speed,\n        e.latest_stop_line_direction,\n        CASE\n            -- 优先级1: yellowlight_waiting（黄灯 + 停车）\n            WHEN ABS(e.speed) < 0.5\n            THEN 'yellowlight_waiting'\n\n            -- 优先级2: yellowlight_moving（黄灯 + 行驶/通过）\n            WHEN e.speed >= 0.5\n            THEN 'yellowlight_moving'\n\n            -- 兜底\n            ELSE 'unknown_yellow'\n        END AS tag_name\n    FROM ego e\n    WHERE e.traffic_light_status = 2\n),\n\n-- =====================================================\n-- Step 2: 使用窗口函数检测标签变化点\n-- =====================================================\ntag_changes AS (\n    SELECT\n\
      \        ts,\n        tag_name,\n        CASE\n            WHEN ts - LAG(ts) OVER (ORDER BY ts) > 1\n                 OR LAG(ts) OVER (ORDER BY ts) IS NULL\n                 OR LAG(tag_name) OVER (ORDER BY ts) != tag_name\n            THEN 1\n            ELSE 0\n        END AS is_change\n    FROM frame_labeled\n),\n\n-- =====================================================\n-- Step 3: 为每个连续标签段分配组ID\n-- =====================================================\ngrouped_tags AS (\n    SELECT\n        ts,\n        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) AS group_id\n    FROM tag_changes\n),\n\nbag_range AS (\n    SELECT MIN(ts) AS bag_start_ts, MAX(ts) AS bag_end_ts FROM ego\n),\n\n-- =====================================================\n-- Step 4: 聚合每个连续标签段\n-- =====================================================\naggregated_segments AS (\n    SELECT\n        tag_name,\n        MIN(ts) AS start_ts,\n        MAX(ts) + 1 AS end_ts\n    FROM grouped_tags\n\
      \    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- =====================================================\n-- 最终输出\n-- =====================================================\nSELECT\n    ag.tag_name,\n    ag.start_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END AS end_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END - ag.start_ts AS total_duration\nFROM aggregated_segments ag\nCROSS JOIN bag_range br\nORDER BY ag.start_ts;"
