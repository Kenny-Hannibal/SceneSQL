name: jerk_too_high
version: '1.0'
description: 急动度：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: jerk_too_high
    raw_sql: "WITH \n-- 配置区（可修改）\nconfig AS (\n  SELECT \n    4.0 AS acc_thresh,\n    4.0 AS dec_thresh,\n    0.4 AS min_duration\n),\ntraj_data AS (\n  SELECT\n    ts,\n    json_extract(ego_dr_trajectory,'$.speed[0]') s0,\n    json_extract(ego_dr_trajectory,'$.speed[1]') s1,\n    json_extract(ego_dr_trajectory,'$.speed[2]') s2,\n    json_extract(ego_dr_trajectory,'$.speed[3]') s3,\n    json_extract(ego_dr_trajectory,'$.speed[4]') s4\n  FROM ego\n  WHERE ego_dr_trajectory IS NOT NULL\n),\nhigh_freq AS (\n  SELECT ts+0.0 t, s0/3.6 v FROM traj_data WHERE s0 IS NOT NULL  -- km/h → m/s\n  UNION ALL SELECT ts+0.2 t, s1/3.6 v FROM traj_data WHERE s1 IS NOT NULL\n  UNION ALL SELECT ts+0.4 t, s2/3.6 v FROM traj_data WHERE s2 IS NOT NULL\n  UNION ALL SELECT ts+0.6 t, s3/3.6 v FROM traj_data WHERE s3 IS NOT NULL\n  UNION ALL SELECT ts+0.8 t, s4/3.6 v FROM traj_data WHERE s4 IS NOT NULL\n),\nnumbered AS (\n  SELECT t, v, ROW_NUMBER() OVER (ORDER BY t) rn FROM high_freq\n),\n-- 3点速度滤波\nsmoothed AS (\n\
      \  SELECT\n    n.t,\n    (COALESCE(p.v, n.v) + n.v + COALESCE(nx.v, n.v)) / 3.0 AS v,\n    n.rn\n  FROM numbered n\n  LEFT JOIN numbered p  ON p.rn  = n.rn - 1\n  LEFT JOIN numbered nx ON nx.rn = n.rn + 1\n),\n-- 加速度计算（真实时间差 + 单位正确）\nbase_acc AS (\n  SELECT\n    s.t,\n    s.v,\n    (s.v - s2.v) / (s.t - s2.t) AS acc,\n    s.rn\n  FROM smoothed s\n  JOIN smoothed s2 ON s2.rn = s.rn - 1\n),\n-- Jerk计算（真实时间差 + 单位正确）\njerk_calc AS (\n  SELECT\n    a2.t AS start_ts,\n    a1.t AS end_ts,\n    a1.acc,\n    (a1.acc - a2.acc)/(a1.t - a2.t) AS jerk\n  FROM base_acc a1\n  JOIN base_acc a2 ON a2.rn = a1.rn -1\n),\nabnormal AS (\n  SELECT * FROM jerk_calc, config\n  WHERE ABS(jerk) > (CASE WHEN acc < 0 THEN dec_thresh ELSE acc_thresh END)\n),\nresult_final AS (\n  SELECT\n    MIN(start_ts) AS start_ts,\n    MAX(end_ts) AS end_ts,\n    ROUND(MAX(end_ts)-MIN(start_ts),2) AS duration,\n    ROUND(CASE WHEN MAX(ABS(jerk)) = ABS(MAX(jerk)) THEN MAX(jerk) ELSE MIN(jerk) END,2) AS max_jerk\n  FROM abnormal\n\
      \  GROUP BY CAST(start_ts AS INTEGER)\n)\nSELECT start_ts, end_ts, duration, max_jerk\nFROM result_final, config\nWHERE duration >= min_duration\nORDER BY start_ts;"
