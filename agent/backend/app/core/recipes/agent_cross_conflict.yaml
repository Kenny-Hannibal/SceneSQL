name: agent_cross_conflict
version: '1.0'
description: 他车横穿冲突：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: agent_cross_conflict
    raw_sql: "-- 场景检索: other_vehicle_cross_conflict_v1.6\n-- 描述: 他车横穿冲突检测v1.6-修复ego_proceed_clear召回问题(轨迹避让型冲突)\n-- 创建时间: 2026-06-12\n-- 场景定义: 动态障碍物(car/truck/bus/pedestrian/motorcycle等)从自车侧方横穿道路，自车与障碍物存在冲突风险\n-- v1.0-v1.4: (见v1.5 SQL注释)\n-- v1.5:\n--   1. 增加conflict_result过滤：只保留ego确实减速让行的场景(ego_yielded_forced/smooth/proceed_risky)\n--   2. ego_yielded_smooth阈值保持v1.4水平\n-- v1.6:\n--   1. 修复ego_proceed_clear召回问题：\n--      → 召回率审计发现52VCIQk6v(VXReQNuXWKeW2202605)是真实漏检：\n--        他车横穿自车路径，自车通过轨迹偏移避让而非减速，速度反而上升(pre=22.65→during=25.24)\n--        conflict_result判定为ego_proceed_clear而被v1.5过滤\n--      → 但v1.4准确率审计中5个ego_proceed_clear全部为FP(路口正常通行/多车道并行等)\n--      → 两者差异在于：TP场景障碍物距离极近(min_dist<10)且高速横穿(cross_speed>10)且自车正在行驶(pre>10)\n--      → FP场景满足不了这三个条件的组合\n--   2. 具体修改：在conflict_result过滤中增加条件：\n--      允许ego_proceed_clear在 min_dist<10 AND pre_speed>10 AND cross_speed>10 时通过\n--      → 近距离(min_dist<10): 障碍物确实有碰撞风险\n--      → 自车行驶(pre>10): 非路口静止等待场景\n--      → 障碍物高速横穿(cross_speed>10): 非低速并行/缓行场景\n\
      \n-- ==============================================================================\n-- Scene: Other Vehicle Cross Conflict Detection v1.6\n-- 核心逻辑: 从range_tag筛选CrossConflict事件，关联ego速度和障碍物信息\n-- 关键过滤: heading_diff 40-140°、穿越中心线、grid_count<=15、time_diff 0.5-8s、距离<25m、y_range>5m\n-- v1.5新增: conflict_result必须为yielded/risky OR (ego_proceed_clear+近距离+自车行驶+高速横穿)\n-- 子场景分类: ego_yielded_forced / ego_yielded_smooth / ego_proceed_risky / ego_proceed_clear(受限)\n-- ==============================================================================\n\nWITH \n-- 第一步：从 range_tag 筛选 CrossConflict 事件\nvehicle_events AS (\n    SELECT\n        rt.start_ts - 2.0 AS start_ts,\n        rt.end_ts + 2.0 AS end_ts,\n        (rt.end_ts + 2.0) - (rt.start_ts - 2.0) AS duration,\n        rt.param,\n        json_extract(rt.param, '$.conflict_object') AS conflict_object_operator,\n        CAST(json_extract(rt.param, '$.agent_id') AS INTEGER) AS agent_id,\n        CAST(json_extract(rt.param, '$.conflict_summary.grid_count')\
      \ AS INTEGER) AS grid_count,\n        ROUND(CAST(json_extract(rt.param, '$.conflict_summary.heading_diff_mean_deg') AS REAL), 2) AS heading_diff_mean_deg,\n        ROUND(CAST(json_extract(rt.param, '$.conflict_summary.time_diff_mean_s') AS REAL), 2) AS time_diff_mean_s\n    FROM range_tag rt\n    WHERE rt.tag_name = 'CrossConflict'\n      AND COALESCE(CAST(json_extract(rt.param, '$.conflict_summary.heading_diff_mean_deg') AS REAL), 90) BETWEEN 40 AND 140\n      AND COALESCE(CAST(json_extract(rt.param, '$.conflict_summary.grid_count') AS INTEGER), 1) BETWEEN 2 AND 15\n      AND COALESCE(CAST(json_extract(rt.param, '$.conflict_summary.time_diff_mean_s') AS REAL), 5) BETWEEN 0.5 AND 8\n),\n\n-- 第二步：关联 ego 表获取自车速度信息\nEgoSpeedAnalysis AS (\n    SELECT\n        ve.start_ts, ve.end_ts, ve.duration, ve.param,\n        ve.conflict_object_operator, ve.agent_id, ve.grid_count,\n        ve.heading_diff_mean_deg, ve.time_diff_mean_s,\n        ROUND(AVG(CASE WHEN e.ts < ve.start_ts THEN e.speed\
      \ END), 2) AS pre_speed_kmh,\n        ROUND(AVG(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END), 2) AS during_speed_avg_kmh,\n        ROUND(MIN(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END), 2) AS during_min_speed_kmh,\n        ROUND(MAX(0, AVG(CASE WHEN e.ts < ve.start_ts THEN e.speed END) - \n                  MIN(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END)), 2) AS speed_drop_total_kmh,\n        ROUND(MAX(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts \n            THEN ABS(e.speed - COALESCE(e2.speed, e.speed)) END), 2) AS speed_drop_peak_1s,\n        ROUND(MAX(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts \n            THEN ABS(e.speed - COALESCE(e2.speed, e.speed)) / 1.0 * (1000.0/3600.0) END), 2) AS max_decel_mps2,\n        ROUND(MAX(e.utm_yaw) - MIN(e.utm_yaw), 2) AS yaw_range_raw,\n        MAX(e.cumulative_distance) - MIN(e.cumulative_distance) AS distance_traveled_m\n    FROM vehicle_events ve\n    LEFT JOIN\
      \ ego e ON e.ts >= ve.start_ts - 2 AND e.ts <= ve.end_ts + 2\n    LEFT JOIN ego e2 ON e2.ts = e.ts - 1\n    GROUP BY\n        ve.start_ts, ve.end_ts, ve.duration, ve.param,\n        ve.conflict_object_operator, ve.agent_id, ve.grid_count,\n        ve.heading_diff_mean_deg, ve.time_diff_mean_s\n),\n\n-- 第三步：关联 dynamic_obj 计算障碍物最小距离和真实类型\nVehicleProximity AS (\n    SELECT\n        esa.start_ts, esa.end_ts, esa.agent_id,\n        CASE WHEN COUNT(d.obj_id) = 0 THEN 999\n             ELSE ROUND(MIN(SQRT(COALESCE(d.x,0)*COALESCE(d.x,0) + COALESCE(d.y,0)*COALESCE(d.y,0))), 2)\n        END AS min_dist_to_vehicle_m,\n        GROUP_CONCAT(DISTINCT d.type) AS vehicle_type_actual,\n        CASE WHEN COUNT(d.obj_id) = 0 THEN 0\n             ELSE 1\n        END AS has_dynamic_object,\n        MAX(COALESCE(d.y,0)) - MIN(COALESCE(d.y,0)) AS vehicle_y_range_m,\n        ROUND(MAX(ABS(COALESCE(d.absolute_velocity_y,0))), 2) AS vehicle_max_cross_speed_kmh,\n        MAX(CASE WHEN d.is_static = 1 THEN 1\
      \ ELSE 0 END) AS vehicle_is_static,\n        MAX(CASE WHEN d.x > 0 THEN 1 ELSE 0 END) AS has_x_positive,\n        MAX(CASE WHEN d.y > 0 THEN 1 ELSE 0 END) AS has_positive_y,\n        MAX(CASE WHEN d.y < 0 THEN 1 ELSE 0 END) AS has_negative_y\n    FROM EgoSpeedAnalysis esa\n    LEFT JOIN dynamic_obj d \n        ON CAST(d.obj_id AS INTEGER) = esa.agent_id\n        AND d.ts BETWEEN esa.start_ts + 2 AND esa.end_ts - 2\n    GROUP BY esa.start_ts, esa.end_ts, esa.agent_id\n),\n\n-- 第四步：合并 ego速度分析 + 障碍物距离 + 计算冲突结果\nWithConflictResult AS (\n    SELECT\n        esa.*,\n        vp.min_dist_to_vehicle_m,\n        vp.vehicle_type_actual,\n        vp.has_dynamic_object,\n        vp.vehicle_y_range_m,\n        vp.vehicle_max_cross_speed_kmh,\n        vp.vehicle_is_static,\n        vp.has_x_positive,\n        vp.has_positive_y,\n        vp.has_negative_y,\n        CASE WHEN esa.yaw_range_raw > 3.14 THEN ROUND(6.28 - esa.yaw_range_raw, 2) ELSE esa.yaw_range_raw END AS delta_yaw_max,\n        CASE\n\
      \            WHEN esa.during_speed_avg_kmh IS NULL AND esa.pre_speed_kmh IS NULL THEN 'unclear'\n            WHEN esa.during_min_speed_kmh < 3 AND esa.pre_speed_kmh BETWEEN 5 AND 20 AND vp.vehicle_max_cross_speed_kmh > 0 THEN 'mutual_stop'\n            WHEN (esa.speed_drop_total_kmh > 12 \n                  OR esa.speed_drop_peak_1s > 10 \n                  OR esa.max_decel_mps2 > 2.8)\n                 AND esa.during_min_speed_kmh < 25 THEN 'ego_yielded_forced'\n            WHEN (esa.pre_speed_kmh - esa.during_speed_avg_kmh > 5\n                  OR esa.speed_drop_peak_1s > 5\n                  OR esa.max_decel_mps2 > 1.4)\n                 AND esa.during_speed_avg_kmh > 5 THEN 'ego_yielded_smooth'\n            WHEN esa.during_speed_avg_kmh >= esa.pre_speed_kmh * 0.85\n                 AND COALESCE(vp.min_dist_to_vehicle_m, 999) < 3\n                 AND esa.pre_speed_kmh > 15 THEN 'ego_proceed_risky'\n            WHEN esa.during_speed_avg_kmh >= esa.pre_speed_kmh * 0.85 THEN 'ego_proceed_clear'\n\
      \            ELSE 'ego_proceeded_cautious'\n        END AS conflict_result,\n        CASE\n            WHEN esa.pre_speed_kmh IS NULL OR esa.during_speed_avg_kmh IS NULL THEN 'unknown'\n            WHEN esa.during_min_speed_kmh < 3 AND esa.pre_speed_kmh < 15 AND vp.vehicle_max_cross_speed_kmh > 0 THEN 'boundary'\n            WHEN (esa.speed_drop_total_kmh > 12 OR esa.speed_drop_peak_1s > 10 OR esa.max_decel_mps2 > 2.8)\n                 AND esa.during_min_speed_kmh < 25 THEN 'yielded'\n            WHEN (esa.pre_speed_kmh - esa.during_speed_avg_kmh > 5 OR esa.speed_drop_peak_1s > 5 OR esa.max_decel_mps2 > 1.4)\n                 AND esa.during_speed_avg_kmh > 5 THEN 'yielded'\n            ELSE 'proceed'\n        END AS conflict_label,\n        CASE\n            WHEN esa.pre_speed_kmh IS NULL THEN 'unclear'\n            WHEN COALESCE(vp.min_dist_to_vehicle_m, 999) < 10 THEN 'critical'\n            WHEN (esa.speed_drop_total_kmh > 15 OR esa.max_decel_mps2 > 4.2)\n                 AND COALESCE(vp.min_dist_to_vehicle_m,\
      \ 999) < 20 THEN 'critical'\n            WHEN COALESCE(vp.min_dist_to_vehicle_m, 999) < 20 THEN 'moderate'\n            WHEN (esa.speed_drop_total_kmh > 8 OR esa.max_decel_mps2 > 2.2)\n                 AND COALESCE(vp.min_dist_to_vehicle_m, 999) < 30 THEN 'moderate'\n            WHEN esa.speed_drop_total_kmh > 3 OR esa.during_speed_avg_kmh < esa.pre_speed_kmh * 0.9 THEN 'minor'\n            ELSE 'no_conflict'\n        END AS severity_level\n    FROM EgoSpeedAnalysis esa\n    LEFT JOIN VehicleProximity vp ON esa.start_ts = vp.start_ts AND esa.end_ts = vp.end_ts AND esa.agent_id = vp.agent_id\n),\n\n-- 第五步：筛选有效事件（v1.6修复ego_proceed_clear召回问题）\nfinal_events AS (\n    SELECT\n        start_ts, end_ts, duration,\n        conflict_object_operator, conflict_result, conflict_label, severity_level,\n        agent_id, grid_count, heading_diff_mean_deg, time_diff_mean_s,\n        pre_speed_kmh, during_speed_avg_kmh, during_min_speed_kmh,\n        speed_drop_total_kmh, speed_drop_peak_1s, max_decel_mps2,\n\
      \        min_dist_to_vehicle_m, vehicle_type_actual, has_dynamic_object,\n        vehicle_y_range_m, vehicle_max_cross_speed_kmh,\n        has_x_positive, has_positive_y, has_negative_y,\n        delta_yaw_max, distance_traveled_m, param\n    FROM WithConflictResult\n    WHERE start_ts IS NOT NULL AND end_ts IS NOT NULL\n      AND end_ts > start_ts\n      AND distance_traveled_m > 0\n      AND delta_yaw_max < 0.35\n      AND has_dynamic_object >= 1\n      AND min_dist_to_vehicle_m < 25\n      AND vehicle_y_range_m > 4.0\n      -- v1.6: ego_proceed_clear条件更宽松(y_range>4.0即可，因为近距+高速横穿已充分验证)\n      -- 但ego_yielded/risky仍需y_range>5.0(通过conflict_result条件间接保证)\n      AND vehicle_max_cross_speed_kmh > 1.0\n      AND NOT (vehicle_y_range_m > 12 AND COALESCE(has_x_positive, 0) = 0)\n      AND COALESCE(has_positive_y, 0) = 1\n      AND COALESCE(has_negative_y, 0) = 1\n      AND duration >= 5.0\n      -- v1.6 conflict_result过滤：允许yielded/risky + 近距离高速横穿的ego_proceed_clear\n      -- 注意：ego_proceed_clear不需要单独的y_range>5.0条件，因为上面已经改为y_range>4.0\n\
      \      -- 但ego_yielded/risky需要y_range>5.0(上面的y_range>4.0仅对proceed_clear足够)\n      AND (conflict_result IN ('ego_yielded_forced', 'ego_yielded_smooth', 'ego_proceed_risky')\n               AND vehicle_y_range_m > 5.0\n           OR (conflict_result = 'ego_proceed_clear'\n               AND min_dist_to_vehicle_m < 10\n               AND COALESCE(pre_speed_kmh, 0) > 10\n               AND vehicle_max_cross_speed_kmh > 10\n               AND vehicle_y_range_m > 4.0))\n),\n\n-- 第六步：合并相邻/重叠事件\nsorted_events AS (\n    SELECT *, ROW_NUMBER() OVER (ORDER BY start_ts) AS rn FROM final_events\n),\nevent_boundaries AS (\n    SELECT *, MAX(end_ts) OVER (ORDER BY start_ts ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS prev_max_end FROM sorted_events\n),\nevent_groups AS (\n    SELECT *, SUM(CASE WHEN prev_max_end IS NULL OR start_ts > prev_max_end THEN 1 ELSE 0 END) OVER (ORDER BY start_ts ROWS UNBOUNDED PRECEDING) AS grp_id FROM event_boundaries\n),\nmerged_groups AS (\n    SELECT\n     \
      \   grp_id,\n        MIN(start_ts) AS merged_start,\n        MAX(end_ts) AS merged_end,\n        COUNT(*) AS event_count,\n        CASE \n            WHEN SUM(CASE WHEN conflict_result = 'ego_yielded_forced' THEN 1 ELSE 0 END) > 0 THEN 'ego_yielded_forced'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_yielded_smooth' THEN 1 ELSE 0 END) > 0 THEN 'ego_yielded_smooth'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_proceed_risky' THEN 1 ELSE 0 END) > 0 THEN 'ego_proceed_risky'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_proceed_clear' THEN 1 ELSE 0 END) > 0 THEN 'ego_proceed_clear'\n            ELSE 'unclear'\n        END AS severity_conflict_result,\n        CASE \n            WHEN SUM(CASE WHEN conflict_label = 'yielded' THEN 1 ELSE 0 END) > 0 THEN 'yielded'\n            WHEN SUM(CASE WHEN conflict_label = 'boundary' THEN 1 ELSE 0 END) > 0 THEN 'boundary'\n            ELSE 'proceed'\n        END AS merged_conflict_label,\n        CASE \n            WHEN SUM(CASE\
      \ WHEN severity_level = 'critical' THEN 1 ELSE 0 END) > 0 THEN 'critical'\n            WHEN SUM(CASE WHEN severity_level = 'moderate' THEN 1 ELSE 0 END) > 0 THEN 'moderate'\n            WHEN SUM(CASE WHEN severity_level = 'minor' THEN 1 ELSE 0 END) > 0 THEN 'minor'\n            ELSE 'no_conflict'\n        END AS merged_severity_level,\n        GROUP_CONCAT(DISTINCT conflict_object_operator) AS conflict_objects_operator,\n        GROUP_CONCAT(DISTINCT vehicle_type_actual) AS vehicle_types_actual,\n        GROUP_CONCAT(DISTINCT CAST(agent_id AS TEXT)) AS obj_ids,\n        SUM(grid_count) AS total_grid_count,\n        ROUND(MAX(speed_drop_total_kmh), 2) AS max_speed_drop_total,\n        ROUND(MAX(speed_drop_peak_1s), 2) AS max_speed_drop_peak,\n        ROUND(MAX(max_decel_mps2), 2) AS max_decel_peak_mps2,\n        ROUND(AVG(pre_speed_kmh), 2) AS avg_pre_speed_kmh,\n        ROUND(AVG(during_min_speed_kmh), 2) AS avg_min_speed_kmh,\n        ROUND(AVG(during_speed_avg_kmh), 2) AS avg_during_speed_kmh,\n\
      \        ROUND(MIN(min_dist_to_vehicle_m), 2) AS closest_vehicle_dist_m,\n        ROUND(MAX(vehicle_y_range_m), 2) AS max_vehicle_y_range_m,\n        ROUND(MAX(vehicle_max_cross_speed_kmh), 2) AS max_vehicle_cross_speed_kmh\n    FROM event_groups\n    GROUP BY grp_id\n),\n\n-- 第七步：丢弃合并后>30s的片段\nvalid_groups AS (\n    SELECT * FROM merged_groups WHERE merged_end - merged_start <= 30.0\n)\n\n-- 最终输出\nSELECT\n    'agent_cross_conflict' AS tag_name,\n    merged_start AS start_ts,\n    merged_end AS end_ts,\n    ROUND(merged_end - merged_start, 2) AS duration,\n    severity_conflict_result AS conflict_result,\n    merged_conflict_label AS conflict_label,\n    merged_severity_level AS severity_level,\n    vehicle_types_actual AS vehicle_type,\n    obj_ids AS obj_id,\n    total_grid_count AS grid_count,\n    max_speed_drop_total AS speed_drop_total_kmh,\n    max_speed_drop_peak AS speed_drop_peak_kmh,\n    max_decel_peak_mps2 AS decel_peak_mps2,\n    avg_pre_speed_kmh AS pre_speed_kmh,\n\
      \    avg_during_speed_kmh AS during_speed_avg_kmh,\n    avg_min_speed_kmh AS during_min_speed_kmh,\n    closest_vehicle_dist_m AS min_vehicle_dist_m,\n    max_vehicle_y_range_m AS vehicle_y_range_m,\n    max_vehicle_cross_speed_kmh AS vehicle_cross_speed_kmh\nFROM valid_groups\nORDER BY merged_start;"
