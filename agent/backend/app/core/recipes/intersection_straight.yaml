name: intersection_straight
version: '1.0'
description: 路口直行：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: intersection_straight
    raw_sql: "-- Intersection Straight - 路口直行\n-- 功能：基于 range_tag 的 topology_intersection 全系列标签，排除与 Turning 标签有任何时间重叠的片段\n-- 规则：但凡 topology_intersection 时间段与 Turning 有 0.1 秒重叠，整个时间段均不认为是路口直行，直接丢弃\n\nWITH\n-- =====================================================\n-- Step 1: 获取数据时间边界，确保输出不超出 DB 范围\n-- =====================================================\nbag_range AS (\n    SELECT MIN(ts) AS bag_start_ts, MAX(ts) AS bag_end_ts FROM ego\n),\n\n-- =====================================================\n-- Step 2: 筛选与 Turning 没有任何重叠的 topology_intersection 全系列片段\n-- =====================================================\nintersection_straight_raw AS (\n    SELECT\n        i.start_ts,\n        i.end_ts\n    FROM range_tag i\n    WHERE i.tag_name IN (\n        'topology_intersection',\n        'topology_intersection_cross_road',\n        'topology_intersection_small_cross_road',\n        'topology_intersection_t_junction',\n        'topology_intersection_small_t_junction',\n        'topology_intersection_y_junction',\n\
      \        'topology_intersection_multi_fork',\n        'topology_intersection_straight_intersection',\n        'topology_intersection_other'\n      )\n      -- 但凡与 Turning 有任何时间重叠，整个片段丢弃\n      AND NOT EXISTS (\n          SELECT 1 FROM range_tag t\n          WHERE t.tag_name = 'Turning'\n            AND t.start_ts <= i.end_ts\n            AND t.end_ts >= i.start_ts\n      )\n),\n\n-- =====================================================\n-- Step 3: 裁剪时间边界，确保不超出 DB 的 ego 时间范围\n-- =====================================================\nclipped_segments AS (\n    SELECT\n        CASE\n            WHEN sr.start_ts < br.bag_start_ts THEN br.bag_start_ts\n            ELSE sr.start_ts\n        END AS start_ts,\n        CASE\n            WHEN sr.end_ts > br.bag_end_ts THEN br.bag_end_ts\n            ELSE sr.end_ts\n        END AS end_ts\n    FROM intersection_straight_raw sr\n    CROSS JOIN bag_range br\n    WHERE sr.start_ts <= br.bag_end_ts\n      AND sr.end_ts >= br.bag_start_ts\n),\n\n--\
      \ =====================================================\n-- Step 4: 使用窗口函数检测连续片段的分界点\n-- =====================================================\ntag_changes AS (\n    SELECT\n        start_ts,\n        end_ts,\n        CASE\n            WHEN start_ts - LAG(end_ts) OVER (ORDER BY start_ts) > 1\n                 OR LAG(end_ts) OVER (ORDER BY start_ts) IS NULL\n            THEN 1\n            ELSE 0\n        END AS is_new_group\n    FROM clipped_segments\n),\n\n-- =====================================================\n-- Step 5: 为每个连续片段分配组ID\n-- =====================================================\ngrouped_intervals AS (\n    SELECT\n        start_ts,\n        end_ts,\n        SUM(is_new_group) OVER (ORDER BY start_ts) AS group_id\n    FROM tag_changes\n)\n\n-- =====================================================\n-- 最终输出：聚合连续片段为完整时间段\n-- =====================================================\nSELECT\n    'Intersection_Straight' AS tag_name,\n    MIN(start_ts) AS start_ts,\n    MAX(end_ts)\
      \ AS end_ts,\n    (MAX(end_ts) - MIN(start_ts) + 1) AS duration\nFROM grouped_intervals\nGROUP BY group_id\nHAVING COUNT(*) >= 1\nORDER BY start_ts;"
