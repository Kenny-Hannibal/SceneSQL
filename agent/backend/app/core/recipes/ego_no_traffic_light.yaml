name: ego_no_traffic_light
version: '1.0'
description: 无红绿灯：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: no_traffic_light
    raw_sql: "-- No Traffic Light - 无信号灯路段\n-- 功能：对无红绿灯的帧统一标记为no_traffic_light，聚合为连续时间段\n\nWITH\n-- =====================================================\n-- Step 1: 筛选无信号灯帧（traffic_light_status = -1）\n-- =====================================================\nno_traffic_light_frames AS (\n    SELECT\n        e.ts\n    FROM ego e\n    WHERE e.traffic_light_status = -1\n),\n\n-- =====================================================\n-- Step 2: 使用窗口函数检测标签变化点（无信号灯帧之间的断裂）\n-- =====================================================\ntag_changes AS (\n    SELECT\n        ts,\n        'no_traffic_light' AS tag_name,\n        CASE\n            WHEN ts - LAG(ts) OVER (ORDER BY ts) > 1\n                 OR LAG(ts) OVER (ORDER BY ts) IS NULL\n            THEN 1\n            ELSE 0\n        END AS is_change\n    FROM no_traffic_light_frames\n),\n\n-- =====================================================\n-- Step 3: 为每个连续标签段分配组ID\n-- =====================================================\ngrouped_tags AS\
      \ (\n    SELECT\n        ts,\n        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) AS group_id\n    FROM tag_changes\n),\n\nbag_range AS (\n    SELECT MIN(ts) AS bag_start_ts, MAX(ts) AS bag_end_ts FROM ego\n),\n\n-- =====================================================\n-- Step 4: 聚合每个连续标签段\n-- =====================================================\naggregated_segments AS (\n    SELECT\n        tag_name,\n        MIN(ts) AS start_ts,\n        MAX(ts) + 1 AS end_ts\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- =====================================================\n-- 最终输出\n-- =====================================================\nSELECT\n    ag.tag_name,\n    ag.start_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END AS end_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END - ag.start_ts AS total_duration\nFROM aggregated_segments ag\nCROSS JOIN\
      \ bag_range br\nORDER BY ag.start_ts;"
