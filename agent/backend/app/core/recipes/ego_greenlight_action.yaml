name: ego_greenlight_action
version: '1.0'
description: 绿灯通行：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: ego_greenlight_action
    raw_sql: "-- Ego Greenlight Action - 自车绿灯行为\n-- 功能：对绿灯状态帧打动作标签（waiting/not_proceeding/starting/moving/unknown）\n-- 子标签优先级（高→低）：greenlight_waiting > greenlight_not_proceeding > greenlight_starting > greenlight_moving > unknown_green\n\nWITH\n-- =====================================================\n-- Step 0: 预计算每帧前方最近静止障碍物距离（用于greenlight_waiting判定）\n-- =====================================================\nfront_static_obj AS (\n    SELECT\n        ts,\n        MIN(x) AS nearest_static_obj_distance\n    FROM (\n        SELECT\n            d.ts,\n            d.x,\n            ROW_NUMBER() OVER (PARTITION BY d.ts ORDER BY d.x ASC) AS rn\n        FROM dynamic_obj d\n        JOIN ego e ON e.ts = d.ts\n        WHERE d.x > 0\n          AND ABS(d.y) < 2\n          AND d.type IN ('car', 'truck', 'bus', 'suv')\n          AND (d.is_static = 1 OR ABS(d.absolute_velocity_x) < 5)\n          AND NOT (\n              d.obs_dr_trajectory IS NOT NULL\n              AND e.ego_dr_trajectory IS NOT NULL\n\
      \              AND COS(json_extract(d.obs_dr_trajectory, '$.theta[0]') - json_extract(e.ego_dr_trajectory, '$.theta[0]')) <= 0\n          )\n    )\n    WHERE rn = 1\n    GROUP BY ts\n),\n\n-- =====================================================\n-- Step 1: 为每帧打上动作标签（按优先级顺序，保证互斥）\n-- =====================================================\nframe_labeled AS (\n    SELECT\n        e.ts,\n        e.speed,\n        e.latest_stop_line_direction,\n        CASE\n            -- 优先级1: greenlight_waiting（绿灯 + 停车 + 前方有静止障碍物）\n            WHEN ABS(e.speed) < 0.5\n                 AND e.latest_stop_line_direction != 0\n                 AND e.latest_stop_line_direction BETWEEN -30 AND 30\n                 AND EXISTS (\n                     SELECT 1 FROM front_static_obj fso\n                     WHERE fso.ts = e.ts\n                       AND fso.nearest_static_obj_distance < 15\n                 )\n            THEN 'greenlight_waiting'\n\n            -- 优先级2: greenlight_not_proceeding（绿灯 + 停车 + 前方无静止障碍物）\n\
      \            WHEN ABS(e.speed) < 0.5\n                 AND e.latest_stop_line_direction != 0\n                 AND e.latest_stop_line_direction BETWEEN -30 AND 30\n            THEN 'greenlight_not_proceeding'\n\n            -- 优先级3: greenlight_starting（绿灯 + 起步过程中，车速0~5kph）\n            WHEN e.speed < 5\n            THEN 'greenlight_starting'\n\n            -- 优先级4: greenlight_moving（绿灯 + 行驶，车速>=5kph）\n            WHEN e.speed >= 5\n            THEN 'greenlight_moving'\n\n            -- 兜底: 其他绿灯场景\n            ELSE 'unknown_green'\n        END AS tag_name\n    FROM ego e\n    WHERE e.traffic_light_status = 1\n),\n\n-- =====================================================\n-- Step 2: 使用窗口函数检测标签变化点\n-- =====================================================\ntag_changes AS (\n    SELECT\n        ts,\n        tag_name,\n        speed,\n        CASE\n            WHEN ts - LAG(ts) OVER (ORDER BY ts) > 1\n                 OR LAG(ts) OVER (ORDER BY ts) IS NULL\n                 OR LAG(tag_name)\
      \ OVER (ORDER BY ts) != tag_name\n            THEN 1\n            ELSE 0\n        END AS is_change\n    FROM frame_labeled\n),\n\n-- =====================================================\n-- Step 3: 为每个连续标签段分配组ID\n-- =====================================================\ngrouped_tags AS (\n    SELECT\n        ts,\n        tag_name,\n        speed,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) AS group_id\n    FROM tag_changes\n),\n\nbag_range AS (\n    SELECT MIN(ts) AS bag_start_ts, MAX(ts) AS bag_end_ts FROM ego\n),\n\n-- =====================================================\n-- Step 4: 聚合每个连续标签段\n-- =====================================================\naggregated_segments AS (\n    SELECT\n        tag_name,\n        MIN(ts) AS start_ts,\n        MAX(ts) + 1 AS end_ts,\n        ROUND(MIN(speed), 2) AS min_speed,\n        ROUND(MAX(speed), 2) AS max_speed\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- =====================================================\n\
      -- 最终输出\n-- =====================================================\nSELECT\n    ag.tag_name,\n    ag.start_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END AS end_ts,\n    CASE WHEN ag.end_ts > br.bag_end_ts THEN br.bag_end_ts ELSE ag.end_ts END - ag.start_ts AS total_duration,\n    ag.min_speed,\n    ag.max_speed\nFROM aggregated_segments ag\nCROSS JOIN bag_range br\nORDER BY ag.start_ts;"
