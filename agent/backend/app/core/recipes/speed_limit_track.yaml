name: speed_limit_track
version: '1.0'
description: 限速：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Speeding_Track
    raw_sql: "-- 超速分级 Track SQL脚本\n-- 功能：通过 ego_static_map_link_id JOIN static_link 获取限速，检测超速并分级\n-- 注意：确保所有时间段都有标签，避免空值\n\nWITH ego_marked AS (\n    -- 第一步：标识连续 -1 序列的起始点\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        ego_static_map_link_id,\n        -- 标识连续序列的起始点：当前是 -1 且前一帧不是 -1\n        CASE \n            WHEN ego_static_map_link_id = -1 AND (LAG(ego_static_map_link_id) OVER (ORDER BY ts) IS NULL OR LAG(ego_static_map_link_id) OVER (ORDER BY ts) != -1)\n            THEN 1\n            ELSE 0\n        END as is_sequence_start\n    FROM ego\n    WHERE speed IS NOT NULL\n),\n\nego_with_group_id AS (\n    -- 第二步：使用累积求和为每个连续序列分配 group_id\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        ego_static_map_link_id,\n        SUM(is_sequence_start) OVER (ORDER BY ts) as group_id\n    FROM ego_marked\n),\n\nego_with_group_size AS (\n    -- 第三步：计算每个 group 的大小（连续 -1 的帧数）\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        ego_static_map_link_id,\n\
      \        group_id,\n        COUNT(*) OVER (PARTITION BY group_id) as group_size\n    FROM ego_with_group_id\n    WHERE ego_static_map_link_id = -1\n),\n\nego_all_with_size AS (\n    -- 第四步：将 group_size 关联回所有帧\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.speed,\n        e.ego_static_map_link_id,\n        COALESCE(egs.group_size, 0) as consecutive_minus_one_count\n    FROM ego_with_group_id e\n    LEFT JOIN ego_with_group_size egs ON e.ts = egs.ts\n),\n\nego_with_prev_valid AS (\n    -- 第五步：找到每个 -1 序列之前的最后一个有效 link_id\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        ego_static_map_link_id,\n        consecutive_minus_one_count,\n        -- 对每个 -1 帧，找到它之前的最后一个非 -1 的 link_id\n        MAX(CASE WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id END) OVER (\n            ORDER BY ts \n            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING\n        ) as prev_valid_link_id\n    FROM ego_all_with_size\n),\n\nego_with_filled_link AS (\n    -- 第六步：只对连续\
      \ -1 长度 ≤ 2 的序列进行前向填充\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        ego_static_map_link_id as original_link_id,\n        CASE \n            -- 如果不是 -1，使用原始值\n            WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id\n            -- 如果连续 -1 长度 > 2，不填充，保持 -1\n            WHEN consecutive_minus_one_count > 2 THEN -1\n            -- 如果连续 ≤ 2 帧，使用序列之前的有效 link_id\n            ELSE prev_valid_link_id\n        END as ego_static_map_link_id\n    FROM ego_with_prev_valid\n),\n\nego_with_limit AS (\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.speed,\n        e.ego_static_map_link_id,\n        sl.link_speed_limit,\n        sl.link_exp_speed_limit,\n        -- 使用 link_speed_limit 和 link_exp_speed_limit 中的最大值作为限速基准\n        -- 注意：SQLite 不支持 GREATEST，使用 CASE WHEN 替代\n        CASE \n            WHEN sl.link_speed_limit IS NULL AND sl.link_exp_speed_limit IS NULL THEN NULL\n            WHEN sl.link_speed_limit IS NULL THEN sl.link_exp_speed_limit\n \
      \           WHEN sl.link_exp_speed_limit IS NULL THEN sl.link_speed_limit\n            WHEN sl.link_speed_limit >= sl.link_exp_speed_limit THEN sl.link_speed_limit\n            ELSE sl.link_exp_speed_limit\n        END as speed_limit_kph,\n        CASE \n            WHEN (sl.link_speed_limit IS NULL OR sl.link_speed_limit <= 0) \n                 AND (sl.link_exp_speed_limit IS NULL OR sl.link_exp_speed_limit <= 0) THEN 'Unknown'\n            ELSE 'Known'\n        END as limit_status\n    FROM ego_with_filled_link e\n    LEFT JOIN static_link sl ON CAST(e.ego_static_map_link_id AS TEXT) = sl.link_id\n),\n\nspeed_labeled AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed,  -- 注意：ego表中的speed单位已经是km/h（在to_sqlite_db.py中已转换）\n        speed_limit_kph,\n        limit_status,\n        -- 计算超速百分比: (实际速度 - 限速) / 限速 * 100%\n        CASE \n            WHEN limit_status = 'Unknown' THEN NULL\n            ELSE ((speed - speed_limit_kph) / speed_limit_kph * 100)\n        END as speeding_percentage,\n\
      \        CASE \n            -- 无限速信息\n            WHEN limit_status = 'Unknown' THEN 'invalid_speed_limit_unknown'\n            -- 不超速：速度 <= 限速（speed单位已是km/h，无需再转换）\n            WHEN speed <= speed_limit_kph THEN 'speed_limit_normal'\n            -- 超速 0-10%\n            WHEN speed <= speed_limit_kph * 1.1 THEN 'speed_limit_speeding_0_10'\n            -- 超速 10-20%\n            WHEN speed <= speed_limit_kph * 1.2 THEN 'speed_limit_speeding_10_20'\n            -- 超速 20-50%\n            WHEN speed <= speed_limit_kph * 1.5 THEN 'speed_limit_speeding_20_50'\n            -- 超速 50%+\n            ELSE 'speed_limit_speeding_above_50'\n        END as tag_name\n    FROM ego_with_limit\n    ORDER BY ts\n),\n\n-- 第二步：使用窗口函数检测标签变化点\ntag_changes AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        speed_limit_kph,\n        limit_status,\n        speeding_percentage,\n        tag_name,\n        -- 检查当前标签是否与前一帧不同\n        CASE \n            WHEN LAG(tag_name) OVER (ORDER BY ts) !=\
      \ tag_name \n                 OR LAG(tag_name) OVER (ORDER BY ts) IS NULL \n            THEN 1 \n            ELSE 0 \n        END as is_change\n    FROM speed_labeled\n),\n\n-- 第三步：为每个连续的标签段分配组ID\ngrouped_tags AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        speed_limit_kph,\n        limit_status,\n        speeding_percentage,\n        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM tag_changes\n),\n\n-- 第四步：聚合每个组的起止时间和统计信息\naggregated_segments AS (\n    SELECT \n        tag_name,\n        MIN(ts) as start_ts,\n        MAX(ts) as end_ts,\n        MIN(ts_ms) as start_ts_ms,\n        MAX(ts_ms) as end_ts_ms,\n        COUNT(*) as frame_count,\n        -- speed单位已是km/h，无需再转换\n        ROUND(MIN(speed), 2) as min_speed_kph,\n        ROUND(MAX(speed), 2) as max_speed_kph,\n        ROUND(AVG(speed), 2) as avg_speed_kph,\n        MIN(speed_limit_kph) as min_speed_limit_kph,\n        MAX(speed_limit_kph) as max_speed_limit_kph,\n\
      \        MIN(speeding_percentage) as min_speeding_pct,\n        MAX(speeding_percentage) as max_speeding_pct,\n        AVG(speeding_percentage) as avg_speeding_pct\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    -- 注意：移除 HAVING frame_count >= 3 过滤，确保所有时间段都有标签\n    -- 短时间片段会在 Track 转换器的 _merge_short_empty_gaps 阶段被合并\n    ORDER BY start_ts\n)\n\n-- 最终输出结果\nSELECT \n    tag_name,\n    CAST(start_ts_ms * 1000000 AS INTEGER) as start_time,  -- 毫秒转纳秒\n    CAST(end_ts_ms * 1000000 AS INTEGER) as end_time,      -- 毫秒转纳秒\n    start_ts,\n    end_ts,\n    start_ts_ms,\n    end_ts_ms,\n    frame_count,\n    ROUND(min_speed_kph, 2) as min_speed_kph,\n    ROUND(max_speed_kph, 2) as max_speed_kph,\n    ROUND(avg_speed_kph, 2) as avg_speed_kph,\n    CASE \n        WHEN tag_name = 'invalid_speed_limit_unknown' THEN NULL\n        ELSE ROUND(min_speed_limit_kph, 2)\n    END as min_speed_limit_kph,\n    CASE \n        WHEN tag_name = 'invalid_speed_limit_unknown' THEN NULL\n        ELSE ROUND(max_speed_limit_kph,\
      \ 2)\n    END as max_speed_limit_kph,\n    CASE \n        WHEN tag_name = 'invalid_speed_limit_unknown' THEN NULL\n        ELSE ROUND(min_speeding_pct, 2)\n    END as min_speeding_pct,\n    CASE \n        WHEN tag_name = 'invalid_speed_limit_unknown' THEN NULL\n        ELSE ROUND(max_speeding_pct, 2)\n    END as max_speeding_pct,\n    CASE \n        WHEN tag_name = 'invalid_speed_limit_unknown' THEN NULL\n        ELSE ROUND(avg_speeding_pct, 2)\n    END as avg_speeding_pct,\n    (end_ts - start_ts) as duration\nFROM aggregated_segments;"
