name: ego_speed_track
version: '1.0'
description: 速度跟踪：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Ego_Speed_Track
    raw_sql: "-- 速度区间标签识别SQL脚本（优化版：使用ego_dr_trajectory高精度数据）\n-- 功能：基于ego_dr_trajectory中的5个时间点速度数据（0/0.2/0.4/0.6/0.8s），\n--       进行更精准的速度区间分类和时间段聚合\n-- 优化特性：\n--   1. 移除冗余字段：只输出start_ts/end_ts，删除start_ts_ms/end_ts_ms\n--   2. 边界容差机制：1m/s (3.6km/h) 容差，防止边界波动导致碎片化\n--   3. 调整速度区间：20-70, 70-110, >110 km/h\n\n-- 第一步：展开ego_dr_trajectory的5个速度点，转换为km/h\nWITH expanded_speed_points AS (\n    SELECT \n        -- 展开5个时间偏移点的速度\n        json_extract(ego_dr_trajectory, '$.speed[0]')  as speed_0s,\n        json_extract(ego_dr_trajectory, '$.speed[1]')  as speed_0_2s,\n        json_extract(ego_dr_trajectory, '$.speed[2]')  as speed_0_4s,\n        json_extract(ego_dr_trajectory, '$.speed[3]')  as speed_0_6s,\n        json_extract(ego_dr_trajectory, '$.speed[4]')  as speed_0_8s,\n        -- 对应的精确时间戳（纳秒）：基于ts_ms（毫秒）转换\n        CAST(ts_ms * 1000000 AS INTEGER) as ts_0s,\n        CAST((ts_ms + 200) * 1000000 AS INTEGER) as ts_0_2s,  -- +0.2s = +200ms\n        CAST((ts_ms + 400) * 1000000 AS INTEGER) as ts_0_4s,\
      \  -- +0.4s = +400ms\n        CAST((ts_ms + 600) * 1000000 AS INTEGER) as ts_0_6s,  -- +0.6s = +600ms\n        CAST((ts_ms + 800) * 1000000 AS INTEGER) as ts_0_8s,  -- +0.8s = +800ms\n        -- 保留原始ts_ms用于输出（单位：毫秒）\n        ts_ms\n    FROM ego\n    WHERE ego_dr_trajectory IS NOT NULL \n      AND ego_dr_trajectory != '[]'\n),\n\n-- 第二步：将5个速度点UNPIVOT为单列格式（每行一个速度点）\n-- ✅ 修复：ts字段使用纳秒时间戳，ts_ms字段保持毫秒单位\nunpivoted_speeds AS (\n    SELECT ts_0s as ts, ts_ms, speed_0s as speed_kmh FROM expanded_speed_points WHERE speed_0s IS NOT NULL\n    UNION ALL\n    SELECT ts_0_2s as ts, ts_ms + 200 as ts_ms, speed_0_2s as speed_kmh FROM expanded_speed_points WHERE speed_0_2s IS NOT NULL\n    UNION ALL\n    SELECT ts_0_4s as ts, ts_ms + 400 as ts_ms, speed_0_4s as speed_kmh FROM expanded_speed_points WHERE speed_0_4s IS NOT NULL\n    UNION ALL\n    SELECT ts_0_6s as ts, ts_ms + 600 as ts_ms, speed_0_6s as speed_kmh FROM expanded_speed_points WHERE speed_0_6s IS NOT NULL\n    UNION ALL\n    SELECT ts_0_8s\
      \ as ts, ts_ms + 800 as ts_ms, speed_0_8s as speed_kmh FROM expanded_speed_points WHERE speed_0_8s IS NOT NULL\n),\n\n-- 第三步：为每个速度点添加区间标签（带1m/s容差机制）\nspeed_labeled AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed_kmh as speed,\n        CASE \n            -- 停止: |speed| <= 0.036 km/h\n            WHEN ABS(speed_kmh) <= 0.036 THEN 'stop'\n            -- 蠕行: 0.036 < |speed| <= 5 km/h\n            WHEN ABS(speed_kmh) > 0.036 AND ABS(speed_kmh) <= 5 THEN 'creeping_0_5kmh'\n            -- 低速: 5 < |speed| <= 20 km/h\n            WHEN ABS(speed_kmh) > 5 AND ABS(speed_kmh) <= 20 THEN 'low_5_20kmh'\n            -- 中速: 20 < |speed| <= 70 km/h (带1m/s=3.6km/h容差)\n            WHEN ABS(speed_kmh) > (20 - 3.6) AND ABS(speed_kmh) <= (70 + 3.6) THEN 'medium_20_70kmh'\n            -- 高速: 70 < |speed| <= 110 km/h (带1m/s=3.6km/h容差)\n            WHEN ABS(speed_kmh) > (70 - 3.6) AND ABS(speed_kmh) <= (110 + 3.6) THEN 'high_70_110kmh'\n            -- 超高速: |speed| > 110 km/h (带1m/s=3.6km/h容差)\n\
      \            WHEN ABS(speed_kmh) > (110 - 3.6) THEN 'ultra_high_above_110kmh'\n            ELSE 'unknown'\n        END as tag_name\n    FROM unpivoted_speeds\n),\n\n-- 第四步：使用窗口函数检测标签变化点\ntag_changes AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        tag_name,\n        -- 检查当前标签是否与前一帧不同\n        CASE \n            WHEN LAG(tag_name) OVER (ORDER BY ts) != tag_name \n                 OR LAG(tag_name) OVER (ORDER BY ts) IS NULL \n            THEN 1 \n            ELSE 0 \n        END as is_change\n    FROM speed_labeled\n),\n\n-- 第五步：为每个连续的标签段分配组ID\ngrouped_tags AS (\n    SELECT \n        ts,\n        ts_ms,\n        speed,\n        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM tag_changes\n),\n\n-- 第六步：聚合每个组的起止时间和统计信息\naggregated_segments AS (\n    SELECT \n        tag_name,\n        MIN(ts) / 1000000000.0 as start_ts,  -- 纳秒 → 秒（供sql_query_processor转换为纳秒）\n        MAX(ts) / 1000000000.0 as end_ts,    -- 纳秒 → 秒\n\
      \        -- 按0.1s帧间隔计算帧数：(end_ts - start_ts) / 0.1 + 1\n        CAST((MAX(ts) - MIN(ts)) / 100000000.0 AS INTEGER) + 1 as frame_count,\n        AVG(speed) as avg_speed,\n        MIN(speed) as min_speed,\n        MAX(speed) as max_speed\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- 最终输出结果\nSELECT \n    tag_name,\n    start_ts,\n    end_ts,\n    frame_count,\n    ROUND(avg_speed, 2) as avg_speed,\n    ROUND(min_speed, 2) as min_speed,\n    ROUND(max_speed, 2) as max_speed\nFROM aggregated_segments;"
