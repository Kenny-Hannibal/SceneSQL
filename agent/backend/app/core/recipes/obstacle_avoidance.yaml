name: obstacle_avoidance
version: '1.0'
description: 产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: obstacle_avoidance
    raw_sql: "WITH \n-- 角度转换常量\nDEG_15_RAD AS (SELECT 0.69 AS val),   -- 15度 = 0.2618弧度\nDEG_90_RAD AS (SELECT 1.5708 AS val),   -- 90度 = 1.5708弧度\n\n-- 第一步：找出纵向10m内检测到障碍物的时刻（横向阈值1米，速度>10km/h）\nobstacle_detected AS (\n    SELECT \n        o.ts, \n        o.x, \n        o.y, \n        o.obj_id,\n        e.speed AS ego_speed\n    FROM static_obj o\n    INNER JOIN ego e ON o.ts = e.ts\n    WHERE \n        o.type = 'traffic_warning_object'\n        AND o.x > 0          -- 前方\n        AND o.x < 15         -- 纵向15米内\n        AND ABS(o.y) < 1.4     -- 横向1米内（同车道）\n        AND e.speed > 0     -- 自车速度>0km/h（前向行驶）\n),\n\n-- 第二步：找出检测时刻自车转向角<15度的记录（初始接近状态）\ninitial_approach AS (\n    SELECT DISTINCT\n        o.ts AS detect_ts, \n        o.x, \n        o.y, \n        o.obj_id, \n        o.ego_speed,\n        e.steering_angle AS initial_steering\n    FROM obstacle_detected o\n    INNER JOIN ego e ON o.ts = e.ts\n    CROSS JOIN DEG_15_RAD d15\n    WHERE ABS(e.steering_angle) < d15.val  -- 转向角<15度\n), \n\
      \n-- 第三步：对每个检测时刻，检查后续10秒内是否有反打方向盘行为\n-- 反打定义：先>90度（左或右），然后反方向>90度\navoidance_events AS (\n    SELECT \n        ia.detect_ts, \n        ia.x, \n        ia.y, \n        ia.obj_id, \n        ia.ego_speed,\n        ia.initial_steering,\n        -- 找后续15秒内第一次急转>90度的时刻和方向\n        (\n            SELECT MIN(e1.ts) \n            FROM ego e1 \n            CROSS JOIN DEG_90_RAD d90 \n            WHERE e1.ts > ia.detect_ts \n              AND e1.ts <= ia.detect_ts + 10 \n              AND ABS(e1.steering_angle) > d90.val \n        ) AS first_turn_ts,\n        -- 记录第一次急转的方向\n        (\n            SELECT e1.steering_angle \n            FROM ego e1 \n            CROSS JOIN DEG_90_RAD d90 \n            WHERE e1.ts = (\n                SELECT MIN(e2.ts) \n                FROM ego e2 \n                CROSS JOIN DEG_90_RAD d90_2 \n                WHERE e2.ts > ia.detect_ts \n                  AND e2.ts <= ia.detect_ts + 10 \n                  AND ABS(e2.steering_angle) > d90_2.val \n            )\n\
      \            AND ABS(e1.steering_angle) > d90.val\n            LIMIT 1\n        ) AS first_turn_angle,\n        -- 找反方向急转>90度的时刻（反打）\n        (\n            SELECT MIN(e3.ts) \n            FROM ego e3 \n            CROSS JOIN DEG_90_RAD d90 \n            WHERE e3.ts > ia.detect_ts \n              AND e3.ts <= ia.detect_ts + 10 \n              AND ABS(e3.steering_angle) > d90.val \n              AND e3.steering_angle * (\n                  SELECT e4.steering_angle \n                  FROM ego e4 \n                  CROSS JOIN DEG_90_RAD d90_2 \n                  WHERE e4.ts = (\n                      SELECT MIN(e5.ts) \n                      FROM ego e5 \n                      CROSS JOIN DEG_90_RAD d90_3 \n                      WHERE e5.ts > ia.detect_ts \n                        AND e5.ts <= ia.detect_ts + 10 \n                        AND ABS(e5.steering_angle) > d90_3.val \n                  )\n                  AND ABS(e4.steering_angle) > d90_2.val\n                  LIMIT 1\n \
      \             ) < 0  -- 方向相反（乘积为负）\n        ) AS counter_turn_ts\n    FROM initial_approach ia\n), \n\n-- 第四步：筛选出真正有避障行为的记录（必须同时满足第一次急转和反打）\nvalid_avoidance AS (\n    SELECT \n        detect_ts, \n        x, \n        y, \n        obj_id, \n        ego_speed,\n        initial_steering, \n        first_turn_ts,\n        first_turn_angle,\n        CASE \n            WHEN first_turn_angle > 0 THEN 'LEFT'\n            ELSE 'RIGHT'\n        END AS first_turn_direction,\n        counter_turn_ts,\n        CASE \n            WHEN first_turn_angle > 0 THEN 'RIGHT'\n            ELSE 'LEFT'\n        END AS counter_turn_direction\n    FROM avoidance_events \n    WHERE first_turn_ts IS NOT NULL \n      AND counter_turn_ts IS NOT NULL \n), \n\n-- 第五步：生成可视化时间区间\n-- start_ts: 检测时刻往前2秒\n-- end_ts: 反打时刻往后3秒\ntime_intervals AS (\n    SELECT \n        detect_ts - 2 AS start_ts,        -- 检测前2秒\n        counter_turn_ts + 3 AS end_ts,     -- 反打后3秒\n        detect_ts, \n        first_turn_ts,\n        counter_turn_ts,\n\
      \        obj_id, \n        x AS obstacle_distance,\n        ego_speed,\n        first_turn_direction,\n        counter_turn_direction\n    FROM valid_avoidance \n), \n\n-- 第六步：合并重叠区间并输出\nmerged_groups AS (\n    SELECT \n        start_ts, \n        end_ts, \n        detect_ts, \n        obj_id, \n        obstacle_distance,\n        ego_speed,\n        first_turn_direction,\n        counter_turn_direction,\n        SUM(is_new_group) OVER (ORDER BY start_ts) AS group_id\n    FROM (\n        SELECT \n            start_ts, \n            end_ts, \n            detect_ts, \n            obj_id, \n            obstacle_distance,\n            ego_speed,\n            first_turn_direction,\n            counter_turn_direction,\n            CASE \n                WHEN start_ts > LAG(end_ts) OVER (ORDER BY start_ts) \n                THEN 1 \n                ELSE 0 \n            END AS is_new_group \n        FROM time_intervals \n    ) t\n),\n\n-- 第七步：排除存在倒挡的时间段\n-- 筛选出与倒挡时间段没有重叠的区间\nno_reversing_groups\
      \ AS (\n    SELECT \n        mg.*\n    FROM merged_groups mg\n    WHERE NOT EXISTS (\n        SELECT 1 \n        FROM range_tag rt \n        WHERE rt.tag_name = 'reversing'\n          AND rt.start_ts < mg.end_ts   -- 倒挡开始时间 < 当前区间结束时间\n          AND rt.end_ts > mg.start_ts   -- 倒挡结束时间 > 当前区间开始时间\n    )\n)\n\nSELECT \n    'obstacle_avoidance' AS tag_name,\n    MIN(start_ts) AS start_ts, \n    MAX(end_ts) AS end_ts, \n    (MAX(end_ts) - MIN(start_ts)) AS duration, \n    COUNT(DISTINCT detect_ts) AS avoidance_count, \n    GROUP_CONCAT(DISTINCT obj_id) AS obstacle_ids, \n    ROUND(AVG(obstacle_distance), 2) AS avg_obstacle_distance,\n    ROUND(AVG(ego_speed), 2) AS avg_ego_speed,\n    GROUP_CONCAT(DISTINCT first_turn_direction || '-' || counter_turn_direction) AS turn_patterns\nFROM no_reversing_groups \nGROUP BY group_id \nORDER BY start_ts;"
