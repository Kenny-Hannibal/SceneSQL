name: obj_cut_in
version: '1.0'
description: 他车切入：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: obj_cut_in
    raw_sql: "-- 场景检索: Obj_CutIn_v2\n-- 描述: 他车切入自车前方 v2.0 — 借鉴 Other_CutIn_Ego_Yield 的两阶段检测模式\n-- 核心改进:\n--   1. 两阶段时序检测: 邻车道(adjacent) → 自车道(ego) 的显式时序转换\n--   2. 更精细的车道位置判定: ego_lane / adjacent_lane / far 三区域\n--   3. 精确的减速验证: cutin前3s最大速度 vs cutin后5s最小速度\n--   4. acc_magnitude辅助验证: 排除传感器噪声导致的假减速\n--   5. 过滤自车变道/转弯时段: 排除自车主动变道引起的相对运动\n--   6. 放宽时长约束: 不再要求 seg_duration > 5，快速cutin(2s+)也能捕获\n-- 基于: obj_cut_in (原版) + other_cutin_ego_yield (v4.1)\n-- 创建时间: 2026-06-17\n\nWITH \n-- ★ 自车变道时间段（排除自车变道导致的相对运动假cutin）\nego_lane_change_periods AS (\n    SELECT start_ts, end_ts FROM range_tag\n    WHERE tag_name IN ('LaneChange', 'LANECHANGE_MERGELANECHANGEDROP', 'LANECHANGE_NAVIGATION',\n        'LANECHANGE_FREEWAY', 'LANECHANGE_AVOIDANCE',\n        'LANECHANGE_OVERTAKELEFTCARORTRUCK', 'LANECHANGE_OVERTAKERIGHTCARORTRUCK',\n        'LANECHANGE_MERGELANECHANGEZIPPER', 'LANECHANGE_MERGELANECHANGEMAINROAD',\n        'LANECHANGE_NAVLANECHANGERAMP')\n),\n\n-- ★ 弯道/转弯时间段\nturning_periods AS (\n    SELECT\
      \ start_ts, end_ts FROM range_tag\n    WHERE tag_name = 'Turning'\n),\n\n-- 第一步：逐帧追踪前方机动车辆，关联自车信息\nobj_frames AS (\n    SELECT \n        d.ts, d.obj_id, d.type, d.x, d.y, d.l,\n        d.relative_velocity_x, d.relative_velocity_y,\n        d.absolute_velocity_x, d.absolute_velocity_y,\n        d.obs_to_centerline_dist,\n        e.speed AS ego_speed\n    FROM dynamic_obj d\n    INNER JOIN ego e ON e.ts = d.ts\n    WHERE d.type IN ('car', 'truck', 'bus')\n      AND d.x > -5 AND d.x < 30\n      AND ABS(d.y) < 6\n      AND (d.is_static = 0 OR d.is_static IS NULL)\n      AND ABS(e.speed) > 3\n),\n\n-- ★ 改进1：三区域车道位置判定（借鉴 other_cutin_ego_yield）\nlane_marked AS (\n    SELECT *,\n        CASE \n            WHEN ABS(y) < 1.2 THEN 'ego_lane'\n            WHEN ABS(y) >= 1.8 AND ABS(y) < 5.5 THEN 'adjacent_lane'\n            ELSE 'transition'  -- 1.2~1.8之间的过渡区域\n        END AS lane_pos,\n        CASE WHEN y > 0 THEN 'left' ELSE 'right' END AS side\n    FROM obj_frames\n),\n\n-- 只保留 ego_lane 和 adjacent_lane\
      \ 的帧\nfiltered AS (\n    SELECT * FROM lane_marked \n    WHERE lane_pos IN ('ego_lane', 'adjacent_lane')\n),\n\n-- ★ 改进2：Gaps & Islands 按 (obj_id, lane_pos, side) 分组\n-- 同一辆车在邻车道和自车道分别产生独立的segment\nnumbered AS (\n    SELECT *,\n        ts - ROW_NUMBER() OVER (\n            PARTITION BY obj_id, lane_pos, side ORDER BY ts\n        ) AS grp\n    FROM filtered\n),\n\nsegments AS (\n    SELECT \n        obj_id, type, lane_pos, side,\n        MIN(ts) AS start_ts, MAX(ts) AS end_ts, \n        COUNT(*) AS duration,\n        MIN(x) AS min_x, AVG(x) AS avg_x,\n        AVG(y) AS avg_y, MIN(ABS(y)) AS min_abs_y,\n        AVG(relative_velocity_y) AS avg_rel_vy,\n        MIN(SQRT(x*x + y*y)) AS min_distance\n    FROM numbered\n    GROUP BY obj_id, grp, type, lane_pos, side\n    HAVING COUNT(*) >= 2\n),\n\n-- ★ 改进3：两阶段时序检测 — 邻车道 → 自车道\n-- 要求同一obj_id先在 adjacent_lane 出现，然后在 ego_lane 出现\n-- 自车道段必须在邻车道段结束后3秒内开始（允许一定过渡时间）\ncutin_seq AS (\n    SELECT \n        s1.obj_id, s1.type, s1.side,\n        s1.start_ts\
      \ AS adj_start, s1.end_ts AS adj_end, s1.duration AS adj_duration,\n        s1.min_x AS adj_min_x, s1.avg_y AS adj_avg_y, s1.min_abs_y AS adj_min_abs_y,\n        s1.min_distance AS adj_min_distance,\n        s2.start_ts AS ego_start, s2.end_ts AS ego_end, s2.duration AS ego_duration,\n        s2.min_x AS ego_min_x, s2.avg_x AS ego_avg_x, s2.avg_y AS ego_avg_y,\n        s2.min_distance AS ego_min_distance\n    FROM segments s1\n    JOIN segments s2 \n        ON s1.obj_id = s2.obj_id\n        AND s1.lane_pos = 'adjacent_lane' \n        AND s2.lane_pos = 'ego_lane'\n        AND s1.side = s2.side  -- 确保同侧（都是从左侧或都是从右侧切入）\n        AND s2.start_ts BETWEEN s1.end_ts AND s1.end_ts + 3\n    WHERE s1.min_x < 25   -- 邻车道时不能太远\n      AND s2.min_x < 15   -- 进入自车道后要足够近\n      AND ABS(s1.avg_y) > 1.5  -- 邻车道时确实偏在一侧\n),\n\n-- ★ 改进4：精确减速验证 — 对比cutin前最大速度 vs cutin后最小速度\ncutin_with_speed AS (\n    SELECT cs.*,\n        -- cutin发生前3秒内自车最大速度（baseline）\n        (SELECT MAX(speed) FROM ego e2 \n         WHERE\
      \ e2.ts BETWEEN cs.adj_start - 3 AND cs.adj_start) AS pre_max_speed,\n        -- 他车进入自车道后5秒内自车最小速度（响应）\n        (SELECT MIN(speed) FROM ego e2 \n         WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_min_speed,\n        (SELECT MAX(speed) FROM ego e2 \n         WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_max_speed,\n        (SELECT COUNT(*) FROM ego e2 \n         WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_ego_frames,\n        -- ★ acc_magnitude辅助验证（排除传感器噪声假减速）\n        (SELECT MAX(e2.acc_magnitude) FROM ego e2 \n         WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS max_acc_mag,\n        (SELECT AVG(e2.acc_magnitude) FROM ego e2 \n         WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS avg_acc_mag\n    FROM cutin_seq cs\n)\n\nSELECT \n    'obj_cut_in' AS tag_name,\n    obj_id, type, side AS cutin_direction,\n    adj_start AS start_ts,\n    ego_end AS end_ts,\n    adj_start, adj_end, ego_start, ego_end,\n    adj_duration,\
      \ ego_duration,\n    ROUND(adj_min_x, 1) AS adj_min_x, \n    ROUND(ego_min_x, 1) AS ego_min_x,\n    ROUND(adj_avg_y, 1) AS adj_avg_y,\n    ROUND(ego_avg_y, 1) AS ego_avg_y,\n    ROUND(adj_min_distance, 1) AS adj_min_distance,\n    ROUND(ego_min_distance, 1) AS ego_min_distance,\n    ROUND(pre_max_speed, 1) AS pre_max_speed, \n    ROUND(post_min_speed, 1) AS post_min_speed,\n    ROUND(post_max_speed, 1) AS post_max_speed,\n    ROUND(pre_max_speed - post_min_speed, 1) AS speed_drop,\n    post_ego_frames,\n    ROUND(max_acc_mag, 2) AS max_acc_magnitude,\n    ROUND(avg_acc_mag, 2) AS avg_acc_magnitude,\n    CASE \n        WHEN post_min_speed < 3 THEN 'cutin_then_stop'\n        WHEN pre_max_speed - post_min_speed >= 8 THEN 'cutin_hard_yield'\n        WHEN pre_max_speed - post_min_speed >= 4 THEN 'cutin_soft_yield'\n        ELSE 'cutin_mild_yield'\n    END AS sub_scenario,\n    type AS conflict_object,\n    CASE \n        WHEN (pre_max_speed - post_min_speed) > 15 AND post_min_speed < 5\
      \ THEN 'mutual_stop'\n        WHEN (pre_max_speed - post_min_speed) > 10 THEN 'ego_yielded'\n        WHEN (pre_max_speed - post_min_speed) > 5 AND post_min_speed < pre_max_speed * 0.5 THEN 'ego_proceeded_forced'\n        ELSE 'ego_proceeded_clear'\n    END AS game_theory_result\nFROM cutin_with_speed\nWHERE pre_max_speed - post_min_speed > 4   -- 自车速度下降超过4km/h\n  AND post_min_speed > 3                     -- 排除自车停车场景\n  AND post_ego_frames >= 4                   -- 足够帧数验证\n  AND ego_duration >= 2                      -- 自车道段至少2帧\n  -- ★ 排除自车变道期间（自车变道时的相对运动不是他车cutin）\n  AND NOT EXISTS (\n      SELECT 1 FROM ego_lane_change_periods elc\n      WHERE adj_start <= elc.end_ts AND ego_end >= elc.start_ts\n  )\n  -- ★ 排除弯道\n  AND NOT EXISTS (\n      SELECT 1 FROM turning_periods tp\n      WHERE adj_start <= tp.end_ts AND ego_end >= tp.start_ts\n  )\n  -- ★ acc_magnitude辅助验证（减速时acc_magnitude通常>0.5）\n  AND (max_acc_mag >= 0.5 OR max_acc_mag IS NULL)\nORDER BY ego_start;"
