name: ego_cut_in
version: '1.0'
description: 自车切入：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: ego_cut_in
    raw_sql: "-- 场景检索: Ego_CutIn_v2\n-- 描述: 自车变道切入 v2.0 — 借鉴 Ego_SmallGap_CutIn 的方向感知+gap检测模式\n-- 核心改进:\n--   1. 利用sub_tag获取变道方向(LeftLaneChange/RightLaneChange)，不再仅靠y值猜测\n--   2. 同时检测目标车道的lead车和follow车，计算实际gap\n--   3. adjusted_gap作为互动紧密度指标（减去车长的一半）\n--   4. 扩大检测范围(x:-30~60)以捕获follow车，不再只看前方(x:0~25)\n--   5. 增加ego速度变化分析（变道前后速度对比）\n--   6. 增加acc_magnitude验证（区分主动切入vs被迫切入）\n-- 基于: ego_cut_in (原版) + ego_smallgap_cutin (v2.1)\n-- 创建时间: 2026-06-17\n\nWITH \n-- ★ 第一步：自车变道时间段，提取变道方向\nlane_change_periods AS (\n    SELECT \n        start_ts, end_ts, end_ts - start_ts AS lc_duration,\n        tag_name AS lc_tag,\n        json_extract(param, '$.sub_tag') AS sub_tag,\n        CASE \n            WHEN json_extract(param, '$.sub_tag') = 'LeftLaneChange' THEN 'left'\n            WHEN json_extract(param, '$.sub_tag') = 'RightLaneChange' THEN 'right'\n            ELSE NULL\n        END AS lc_direction\n    FROM range_tag\n    WHERE tag_name IN ('LaneChange', 'LANECHANGE_MERGELANECHANGEDROP', 'LANECHANGE_NAVIGATION',\n\
      \        'LANECHANGE_FREEWAY', 'LANECHANGE_AVOIDANCE',\n        'LANECHANGE_OVERTAKELEFTCARORTRUCK', 'LANECHANGE_OVERTAKERIGHTCARORTRUCK',\n        'LANECHANGE_MERGELANECHANGEZIPPER', 'LANECHANGE_MERGELANECHANGEMAINROAD',\n        'LANECHANGE_NAVLANECHANGERAMP')\n      AND (end_ts - start_ts) >= 1\n),\n\n-- ★ 检测窗口：变道前后各2秒\nlc_windows AS (\n    SELECT \n        start_ts, end_ts, lc_duration, lc_tag, sub_tag, lc_direction,\n        start_ts - 2 AS window_start,\n        end_ts + 2 AS window_end\n    FROM lane_change_periods\n    WHERE lc_direction IS NOT NULL  -- 必须有明确方向\n),\n\n-- ★ 第二步：在变道窗口内追踪目标车道的所有车辆\n-- 根据变道方向筛选y值（左变道看y>0，右变道看y<0）\ntarget_obj_frames AS (\n    SELECT \n        lw.start_ts, lw.end_ts, lw.lc_direction, lw.lc_duration, lw.lc_tag,\n        d.ts, d.obj_id, d.x, d.y, d.l, d.type,\n        d.relative_velocity_x, d.relative_velocity_y,\n        d.x*d.x + d.y*d.y AS dist_sq\n    FROM lc_windows lw\n    INNER JOIN dynamic_obj d ON d.ts BETWEEN lw.window_start AND lw.window_end\n\
      \    WHERE d.type IN ('car', 'truck', 'bus')\n      AND d.x > -30 AND d.x < 60  -- ★ 扩大范围，捕获follow车\n      AND (d.is_static = 0 OR d.is_static IS NULL)\n      AND (\n          (lw.lc_direction = 'left' AND d.y > 0.3 AND d.y < 8)\n          OR (lw.lc_direction = 'right' AND d.y < -0.3 AND d.y > -8)\n      )\n),\n\n-- ★ 第三步：按obj_id聚合，区分lead/follow车\nobj_stats AS (\n    SELECT \n        start_ts, obj_id, type, lc_direction,\n        COUNT(*) AS obj_frames,\n        AVG(x) AS avg_x,\n        AVG(l) AS avg_l,\n        MIN(dist_sq) AS min_dist_sq,\n        -- lead车：在自车前方(x>0)的最近x距离\n        MIN(CASE WHEN x > 0 THEN x END) AS lead_min_x,\n        -- follow车：在自车后方(x<0)的最近x距离（负值，越接近0越近）\n        MAX(CASE WHEN x < 0 THEN x END) AS follow_max_x,\n        CASE WHEN AVG(x) > 0 THEN 'lead' ELSE 'follow' END AS obj_position,\n        AVG(relative_velocity_x) AS avg_rel_vx\n    FROM target_obj_frames\n    GROUP BY start_ts, obj_id, type\n    HAVING COUNT(*) >= 2\n),\n\n-- 每次变道选出最近的lead车和follow车\n\
      key_obj_per_lc AS (\n    SELECT \n        start_ts, obj_id, type, avg_l, obj_position,\n        obj_frames, avg_x, min_dist_sq, lead_min_x, follow_max_x,\n        avg_rel_vx,\n        ROW_NUMBER() OVER (\n            PARTITION BY start_ts, obj_position \n            ORDER BY min_dist_sq ASC\n        ) AS rn\n    FROM obj_stats\n),\n\nlead_obj AS (\n    SELECT start_ts, obj_id AS lead_obj_id, type AS lead_type, avg_l AS lead_len,\n           avg_x AS lead_avg_x, lead_min_x, avg_rel_vx AS lead_avg_rel_vx\n    FROM key_obj_per_lc\n    WHERE obj_position = 'lead' AND rn = 1\n),\n\nfollow_obj AS (\n    SELECT start_ts, obj_id AS follow_obj_id, type AS follow_type, avg_l AS follow_len,\n           avg_x AS follow_avg_x, follow_max_x, avg_rel_vx AS follow_avg_rel_vx\n    FROM key_obj_per_lc\n    WHERE obj_position = 'follow' AND rn = 1\n),\n\n-- ★ 第四步：计算gap + 自车速度变化\ncutin_events AS (\n    SELECT \n        lw.start_ts, lw.end_ts, lw.lc_duration, lw.lc_tag, lw.sub_tag, lw.lc_direction,\n \
      \       lo.lead_obj_id, lo.lead_type, lo.lead_len, lo.lead_avg_x, lo.lead_min_x,\n        lo.lead_avg_rel_vx,\n        fo.follow_obj_id, fo.follow_type, fo.follow_len, fo.follow_avg_x, fo.follow_max_x,\n        fo.follow_avg_rel_vx,\n        -- 原始gap: lead车尾 - follow车头\n        COALESCE(lo.lead_min_x, 999) - COALESCE(fo.follow_max_x, -999) AS raw_gap,\n        -- 调整后gap: 减去车长的一半（更贴近实际间距）\n        COALESCE(lo.lead_min_x, 999) - COALESCE(fo.follow_max_x, -999) \n            - COALESCE(lo.lead_len, 4.5) * 0.5 \n            - COALESCE(fo.follow_len, 4.5) * 0.5 AS adjusted_gap,\n        -- ★ 自车速度分析（借鉴 other_cutin_ego_yield 的pre/post模式）\n        (SELECT MAX(speed) FROM ego e2 \n         WHERE e2.ts BETWEEN lw.start_ts - 3 AND lw.start_ts) AS pre_max_speed,\n        (SELECT MIN(speed) FROM ego e2 \n         WHERE e2.ts BETWEEN lw.start_ts AND lw.end_ts + 3) AS lc_min_speed,\n        (SELECT MAX(speed) FROM ego e2 \n         WHERE e2.ts BETWEEN lw.start_ts AND lw.end_ts + 3) AS lc_max_speed,\n\
      \        (SELECT MAX(e2.acc_magnitude) FROM ego e2 \n         WHERE e2.ts BETWEEN lw.start_ts AND lw.end_ts + 3) AS max_acc_mag\n    FROM lc_windows lw\n    LEFT JOIN lead_obj lo ON lo.start_ts = lw.start_ts\n    LEFT JOIN follow_obj fo ON fo.start_ts = lw.start_ts\n)\n\nSELECT \n    'ego_cut_in' AS tag_name,\n    start_ts, end_ts, lc_duration, lc_tag, sub_tag, lc_direction,\n    lead_obj_id, lead_type, ROUND(lead_avg_x, 1) AS lead_avg_x,\n    follow_obj_id, follow_type, ROUND(follow_avg_x, 1) AS follow_avg_x,\n    ROUND(raw_gap, 2) AS raw_gap,\n    ROUND(adjusted_gap, 2) AS adjusted_gap,\n    ROUND(pre_max_speed, 1) AS pre_max_speed,\n    ROUND(lc_min_speed, 1) AS lc_min_speed,\n    ROUND(lc_max_speed, 1) AS lc_max_speed,\n    ROUND(pre_max_speed - lc_min_speed, 1) AS speed_drop,\n    ROUND(max_acc_mag, 2) AS max_acc_magnitude,\n    -- ★ 切入类型细分\n    CASE \n        WHEN adjusted_gap < 0 THEN 'cutin_very_tight'     -- gap<0: 极其紧密的切入\n        WHEN adjusted_gap < 1.5 THEN 'cutin_tight'\
      \         -- 0~1.5m: 紧密切入\n        WHEN adjusted_gap < 3 THEN 'cutin_moderate'        -- 1.5~3m: 中等切入\n        ELSE 'cutin_comfortable'                            -- >3m: 宽裕切入\n    END AS cutin_category,\n    -- ★ 博弈结果（与原版保持一致的格式）\n    CASE \n        WHEN (pre_max_speed - lc_min_speed) > 15 AND lc_min_speed < 5 THEN 'mutual_stop'\n        WHEN (pre_max_speed - lc_min_speed) > 10 THEN 'ego_yielded'\n        WHEN (pre_max_speed - lc_min_speed) > 5 AND lc_min_speed < pre_max_speed * 0.5 THEN 'ego_proceeded_forced'\n        ELSE 'ego_proceeded_clear'\n    END AS game_theory_result,\n    lead_avg_rel_vx, follow_avg_rel_vx\nFROM cutin_events\nWHERE lead_obj_id IS NOT NULL \n  AND follow_obj_id IS NOT NULL\n  AND lead_min_x IS NOT NULL\n  AND follow_max_x IS NOT NULL\n  AND adjusted_gap >= -1       -- 过滤明显异常的negative gap\n  AND adjusted_gap < 5         -- gap不超过5m（可根据需要调整）\nORDER BY adjusted_gap;"
