# Recipe: cutin_analysis
# Purpose: Cutin scenario analysis pipeline
# Flow: simple_tag_extraction → ego_speed_simple → target_proximity → final_select

name: cutin_analysis
version: "1.0"
description: |
  Cutin场景分析流水线：提取Cutin标签 → 自车速度分析 → 目标车辆接近度分析。
  输出每个Cutin事件的速度变化、目标距离、目标速度等关键指标。

blocks:
  - name: simple_tag_extraction
    cte_name: "cutin_events"
    params:
      tag_name: "{tag_name}"
      pre_pad: 2.0
      post_pad: 2.0

  - name: ego_speed_simple
    cte_name: "EgoSpeedAnalysis"
    upstream: "cutin_events"

  - name: target_proximity
    cte_name: "TargetProximity"
    upstream: "EgoSpeedAnalysis"
    params:
      time_trim: 1.0

final_select_template: |
  SELECT
      'cutin_analysis' AS tag_name,
      esa.start_ts,
      esa.end_ts,
      ROUND(esa.end_ts - esa.start_ts, 2) AS duration,
      esa.object_id,
      esa.pre_speed_kmh,
      esa.during_speed_avg_kmh,
      esa.during_min_speed_kmh,
      esa.speed_drop_total_kmh,
      esa.max_decel_mps2,
      esa.distance_traveled_m,
      tp.min_dist_m,
      tp.target_type,
      tp.target_speed_x,
      tp.target_speed_y,
      tp.target_x,
      tp.target_y,
      CASE 
          WHEN esa.speed_drop_total_kmh > 15 AND esa.during_min_speed_kmh < 20 THEN 'hard_brake'
          WHEN esa.speed_drop_total_kmh > 8 THEN 'moderate_brake'
          WHEN esa.speed_drop_total_kmh > 3 THEN 'light_brake'
          ELSE 'no_brake'
      END AS brake_severity,
      CASE 
          WHEN tp.min_dist_m < 5 THEN 'critical'
          WHEN tp.min_dist_m < 10 THEN 'close'
          WHEN tp.min_dist_m < 20 THEN 'moderate'
          ELSE 'far'
      END AS proximity_level
  FROM EgoSpeedAnalysis esa
  LEFT JOIN TargetProximity tp ON esa.start_ts = tp.start_ts AND esa.end_ts = tp.end_ts AND esa.object_id = tp.object_id
  WHERE esa.distance_traveled_m > 0
  ORDER BY esa.start_ts

variants:
  default:
    tag_name: "Cutin"
  congested:
    tag_name: "CongestedFollow"
