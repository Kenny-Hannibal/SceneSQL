name: other_cutin_ego_yield
version: '1.0'
description: 他车切入自车让行：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: other_cutin_ego_yield
    raw_sql: "-- ==============================================================================\n-- Scene: Other Vehicle CutIn Ego Yield (V4.1)\n-- Description: Detects scenarios where a neighboring vehicle suddenly cuts into\n--              ego's lane, and ego timely decelerates to yield.\n--              Uses y-value based lane position judgment.\n-- Version: v4.1\n-- ==============================================================================\n\nWITH \nobj_frames AS (\n    SELECT d.ts, d.obj_id, d.type, d.x, d.y, d.obs_to_centerline_dist,\n           d.relative_velocity_x, d.relative_velocity_y, e.speed AS ego_speed\n    FROM dynamic_obj d JOIN ego e ON e.ts = d.ts\n    WHERE d.type IN ('car','truck','bus') \n      AND d.x BETWEEN 0 AND 30\n      AND ABS(d.y) < 6 \n      AND e.speed > 3\n),\nlane_marked AS (\n    SELECT *,\n        CASE \n            WHEN ABS(y) < 1.0 THEN 'ego_lane'\n            WHEN ABS(y) >= 2.0 AND ABS(y) < 5.0 THEN 'adjacent_lane'\n            ELSE 'far'\n   \
      \     END AS lane_pos\n    FROM obj_frames\n),\nfiltered AS (\n    SELECT * FROM lane_marked WHERE lane_pos IN ('ego_lane', 'adjacent_lane')\n),\nnumbered AS (\n    SELECT *,\n        ts - ROW_NUMBER() OVER (PARTITION BY obj_id, lane_pos ORDER BY ts) AS grp\n    FROM filtered\n),\nsegments AS (\n    SELECT obj_id, type, lane_pos,\n        MIN(ts) AS start_ts, MAX(ts) AS end_ts, COUNT(*) AS duration,\n        MIN(x) AS min_x, AVG(x) AS avg_x,\n        AVG(y) AS avg_y, MIN(ABS(y)) AS min_abs_y,\n        AVG(relative_velocity_y) AS avg_rel_vy\n    FROM numbered\n    GROUP BY obj_id, grp, type, lane_pos\n    HAVING COUNT(*) >= 2\n),\ncutin_seq AS (\n    SELECT s1.obj_id, s1.type,\n        s1.start_ts AS adj_start, s1.end_ts AS adj_end, s1.duration AS adj_duration,\n        s1.min_x AS adj_min_x, s1.avg_y AS adj_avg_y,\n        s2.start_ts AS ego_start, s2.end_ts AS ego_end, s2.duration AS ego_duration,\n        s2.min_x AS ego_min_x, s2.avg_x AS ego_avg_x, s2.avg_y AS ego_avg_y\n    FROM\
      \ segments s1\n    JOIN segments s2 ON s1.obj_id = s2.obj_id\n        AND s1.lane_pos = 'adjacent_lane' \n        AND s2.lane_pos = 'ego_lane'\n        AND s2.start_ts BETWEEN s1.end_ts AND s1.end_ts + 2\n    WHERE s1.min_x < 25 \n      AND s2.min_x < 15\n      AND ABS(s1.avg_y) > 1.5\n),\ncutin_with_speed AS (\n    SELECT cs.*,\n           (SELECT MAX(speed) FROM ego e2 WHERE e2.ts BETWEEN cs.adj_start - 3 AND cs.adj_start) AS pre_max_speed,\n           (SELECT MIN(speed) FROM ego e2 WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_min_speed,\n           (SELECT MAX(speed) FROM ego e2 WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_max_speed,\n           (SELECT COUNT(*) FROM ego e2 WHERE e2.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_ego_frames\n    FROM cutin_seq cs\n)\nSELECT \n    'other_cutin_ego_yield' AS tag_name,\n    adj_start AS start_ts,\n    ego_end AS end_ts,\n    ego_end - adj_start AS duration,\n    obj_id,\n    type,\n    adj_start,\
      \ adj_end, ego_start, ego_end,\n    ROUND(adj_min_x, 1) AS adj_min_x, ROUND(ego_min_x, 1) AS ego_min_x,\n    ROUND(pre_max_speed, 1) AS pre_max_speed, ROUND(post_min_speed, 1) AS post_min_speed,\n    ROUND(post_max_speed, 1) AS post_max_speed,\n    ROUND(pre_max_speed - post_min_speed, 1) AS speed_drop,\n    post_ego_frames,\n    CASE \n        WHEN post_min_speed < 3 THEN 'cutin_then_stop'\n        WHEN pre_max_speed - post_min_speed >= 8 THEN 'cutin_hard_yield'\n        WHEN pre_max_speed - post_min_speed >= 4 THEN 'cutin_soft_yield'\n        ELSE 'cutin_no_yield'\n    END AS sub_scenario,\n    json_object(\n        'obj_id', obj_id,\n        'obj_type', type,\n        'adj_min_x', ROUND(adj_min_x, 1),\n        'ego_min_x', ROUND(ego_min_x, 1),\n        'pre_max_speed', ROUND(pre_max_speed, 1),\n        'post_min_speed', ROUND(post_min_speed, 1),\n        'speed_drop', ROUND(pre_max_speed - post_min_speed, 1),\n        'sub_scenario', CASE \n            WHEN post_min_speed < 3 THEN\
      \ 'cutin_then_stop'\n            WHEN pre_max_speed - post_min_speed >= 8 THEN 'cutin_hard_yield'\n            WHEN pre_max_speed - post_min_speed >= 4 THEN 'cutin_soft_yield'\n            ELSE 'cutin_no_yield'\n        END\n    ) AS param\nFROM cutin_with_speed\nWHERE pre_max_speed - post_min_speed > 4\n  AND post_min_speed > 3\n  AND post_ego_frames >= 4\n  AND ego_duration >= 2\nORDER BY ego_start;"
