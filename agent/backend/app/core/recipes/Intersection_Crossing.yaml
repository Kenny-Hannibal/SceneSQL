name: Intersection_Crossing
version: '1.0'
description: 路口横穿：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Intersection_Crossing
    raw_sql: "WITH\ndata_start_time AS (\n  SELECT MIN(ts) AS min_ts FROM ego\n),\n-- 第一步：找到所有满足过停止线条件且路口有红绿灯的帧\neligible_crossing_frames AS (\n  SELECT \n    e.ts AS cross_ts,\n    e.cumulative_distance AS cross_cum_dist,\n    e.latest_traffic_light_status\n  FROM ego e\n  WHERE e.latest_stop_line_direction > 0\n    -- 新增条件：确保该路口的交通灯状态是\"绿\"或\"黄\"\n    AND e.latest_traffic_light_status IN ('绿', '黄')\n    AND EXISTS (\n      SELECT 1\n      FROM ego e2\n      WHERE e2.ts < e.ts\n        AND e2.ts >= e.ts - 3\n        AND e2.latest_stop_line_direction < 0\n    )\n),\n-- 第二步：为符合条件的帧添加聚类标识\nclustered_frames AS (\n  SELECT \n    ecf.cross_ts,\n    ecf.cross_cum_dist,\n    -- 通过时间间隔来识别连续帧分组\n    CASE \n      WHEN ecf.cross_ts - LAG(ecf.cross_ts, 1, ecf.cross_ts - 2) OVER (ORDER BY ecf.cross_ts) > 1 \n      THEN 1 \n      ELSE 0 \n    END AS is_new_group\n  FROM eligible_crossing_frames ecf\n),\ngrouped_frames AS (\n  SELECT \n    cross_ts,\n    cross_cum_dist,\n    SUM(is_new_group) OVER (ORDER\
      \ BY cross_ts) AS grp\n  FROM clustered_frames\n),\n-- 第三步：将连续过停止线帧聚类为一次通过事件\ncrossing_events AS (\n  SELECT \n    MIN(cross_ts) AS cross_ts,\n    MIN(cross_cum_dist) AS cross_cum_dist\n  FROM grouped_frames\n  GROUP BY grp\n  HAVING COUNT(*) >= 1\n),\n-- 第四步：为每个过停止线事件计算开始和结束时间\ncrossing_segments AS (\n  SELECT \n    ce.cross_ts,\n    ce.cross_cum_dist,\n    -- 开始时间：过停止线时刻前10秒\n    ce.cross_ts - 10 AS start_ts,\n    -- 结束时间：过停止线时刻后5秒\n    ce.cross_ts + 5 AS end_ts\n  FROM crossing_events ce, data_start_time dst\n  WHERE ce.cross_ts - 10 > dst.min_ts\n),\n-- 第五步：检查整个片段内是否有停车行为\nvalid_crossings AS (\n  SELECT \n    cs.start_ts,\n    cs.end_ts,\n    cs.end_ts - cs.start_ts AS duration_seconds\n  FROM crossing_segments cs\n  WHERE NOT EXISTS (\n    SELECT 1\n    FROM ego e\n    WHERE e.ts >= cs.start_ts\n      AND e.ts <= cs.end_ts\n      AND ABS(e.speed) < 1\n  )\n),\n-- 第六步：去重处理，确保不同事件不重叠\ndeduplicated_crossings AS (\n  SELECT \n    vc.*,\n    LAG(vc.end_ts) OVER (ORDER BY vc.start_ts)\
      \ AS prev_end_ts\n  FROM valid_crossings vc\n),\n-- 第七步：筛选出最终不重叠的通行事件\nfinal_crossings AS (\n  SELECT \n    start_ts,\n    end_ts,\n    duration_seconds\n  FROM deduplicated_crossings\n  WHERE \n    -- 去除重叠的事件：当前事件的开始时间必须大于前一个事件的结束时间\n    prev_end_ts IS NULL OR start_ts > prev_end_ts\n),\n-- 第八步：为每个通行事件统计黄灯信息\nyellow_light_analysis AS (\n  SELECT \n    fc.start_ts,\n    fc.end_ts,\n    fc.duration_seconds,\n    -- 统计黄灯次数\n    COUNT(CASE WHEN e.latest_traffic_light_status = '黄' THEN 1 END) AS yellow_count,\n    -- 第一次出现黄灯的时间戳\n    MIN(CASE WHEN e.latest_traffic_light_status = '黄' THEN e.ts END) AS first_yellow_ts,\n    -- 最后一次出现黄灯的时间戳\n    MAX(CASE WHEN e.latest_traffic_light_status = '黄' THEN e.ts END) AS last_yellow_ts\n  FROM final_crossings fc\n  LEFT JOIN ego e ON e.ts >= fc.start_ts \n    AND e.ts <= fc.end_ts\n  GROUP BY fc.start_ts, fc.end_ts, fc.duration_seconds\n)\n-- 最终结果：包含黄灯统计的通行事件\nSELECT \n  start_ts,\n  end_ts,\n  duration_seconds,\n  yellow_count,\n  first_yellow_ts,\n\
      \  last_yellow_ts\nFROM yellow_light_analysis\nORDER BY start_ts;"
