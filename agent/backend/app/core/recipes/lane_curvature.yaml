name: lane_curvature
version: '1.0'
description: 车道曲率：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Lane_Curvature_Track
    raw_sql: "-- 车道曲率 Track SQL脚本\n-- 功能：将 ego 表中的 ego_curvature_category 按语义分类，并聚合连续的时间段\n\n-- 第一步：为每条记录添加曲率标签\nWITH curvature_labeled AS (\n    SELECT \n        ts,\n        ts_ms,\n        ego_lane_id,\n        ego_lane_curvature,\n        CASE \n            -- 如果 ego_lane_id = -1 或 NULL，表示没有匹配到车道\n            WHEN ego_lane_id IS NULL OR ego_lane_id = -1 THEN 'invalid_lane_curvature_ego_lane_empty'\n            -- 处理特殊值 ±1.0（无效/异常数据）\n            WHEN ABS(ego_lane_curvature - (-1.0)) < 0.0001 \n                 OR ABS(ego_lane_curvature - 1.0) < 0.0001 \n            THEN 'invalid_lane_curvature_unknown'\n            -- 如果曲率为 NULL，也视为未知\n            WHEN ego_lane_curvature IS NULL THEN 'invalid_lane_curvature_unknown'\n            -- 根据曲率绝对值分类（基于半径阈值）\n            -- 直线: 半径 > 1000m → |curvature| < 0.001\n            WHEN ABS(ego_lane_curvature) < 0.001 THEN 'lane_curvature_straight'\n            -- 缓弯: 300m <= 半径 < 1000m → 0.001 <= |curvature| < 0.00333\n            WHEN ABS(ego_lane_curvature)\
      \ >= 0.001 AND ABS(ego_lane_curvature) < 0.003333 THEN 'lane_curvature_mild_curve'\n            -- 急弯: 50m <= 半径 < 300m → 0.00333 <= |curvature| < 0.02\n            WHEN ABS(ego_lane_curvature) >= 0.003333 AND ABS(ego_lane_curvature) < 0.02 THEN 'lane_curvature_sharp_curve'\n            -- 调头弯: 半径 < 50m → |curvature| >= 0.02\n            WHEN ABS(ego_lane_curvature) >= 0.02 THEN 'lane_curvature_u_turn_curve'\n            ELSE 'invalid_lane_curvature_unknown'\n        END as tag_name\n    FROM ego\n    ORDER BY ts\n),\n\n-- 第二步：使用窗口函数检测标签变化点\ntag_changes AS (\n    SELECT \n        ts,\n        ts_ms,\n        tag_name,\n        -- 检查当前标签是否与前一帧不同\n        CASE \n            WHEN LAG(tag_name) OVER (ORDER BY ts) != tag_name \n                 OR LAG(tag_name) OVER (ORDER BY ts) IS NULL \n            THEN 1 \n            ELSE 0 \n        END as is_change\n    FROM curvature_labeled\n),\n\n-- 第三步：为每个连续的标签段分配组ID\ngrouped_tags AS (\n    SELECT \n        ts,\n        ts_ms,\n        tag_name,\n\
      \        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM tag_changes\n),\n\n-- 第四步：聚合每个组的起止时间\naggregated_segments AS (\n    SELECT \n        tag_name,\n        MIN(ts) as start_ts,\n        MAX(ts) as end_ts,\n        MIN(ts_ms) as start_ts_ms,\n        MAX(ts_ms) as end_ts_ms,\n        COUNT(*) as frame_count\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- 最终输出结果\nSELECT \n    tag_name,\n    start_ts,\n    end_ts,\n    start_ts_ms,\n    end_ts_ms,\n    frame_count\nFROM aggregated_segments;"
