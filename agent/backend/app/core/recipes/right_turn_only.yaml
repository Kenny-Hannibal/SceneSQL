name: right_turn_only
version: '1.0'
description: 右转专用：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: right_turn_only
    raw_sql: "-- 查询右转A的link_id，并在ego表中查找匹配的时间片段，聚合连续时间段（10秒间隔）\n\n-- 第一步：获取右转A的所有link_id\nWITH right_turn_a_links AS (\n    SELECT link_id, link_type\n    FROM static_link\n    WHERE link_type = '右转A'\n),\n\n-- 第二步：在ego表中查询ego_static_map_link_id匹配的记录\nego_matching_frames AS (\n    SELECT \n        e.ts,\n        e.ego_link_id,\n        e.ego_static_map_link_id,\n        e.ego_lane_id\n    FROM ego e\n    INNER JOIN right_turn_a_links rtl ON e.ego_static_map_link_id = rtl.link_id\n    ORDER BY e.ts\n),\n\n-- 第三步：使用窗口函数检测连续时间段（间隔超过10秒视为新段）\ntime_changes AS (\n    SELECT \n        ts,\n        ego_link_id,\n        ego_static_map_link_id,\n        ego_lane_id,\n        CASE \n            WHEN LAG(ts) OVER (ORDER BY ts) IS NULL THEN 1\n            WHEN (ts - LAG(ts) OVER (ORDER BY ts)) > 10 THEN 1\n            ELSE 0\n        END as is_new_segment\n    FROM ego_matching_frames\n),\n\n-- 第四步：为每个连续时间段分配组ID\ngrouped_segments AS (\n    SELECT \n        ts,\n        ego_link_id,\n        ego_static_map_link_id,\n\
      \        ego_lane_id,\n        SUM(is_new_segment) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as segment_id\n    FROM time_changes\n),\n\n-- 第五步：聚合每个时间段的统计信息\naggregated_segments AS (\n    SELECT \n        segment_id,\n        MIN(ts) as start_ts,\n        MAX(ts) as end_ts,\n        COUNT(*) as frame_count,\n        GROUP_CONCAT(DISTINCT ego_static_map_link_id) as ego_static_map_link_ids,\n        GROUP_CONCAT(DISTINCT ego_link_id) as ego_link_ids,\n        GROUP_CONCAT(DISTINCT ego_lane_id) as ego_lane_ids\n    FROM grouped_segments\n    GROUP BY segment_id\n    ORDER BY start_ts\n)\n\n-- 最终输出：各段时间段信息（过滤掉持续时间小于3秒的）\nSELECT \n    'right_turn_only' AS tag_name,\n    segment_id,\n    start_ts,\n    end_ts,\n    frame_count,\n    (end_ts - start_ts) as duration_sec,\n    ego_static_map_link_ids,\n    ego_link_ids,\n    ego_lane_ids\nFROM aggregated_segments\nWHERE (end_ts - start_ts) >= 3\nORDER BY start_ts;"
