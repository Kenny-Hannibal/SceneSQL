name: ego_smallgap_cutin
version: '1.0'
description: 小间距切入：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: ego_smallgap_cutin
    raw_sql: "-- 场景检索: Ego_SmallGap_CutIn_v21\n-- 描述: 自车变道切入小gap场景 v2.1 - 扩大LaneChange类型范围，min_dist_sq排序，条件极值计算gap，过滤adjusted_gap<-1的异常\n-- 创建时间: 2026-05-21\n\nWITH \nlane_change_periods AS (\n    SELECT \n        start_ts, end_ts, end_ts - start_ts AS lc_duration,\n        tag_name AS lc_tag,\n        json_extract(param, '$.sub_tag') AS sub_tag,\n        CASE \n            WHEN json_extract(param, '$.sub_tag') = 'LeftLaneChange' THEN 'left'\n            WHEN json_extract(param, '$.sub_tag') = 'RightLaneChange' THEN 'right'\n            ELSE NULL\n        END AS lc_direction\n    FROM range_tag\n    WHERE tag_name IN ('LaneChange', 'LANECHANGE_MERGELANECHANGEDROP', 'LANECHANGE_NAVIGATION',\n        'LANECHANGE_FREEWAY', 'LANECHANGE_AVOIDANCE', 'LANECHANGE_OVERTAKELEFTCARORTRUCK',\n        'LANECHANGE_OVERTAKERIGHTCARORTRUCK', 'LANECHANGE_MERGELANECHANGEZIPPER',\n        'LANECHANGE_MERGELANECHANGEMAINROAD', 'LANECHANGE_NAVLANECHANGERAMP')\n      AND (end_ts - start_ts) >= 1\n),\nlc_windows\
      \ AS (\n    SELECT \n        start_ts, end_ts, lc_duration, lc_tag, sub_tag, lc_direction,\n        start_ts - 2 AS window_start,\n        end_ts + 2 AS window_end\n    FROM lane_change_periods\n    WHERE lc_direction IS NOT NULL\n),\ntarget_obj_frames AS (\n    SELECT \n        lw.start_ts, lw.end_ts, lw.lc_direction,\n        d.ts, d.obj_id, d.x, d.y, d.type, d.l,\n        d.x*d.x + d.y*d.y AS dist_sq\n    FROM lc_windows lw\n    INNER JOIN dynamic_obj d ON d.ts BETWEEN lw.window_start AND lw.window_end\n    WHERE d.type IN ('car', 'truck', 'bus')\n      AND d.x > -30 AND d.x < 60\n      AND (d.is_static = 0 OR d.is_static IS NULL)\n      AND (\n          (lw.lc_direction = 'left' AND d.y > 0.3 AND d.y < 8)\n          OR (lw.lc_direction = 'right' AND d.y < -0.3 AND d.y > -8)\n      )\n),\nobj_stats AS (\n    SELECT \n        start_ts, obj_id, type,\n        COUNT(*) AS obj_frames,\n        AVG(x) AS avg_x,\n        AVG(l) AS avg_l,\n        MIN(dist_sq) AS min_dist_sq,\n       \
      \ MIN(CASE WHEN x > 0 THEN x END) AS lead_min_x,\n        MAX(CASE WHEN x < 0 THEN x END) AS follow_max_x,\n        CASE WHEN AVG(x) > 0 THEN 'lead' ELSE 'follow' END AS obj_position\n    FROM target_obj_frames\n    GROUP BY start_ts, obj_id, type\n    HAVING COUNT(*) >= 2\n),\nkey_obj_per_lc AS (\n    SELECT \n        start_ts, obj_id, type, avg_l, obj_position,\n        obj_frames, avg_x, min_dist_sq, lead_min_x, follow_max_x,\n        ROW_NUMBER() OVER (\n            PARTITION BY start_ts, obj_position \n            ORDER BY min_dist_sq ASC\n        ) AS rn\n    FROM obj_stats\n),\nlead_obj AS (\n    SELECT start_ts, obj_id AS lead_obj_id, type AS lead_type, avg_l AS lead_len,\n           avg_x AS lead_avg_x, lead_min_x\n    FROM key_obj_per_lc\n    WHERE obj_position = 'lead' AND rn = 1\n),\nfollow_obj AS (\n    SELECT start_ts, obj_id AS follow_obj_id, type AS follow_type, avg_l AS follow_len,\n           avg_x AS follow_avg_x, follow_max_x\n    FROM key_obj_per_lc\n    WHERE\
      \ obj_position = 'follow' AND rn = 1\n),\ngap_events AS (\n    SELECT \n        lw.start_ts, lw.end_ts, lw.lc_duration, lw.lc_tag, lw.sub_tag, lw.lc_direction,\n        lo.lead_obj_id, lo.lead_type, lo.lead_len, lo.lead_avg_x, lo.lead_min_x,\n        fo.follow_obj_id, fo.follow_type, fo.follow_len, fo.follow_avg_x, fo.follow_max_x,\n        COALESCE(lo.lead_min_x, 999) - COALESCE(fo.follow_max_x, -999) AS raw_gap,\n        COALESCE(lo.lead_min_x, 999) - COALESCE(fo.follow_max_x, -999) \n            - COALESCE(lo.lead_len, 4.5) * 0.5 - COALESCE(fo.follow_len, 4.5) * 0.5 AS adjusted_gap\n    FROM lc_windows lw\n    LEFT JOIN lead_obj lo ON lo.start_ts = lw.start_ts\n    LEFT JOIN follow_obj fo ON fo.start_ts = lw.start_ts\n)\nSELECT \n    'ego_smallgap_cutin' AS tag_name,\n    ROUND(start_ts, 0) AS start_ts,\n    ROUND(end_ts, 0) AS end_ts,\n    ROUND(lc_duration, 1) AS duration,\n    lc_tag,\n    sub_tag,\n    lc_direction,\n    lead_obj_id,\n    lead_type,\n    ROUND(lead_avg_x, 1)\
      \ AS lead_avg_x,\n    follow_obj_id,\n    follow_type,\n    ROUND(follow_avg_x, 1) AS follow_avg_x,\n    ROUND(raw_gap, 2) AS raw_gap,\n    ROUND(adjusted_gap, 2) AS adjusted_gap,\n    json_object(\n        'lc_direction', lc_direction,\n        'lc_tag', lc_tag,\n        'sub_tag', sub_tag,\n        'lead_obj_id', lead_obj_id,\n        'follow_obj_id', follow_obj_id,\n        'raw_gap', ROUND(raw_gap, 2),\n        'adjusted_gap', ROUND(adjusted_gap, 2)\n    ) AS param\nFROM gap_events\nWHERE lead_obj_id IS NOT NULL \n  AND follow_obj_id IS NOT NULL\n  AND lead_min_x IS NOT NULL\n  AND follow_max_x IS NOT NULL\n  AND adjusted_gap >= -1\n  AND adjusted_gap < 3\nORDER BY adjusted_gap;"
