name: link_class_track
version: '1.0'
description: 道路等级：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Link_Class_Track
    raw_sql: "-- Link 等级 Track SQL脚本\n-- 功能：通过 ego_static_map_link_id JOIN static_link 获取 link_class，并聚合连续的时间段\n\nWITH ego_marked AS (\n    -- 第一步：标识连续 -1 序列的起始点\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        -- 标识连续序列的起始点：当前是 -1 且前一帧不是 -1\n        CASE \n            WHEN ego_static_map_link_id = -1 AND (LAG(ego_static_map_link_id) OVER (ORDER BY ts) IS NULL OR LAG(ego_static_map_link_id) OVER (ORDER BY ts) != -1)\n            THEN 1\n            ELSE 0\n        END as is_sequence_start\n    FROM ego\n),\n\nego_with_group_id AS (\n    -- 第二步：使用累积求和为每个连续序列分配 group_id\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        SUM(is_sequence_start) OVER (ORDER BY ts) as group_id\n    FROM ego_marked\n),\n\nego_with_group_size AS (\n    -- 第三步：计算每个 group 的大小（连续 -1 的帧数）\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        group_id,\n        COUNT(*) OVER (PARTITION BY group_id) as group_size\n    FROM\
      \ ego_with_group_id\n    WHERE ego_static_map_link_id = -1\n),\n\nego_all_with_size AS (\n    -- 第四步：将 group_size 关联回所有帧\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.ego_static_map_link_id,\n        COALESCE(egs.group_size, 0) as consecutive_minus_one_count\n    FROM ego_with_group_id e\n    LEFT JOIN ego_with_group_size egs ON e.ts = egs.ts\n),\n\nego_with_prev_valid AS (\n    -- 第五步：找到每个 -1 序列之前的最后一个有效 link_id\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        consecutive_minus_one_count,\n        -- 对每个 -1 帧，找到它之前的最后一个非 -1 的 link_id\n        MAX(CASE WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id END) OVER (\n            ORDER BY ts \n            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING\n        ) as prev_valid_link_id\n    FROM ego_all_with_size\n),\n\nego_with_filled_link AS (\n    -- 第六步：只对连续 -1 长度 ≤ 2 的序列进行前向填充\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id as original_link_id,\n \
      \       CASE \n            -- 如果不是 -1，使用原始值\n            WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id\n            -- 如果连续 -1 长度 > 2，不填充，保持 -1\n            WHEN consecutive_minus_one_count > 2 THEN -1\n            -- 如果连续 ≤ 2 帧，使用序列之前的有效 link_id\n            ELSE prev_valid_link_id\n        END as ego_static_map_link_id\n    FROM ego_with_prev_valid\n),\n\nego_with_link_class AS (\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.ego_static_map_link_id,\n        sl.link_class,\n        -- 将 link_class 转换为文本描述\n        -- 注意：必须先检查字符串类型，再检查数值类型\n        -- 因为 SQLite 会将中文字符串 CAST 为 INTEGER 时返回 0\n        CASE \n            WHEN sl.link_class IS NULL THEN 'invalid_link_class_unknown'\n            -- 先处理中文字符串枚举（来自数据库）\n            WHEN CAST(sl.link_class AS TEXT) = '高速公路' THEN 'link_class_highway'\n            WHEN CAST(sl.link_class AS TEXT) = '国道' THEN 'link_class_national_road'\n            WHEN CAST(sl.link_class AS TEXT) = '省道' THEN 'link_class_provincial_road'\n\
      \            WHEN CAST(sl.link_class AS TEXT) = '县道' THEN 'link_class_county_road'\n            WHEN CAST(sl.link_class AS TEXT) = '乡道' THEN 'link_class_township_road'\n            WHEN CAST(sl.link_class AS TEXT) = '村道' THEN 'link_class_village_road'\n            WHEN CAST(sl.link_class AS TEXT) = '城市快速路' THEN 'link_class_urban_expressway'\n            WHEN CAST(sl.link_class AS TEXT) = '主要道路' THEN 'link_class_major_road'\n            WHEN CAST(sl.link_class AS TEXT) = '次要道路' THEN 'link_class_minor_road'\n            WHEN CAST(sl.link_class AS TEXT) = '普通道路' THEN 'link_class_ordinary_road'\n            WHEN CAST(sl.link_class AS TEXT) = '非导航道路' THEN 'link_class_non_navigable'\n            WHEN CAST(sl.link_class AS TEXT) = '无效' THEN 'link_class_invalid'\n            WHEN CAST(sl.link_class AS TEXT) = '未知' THEN 'invalid_link_class_unknown'\n            -- 再处理数值类型枚举\n            WHEN CAST(sl.link_class AS INTEGER) = 0 THEN 'link_class_highway'\n            WHEN CAST(sl.link_class AS\
      \ INTEGER) = 1 THEN 'link_class_national_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 2 THEN 'link_class_provincial_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 3 THEN 'link_class_county_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 4 THEN 'link_class_township_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 5 THEN 'link_class_village_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 6 THEN 'link_class_urban_expressway'\n            WHEN CAST(sl.link_class AS INTEGER) = 7 THEN 'link_class_major_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 8 THEN 'link_class_minor_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 9 THEN 'link_class_ordinary_road'\n            WHEN CAST(sl.link_class AS INTEGER) = 10 THEN 'link_class_non_navigable'\n            WHEN CAST(sl.link_class AS INTEGER) = 255 THEN 'link_class_invalid'\n            ELSE 'invalid_link_class_unknown'\n        END as tag_name\n    FROM ego_with_filled_link e\n\
      \    LEFT JOIN static_link sl ON CAST(e.ego_static_map_link_id AS TEXT) = sl.link_id\n    ORDER BY ts\n),\n\n-- 使用窗口函数检测标签变化点\ntag_changes AS (\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        link_class,\n        tag_name,\n        CASE \n            WHEN LAG(tag_name) OVER (ORDER BY ts) != tag_name \n                 OR LAG(tag_name) OVER (ORDER BY ts) IS NULL \n            THEN 1 \n            ELSE 0 \n        END as is_change\n    FROM ego_with_link_class\n),\n\n-- 为每个连续的标签段分配组ID\ngrouped_tags AS (\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        link_class,\n        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM tag_changes\n),\n\n-- 聚合每个组的起止时间\naggregated_segments AS (\n    SELECT \n        tag_name,\n        MIN(ts) as start_ts,\n        MAX(ts) as end_ts,\n        MIN(ts_ms) as start_ts_ms,\n        MAX(ts_ms) as end_ts_ms,\n        COUNT(*) as frame_count\n\
      \    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- 最终输出结果\nSELECT \n    tag_name,\n    CAST(start_ts_ms * 1000000 AS INTEGER) as start_time,  -- 毫秒转纳秒\n    CAST(end_ts_ms * 1000000 AS INTEGER) as end_time,      -- 毫秒转纳秒\n    start_ts,\n    end_ts,\n    start_ts_ms,\n    end_ts_ms,\n    frame_count\nFROM aggregated_segments;"
