name: ego_nudge_overtake_truck
version: '1.0'
description: 借道超车卡车：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: ego_nudge_overtake_truck
    raw_sql: "WITH \n-- config params\nconfig AS (\n    SELECT \n        4.5  AS ego_length,\n        1.8  AS ego_width,\n        3.0  AS nearby_lat_gap_max,\n        0.8  AS safe_lat_gap,\n        20.0 AS min_speed,\n        3    AS min_duration,\n        0.8  AS truck_boundary_threshold,\n        0.5  AS ego_nudge_threshold,\n        3    AS min_nudge_frames,\n        5.0  AS start_dist,\n        5.0  AS overtake_margin\n),\n\n-- Ego 1Hz LEAD (独立计算，避免同一 ts 多 truck 导致 LEAD 跳行)\nego_lead AS (\n    SELECT ts, speed AS ego_speed, steering_angle, ego_to_centerline_dist,\n        LEAD(ts) OVER (ORDER BY ts) AS next_ts,\n        LEAD(speed) OVER (ORDER BY ts) AS next_ego_speed,\n        LEAD(steering_angle) OVER (ORDER BY ts) AS next_steering,\n        LEAD(ego_to_centerline_dist) OVER (ORDER BY ts) AS next_ego_center\n    FROM ego\n),\n\n-- 1Hz base + LEAD for 5Hz interp\nbase_1hz AS (\n    SELECT \n        d.ts,\n        d.obj_id,\n        d.x,\n        d.y,\n        d.l,\n        d.w,\n  \
      \      d.type,\n        d.relative_velocity_x,\n        d.obs_to_left_boundary_dist,\n        d.obs_to_right_boundary_dist,\n        d.obs_to_centerline_dist,\n        el.ego_speed,\n        el.steering_angle,\n        el.ego_to_centerline_dist,\n        LEAD(d.ts) OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_ts,\n        LEAD(d.x)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_x,\n        LEAD(d.y)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_y,\n        LEAD(d.l)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_l,\n        LEAD(d.w)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_w,\n        LEAD(d.obs_to_left_boundary_dist)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_obs_left,\n        LEAD(d.obs_to_right_boundary_dist) OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_obs_right,\n        LEAD(d.obs_to_centerline_dist) OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_obs_center,\n        el.next_ego_speed,\n        el.next_steering,\n        el.next_ego_center\n\
      \    FROM dynamic_obj d\n    INNER JOIN ego_lead el ON el.ts = d.ts\n    CROSS JOIN config cfg\n    WHERE d.type = 'truck'\n),\n\n-- 5Hz linear interp via UNION ALL\ninterp AS (\n    SELECT ts + 0.0 AS t, obj_id, x, y, l, w, type, relative_velocity_x,\n        obs_to_left_boundary_dist, obs_to_right_boundary_dist, obs_to_centerline_dist,\n        ego_speed, steering_angle, ego_to_centerline_dist\n    FROM base_1hz\n    UNION ALL\n    SELECT ts + 0.2, obj_id,\n        x + (next_x - x) * 0.2 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.2 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.2 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.2 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        obs_to_left_boundary_dist + (next_obs_left - obs_to_left_boundary_dist) * 0.2 / NULLIF(next_ts - ts, 0),\n        obs_to_right_boundary_dist + (next_obs_right - obs_to_right_boundary_dist) * 0.2 / NULLIF(next_ts - ts, 0),\n        obs_to_centerline_dist\
      \ + (next_obs_center - obs_to_centerline_dist) * 0.2 / NULLIF(next_ts - ts, 0),\n        ego_speed + (next_ego_speed - ego_speed) * 0.2 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.2 / NULLIF(next_ts - ts, 0),\n        ego_to_centerline_dist + (next_ego_center - ego_to_centerline_dist) * 0.2 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.4, obj_id,\n        x + (next_x - x) * 0.4 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.4 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.4 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.4 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        obs_to_left_boundary_dist + (next_obs_left - obs_to_left_boundary_dist) * 0.4 / NULLIF(next_ts - ts, 0),\n        obs_to_right_boundary_dist + (next_obs_right - obs_to_right_boundary_dist) * 0.4 / NULLIF(next_ts - ts, 0),\n        obs_to_centerline_dist + (next_obs_center\
      \ - obs_to_centerline_dist) * 0.4 / NULLIF(next_ts - ts, 0),\n        ego_speed + (next_ego_speed - ego_speed) * 0.4 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.4 / NULLIF(next_ts - ts, 0),\n        ego_to_centerline_dist + (next_ego_center - ego_to_centerline_dist) * 0.4 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.6, obj_id,\n        x + (next_x - x) * 0.6 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.6 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.6 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.6 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        obs_to_left_boundary_dist + (next_obs_left - obs_to_left_boundary_dist) * 0.6 / NULLIF(next_ts - ts, 0),\n        obs_to_right_boundary_dist + (next_obs_right - obs_to_right_boundary_dist) * 0.6 / NULLIF(next_ts - ts, 0),\n        obs_to_centerline_dist + (next_obs_center - obs_to_centerline_dist)\
      \ * 0.6 / NULLIF(next_ts - ts, 0),\n        ego_speed + (next_ego_speed - ego_speed) * 0.6 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.6 / NULLIF(next_ts - ts, 0),\n        ego_to_centerline_dist + (next_ego_center - ego_to_centerline_dist) * 0.6 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.8, obj_id,\n        x + (next_x - x) * 0.8 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.8 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.8 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.8 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        obs_to_left_boundary_dist + (next_obs_left - obs_to_left_boundary_dist) * 0.8 / NULLIF(next_ts - ts, 0),\n        obs_to_right_boundary_dist + (next_obs_right - obs_to_right_boundary_dist) * 0.8 / NULLIF(next_ts - ts, 0),\n        obs_to_centerline_dist + (next_obs_center - obs_to_centerline_dist) * 0.8 /\
      \ NULLIF(next_ts - ts, 0),\n        ego_speed + (next_ego_speed - ego_speed) * 0.8 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.8 / NULLIF(next_ts - ts, 0),\n        ego_to_centerline_dist + (next_ego_center - ego_to_centerline_dist) * 0.8 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n),\n\n-- 5Hz metrics\nvehicle_frames AS (\n    SELECT \n        t, obj_id, x, y, l, w, type, relative_velocity_x,\n        obs_to_left_boundary_dist, obs_to_right_boundary_dist, obs_to_centerline_dist,\n        ego_speed, steering_angle, ego_to_centerline_dist,\n        ROUND(ABS(y) - (cfg.ego_width + COALESCE(w,0))/2, 2) AS lateral_gap,\n        ROUND(x - COALESCE(l,0)/2 - cfg.ego_length/2, 2) AS front_to_rear_dist,\n        CASE WHEN (CASE WHEN obs_to_left_boundary_dist < obs_to_right_boundary_dist THEN obs_to_left_boundary_dist ELSE obs_to_right_boundary_dist END) < cfg.truck_boundary_threshold THEN 1 ELSE 0 END AS is_truck_near_boundary,\n\
      \        CASE WHEN ABS(ego_to_centerline_dist) > cfg.ego_nudge_threshold THEN 1 ELSE 0 END AS is_ego_nudged,\n        CASE \n            WHEN ABS(y) - (cfg.ego_width + COALESCE(w,0))/2 < cfg.safe_lat_gap \n                 AND x <= (COALESCE(l,0) + cfg.ego_length) / 2.0 \n                 AND x >= -(COALESCE(l,0) + cfg.ego_length) / 2.0 - 1.2\n            THEN 1 ELSE 0 \n        END AS is_close,\n        CASE \n            WHEN x <= (COALESCE(l,0) + cfg.ego_length) / 2.0 \n                 AND x >= -(COALESCE(l,0) + cfg.ego_length) / 2.0 \n            THEN 1 ELSE 0 \n        END AS is_overlap,\n        CASE \n            WHEN obs_to_centerline_dist * ego_to_centerline_dist < 0 \n                 AND ABS(ego_to_centerline_dist) > 0.2\n            THEN 1 ELSE 0 \n        END AS is_nudge_away\n    FROM interp\n    CROSS JOIN config cfg\n    WHERE ABS(y) - (cfg.ego_width + COALESCE(w,0))/2 < cfg.nearby_lat_gap_max\n      AND x IS NOT NULL AND y IS NOT NULL AND type = 'truck'\n),\n\n--\
      \ Gaps & Islands (5Hz)\nframed_with_grp AS (\n    SELECT *,\n        CAST(t * 5 AS INTEGER) - ROW_NUMBER() OVER (PARTITION BY obj_id ORDER BY t) AS grp\n    FROM vehicle_frames\n),\n\n-- segment summary\nobj_segments AS (\n    SELECT \n        obj_id, type, grp,\n        MIN(t) AS seg_start_t, MAX(t) AS seg_end_t,\n        MAX(t) - MIN(t) AS seg_duration,\n        COUNT(*) AS frame_count,\n        MIN(x) AS min_x, MAX(x) AS max_x,\n        MIN(y) AS min_y, MAX(y) AS max_y,\n        MIN(lateral_gap) AS min_lateral_gap,\n        MAX(lateral_gap) AS max_lateral_gap,\n        SUM(is_close) AS close_frames,\n        SUM(is_truck_near_boundary) AS truck_near_boundary_frames,\n        SUM(is_ego_nudged) AS ego_nudged_frames,\n        SUM(is_overlap) AS overlap_frames,\n        MIN(CASE WHEN is_overlap = 1 THEN lateral_gap END) AS min_overlap_lat_gap,\n        SUM(CASE WHEN is_overlap = 1 AND is_nudge_away = 1 THEN 1 ELSE 0 END) AS nudge_away_overlap_frames,\n        ROUND(AVG(relative_velocity_x),\
      \ 2) AS avg_rel_vel_x,\n        ROUND(AVG(ego_speed), 2) AS avg_ego_speed,\n        ROUND(MAX(ego_speed), 2) AS max_ego_speed,\n        MAX(ABS(steering_angle)) AS max_abs_steering\n    FROM framed_with_grp\n    GROUP BY obj_id, type, grp\n),\n\n-- filter nudge overtake candidates\nsafe_candidates AS (\n    SELECT \n        obj_id, type, grp, seg_start_t, seg_end_t, seg_duration,\n        frame_count, min_x, max_x,\n        overlap_frames, min_overlap_lat_gap, nudge_away_overlap_frames,\n        avg_rel_vel_x, avg_ego_speed, max_ego_speed, max_abs_steering\n    FROM obj_segments\n    CROSS JOIN config cfg\n    WHERE seg_duration >= cfg.min_duration\n      AND min_x < 0 AND max_x > 0\n      AND avg_rel_vel_x < -1.0\n      AND max_ego_speed >= cfg.min_speed\n      AND max_abs_steering > 0.3 AND max_abs_steering < 3.0\n      AND overlap_frames > 0\n      AND min_overlap_lat_gap > 1.0\n      AND nudge_away_overlap_frames = overlap_frames\n),\n\n-- start event: overlap开始时刻 - 2.0s\nstart_events\
      \ AS (\n    SELECT obj_id, grp,\n        MIN(CASE WHEN is_overlap = 1 THEN t END) - 2.0 AS start_ts\n    FROM framed_with_grp\n    GROUP BY obj_id, grp\n),\n\n-- end event: overlap结束时刻 + 2.0s\nend_events AS (\n    SELECT obj_id, grp,\n        MAX(CASE WHEN is_overlap = 1 THEN t END) + 2.0 AS end_ts\n    FROM framed_with_grp\n    GROUP BY obj_id, grp\n)\n\n-- output\nSELECT \n    'ego_nudge_overtake_truck' AS tag_name,\n    CAST(COALESCE(se.start_ts, sc.seg_start_t) AS INTEGER) AS start_ts,\n    CAST(COALESCE(ee.end_ts, sc.seg_end_t) AS INTEGER) AS end_ts,\n    CAST(COALESCE(ee.end_ts, sc.seg_end_t) AS INTEGER) - CAST(COALESCE(se.start_ts, sc.seg_start_t) AS INTEGER) AS duration\nFROM safe_candidates sc\nLEFT JOIN start_events se ON sc.obj_id = se.obj_id AND sc.grp = se.grp\nLEFT JOIN end_events ee ON sc.obj_id = ee.obj_id AND sc.grp = ee.grp\nWHERE COALESCE(ee.end_ts, sc.seg_end_t) > COALESCE(se.start_ts, sc.seg_start_t)\nORDER BY start_ts;"
