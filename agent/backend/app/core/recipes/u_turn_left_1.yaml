name: u_turn_left_1
version: '1.0'
description: 掉头1：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: u_turn_left_1
    raw_sql: "-- 查询路口标签（子标签为LuturnIntersection，持续时间>4秒），且自车在最左侧车道，同时存在掉头标签\n-- 车道判断逻辑：从路口start_ts往前推，找到第一个没有uturn的帧\n\n-- 第零步：动态获取ego表的第一个ts作为包开始时间\nWITH ego_first_ts AS (\n    SELECT MIN(ts) as package_start_ts FROM ego\n),\n\n-- 第一步：获取LuturnIntersection标签\nraw_intersection_tags AS (\n    SELECT\n        start_ts,\n        end_ts,\n        end_ts - start_ts AS duration\n    FROM range_tag\n    WHERE tag_name = 'Intersection'\n      AND json_extract(param, '$.sub_tag') = 'LuturnIntersection'\n      AND end_ts - start_ts > 4\n),\n\n-- 第二步：聚合路口标签（5秒内连续的都合并）\nintersection_with_gap AS (\n    SELECT\n        start_ts,\n        end_ts,\n        duration,\n        -- 检测是否需要新分组（间隔>5秒）\n        CASE\n            WHEN LAG(end_ts) OVER (ORDER BY start_ts) IS NULL THEN 1\n            WHEN (start_ts - LAG(end_ts) OVER (ORDER BY start_ts)) > 5 THEN 1\n            ELSE 0\n        END as is_new_group\n    FROM raw_intersection_tags\n),\n\nintersection_grouped AS (\n    SELECT\n        start_ts,\n      \
      \  end_ts,\n        duration,\n        SUM(is_new_group) OVER (ORDER BY start_ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM intersection_with_gap\n),\n\n-- 聚合后的路口标签\naggregated_intersections AS (\n    SELECT\n        group_id,\n        MIN(start_ts) as intersection_start_ts,\n        MAX(end_ts) as intersection_end_ts,\n        SUM(duration) as total_duration\n    FROM intersection_grouped\n    GROUP BY group_id\n),\n\n-- 检查聚合后的路口范围内是否有掉头标签\nintersections_with_uturn AS (\n    SELECT\n        ai.group_id,\n        ai.intersection_start_ts,\n        ai.intersection_end_ts,\n        ai.total_duration,\n        -- 检查路口范围内是否存在uturn标签\n        EXISTS (\n            SELECT 1\n            FROM range_tag r\n            WHERE r.tag_name = 'Turning'\n              AND json_extract(r.param, '$.sub_tag') = 'uturn'\n              AND r.start_ts <= ai.intersection_end_ts\n              AND r.end_ts >= ai.intersection_start_ts\n        ) as has_uturn_in_range\n    FROM aggregated_intersections\
      \ ai\n),\n\n-- 过滤掉没有uturn的路口\nfiltered_intersections AS (\n    SELECT\n        group_id,\n        intersection_start_ts,\n        intersection_end_ts,\n        total_duration\n    FROM intersections_with_uturn\n    WHERE has_uturn_in_range = 1\n),\n\n-- 第三步：为每个聚合后的路口，往前找到第一个没有uturn的帧\n-- 获取所有uturn时间段\nuturn_tags AS (\n    SELECT\n        start_ts as uturn_start,\n        end_ts as uturn_end\n    FROM range_tag\n    WHERE tag_name = 'Turning'\n      AND json_extract(param, '$.sub_tag') = 'uturn'\n),\n\n-- 找到判断帧（从路口start_ts往前，第一个没有uturn的帧）\njudgment_frames AS (\n    SELECT\n        fi.group_id,\n        fi.intersection_start_ts,\n        fi.intersection_end_ts,\n        fi.total_duration,\n        -- 找到第一个没有uturn的帧（从intersection_start_ts往前推）\n        -- 方法：找最大的 ts，使得 ts < intersection_start_ts 且 ts 不在任何uturn范围内\n        (\n            SELECT MAX(ts)\n            FROM (\n                -- 生成候选帧（从intersection_start_ts往前10秒内的所有帧）\n                SELECT DISTINCT e.ts\n                FROM\
      \ ego e\n                WHERE e.ts < fi.intersection_start_ts\n                  AND e.ts >= fi.intersection_start_ts - 10\n                  AND NOT EXISTS (\n                      -- 排除在uturn范围内的帧\n                      SELECT 1 FROM uturn_tags u\n                      WHERE e.ts >= u.uturn_start AND e.ts <= u.uturn_end\n                  )\n            )\n        ) as judgment_ts\n    FROM filtered_intersections fi\n),\n\n-- 第四步：检查判断帧的车道信息\nleft_lane_check AS (\n    SELECT\n        jf.group_id,\n        jf.intersection_start_ts,\n        jf.intersection_end_ts,\n        jf.total_duration,\n        jf.judgment_ts,\n        -- 检查判断帧的车道\n        EXISTS (\n            SELECT 1\n            FROM ego e\n            WHERE e.ts = jf.judgment_ts\n              AND e.gl_left_cnt IN (0,1)\n        ) as has_left_lane_zero\n    FROM judgment_frames jf\n    WHERE jf.judgment_ts IS NOT NULL\n)\n\n-- 最终输出\nSELECT\n    'u_turn_left_1' AS tag_name,\n    -- 如果路口开始时间-10小于包开始时间，就用包开始时间\n    CASE \n\
      \        WHEN lc.intersection_start_ts - 10 < e.package_start_ts THEN e.package_start_ts\n        ELSE lc.intersection_start_ts - 10\n    END AS start_ts,\n    lc.intersection_end_ts AS end_ts,\n    lc.total_duration as duration\nFROM left_lane_check lc, ego_first_ts e\nWHERE lc.has_left_lane_zero = 1\nORDER BY lc.intersection_start_ts;"
