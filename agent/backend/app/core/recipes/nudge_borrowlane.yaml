name: nudge_borrowlane
version: '1.0'
description: '借道避让：自车微调方向借用相邻车道避让

  产线SQL直通模式(raw_sql)，不经Block组装。'
blocks: []
variants:
  default:
    tag_name: nudge_borrowlane
    raw_sql: "-- =============================================================================\n-- Scene: Borrow-Lane Nudge Detection (V8.7)\n-- Description: Detects ego vehicle temporarily crossing or pressing the lane\n--              boundary to avoid a front obstacle, then returning to original lane.\n--              Based purely on raw data (ego + dynamic_obj), no range_tag dependency.\n-- Note: This dataset has very few true boundary-crossing frames; threshold relaxed\n--       to <= 0.75m to capture \"lane pressing\" behavior as proxy for borrowing.\n-- Enhancement (V8.7): Single-file dynamic tag_name mapping.\n--   - SQL output maps borrow_dir to nudge_left / nudge_right dynamically.\n--   - No need to split into separate rule files since left/right are mutually exclusive.\n-- Enhancement (V8.7): Centerline perception jump filtering.\n--   - Computes per-frame centerline_delta in lagged CTE.\n--   - Filters out segments with max_centerline_delta > 2.0m to remove perception noise.\n\
      -- Enhancement (V8.6): Boundary obstacle direction consistency check.\n--   - Checks segment_start_ts - 1 frame to prevent false positives caused by\n--     perception ID switch or y-coordinate jump at segment boundary.\n--   - Rejects segment if target obstacle crossed centerline at the boundary.\n-- Enhancement (V8.4): Both pre and post return-to-center required (AND instead of OR).\n--   - Pre-segment centerline must also be close to center (< 0.8m), ensuring\n--     the segment starts from a centered state, not an already-offset state.\n-- Enhancement (V8.3): Tolerate 1-frame in_lane interruptions in borrow sequences.\n-- Enhancement (V8.2): Dynamic jump threshold based on ego_lane_width.\n--   - Jump threshold = MAX(ego_lane_width * 0.4, 1.0) instead of fixed 1.5m\n--   - Detects frames AFTER crossing into adjacent lane (centerline jump with sign flip)\n--   - Marks segments with has_jump flag to distinguish lane-crossing borrow from lane-pressing\n--   - Locks onto the most relevant\
      \ obstacle at segment start\n--   - Tracks the same obj_id throughout the segment\n--   - Verifies ego overtakes the target obstacle\n-- Key Constraints:\n--   - Lane boundary proximity: ego_to_left/right_boundary_dist <= 0.75m\n--   - Lane crossing: centerline jump > MAX(lane_width*0.4, 1.0m) with sign change (crossed into adjacent lane)\n--   - Direction consistency: all frames in segment on same side of centerline\n--   - Return-to-center: BOTH pre-segment AND post-segment centerline must be within 0.8m\n--   - Obstacle presence: front dynamic obstacle (x>0, x<40, ABS(y)<3.5)\n--   - Obstacle tracking: same obj_id tracked, present >= 50% frames, overtaken\n--   - Avoidance consistency: ego must offset AWAY from obstacle direction\n--   - Boundary consistency: obstacle direction must not cross centerline at segment boundary\n--   - Centerline jump filter: max_centerline_delta <= 2.0m (V8.7)\n--   - Dynamic tag_name: nudge_left / nudge_right based on borrow_dir (V8.7)\n--   - No intersection:\
      \ ego_lane_successor_count <= 1 AND ego_lane_predecessor_count <= 1\n--   - Duration: 2~12 seconds (shorter than formal lane change)\n-- =============================================================================\n\nWITH\n-- V8: Detect centerline jumps using LAG window function\nlagged AS (\n    SELECT ts,\n           ego_to_centerline_dist,\n           ego_to_left_boundary_dist,\n           ego_to_right_boundary_dist,\n           ego_lane_width,\n           speed,\n           LAG(ego_to_left_boundary_dist) OVER (ORDER BY ts) AS prev_left,\n           LAG(ego_to_right_boundary_dist) OVER (ORDER BY ts) AS prev_right,\n           LAG(ego_to_centerline_dist) OVER (ORDER BY ts) AS prev_centerline,\n           ABS(ego_to_centerline_dist - LAG(ego_to_centerline_dist) OVER (ORDER BY ts)) AS centerline_delta\n    FROM ego\n    WHERE ego_to_centerline_dist != -1.0\n      AND ego_to_left_boundary_dist != -1.0\n      AND ego_to_right_boundary_dist != -1.0\n      AND ego_lane_width != -1.0\n\
      \      AND speed > 0.5\n),\nlane_state AS (\n    SELECT ts,\n           ego_to_centerline_dist,\n           ego_to_left_boundary_dist,\n           ego_to_right_boundary_dist,\n           speed,\n           centerline_delta,\n           CASE\n               -- Normal lane pressing\n               WHEN ego_to_left_boundary_dist <= 0.75 THEN 'borrow_left'\n               WHEN ego_to_right_boundary_dist <= 0.75 THEN 'borrow_right'\n               -- Just crossed into adjacent lane (left): prev frame pressed left, now large negative offset\n               WHEN prev_left <= 0.75 AND prev_left != -1.0\n                    AND ABS(ego_to_centerline_dist) > CASE WHEN ego_lane_width * 0.35 > 0.8 THEN ego_lane_width * 0.35 ELSE 0.8 END AND ego_to_centerline_dist < 0\n               THEN 'borrow_left'\n               -- Just crossed into adjacent lane (right): prev frame pressed right, now large positive offset\n               WHEN prev_right <= 0.75 AND prev_right != -1.0\n                  \
      \  AND ABS(ego_to_centerline_dist) > CASE WHEN ego_lane_width * 0.35 > 0.8 THEN ego_lane_width * 0.35 ELSE 0.8 END AND ego_to_centerline_dist > 0\n               THEN 'borrow_right'\n               ELSE 'in_lane'\n           END AS state,\n           -- Detect centerline jump (sign change with dynamic threshold based on lane width)\n           CASE\n               WHEN prev_centerline IS NOT NULL AND prev_centerline != -1.0\n                    AND ABS(ego_to_centerline_dist - prev_centerline) > CASE WHEN ego_lane_width * 0.4 > 1.0 THEN ego_lane_width * 0.4 ELSE 1.0 END\n                    AND (\n                        (prev_centerline > 0 AND ego_to_centerline_dist < 0)\n                        OR (prev_centerline < 0 AND ego_to_centerline_dist > 0)\n                    )\n               THEN 1 ELSE 0\n           END AS is_jump\n    FROM lagged\n),\n-- V8.3: Fill isolated 1-frame in_lane gaps surrounded by same-direction borrow\nfilled_frames AS (\n    SELECT ts, ego_to_centerline_dist,\
      \ state, is_jump, centerline_delta,\n           LAG(state) OVER (ORDER BY ts) AS prev_state,\n           LEAD(state) OVER (ORDER BY ts) AS next_state\n    FROM lane_state\n),\nstate_with_fill AS (\n    SELECT ts, ego_to_centerline_dist, is_jump, centerline_delta,\n           CASE\n               WHEN state IN ('borrow_left', 'borrow_right') THEN state\n               WHEN state = 'in_lane'\n                    AND prev_state = next_state\n                    AND prev_state IN ('borrow_left', 'borrow_right')\n               THEN prev_state\n               ELSE state\n           END AS state\n    FROM filled_frames\n),\nborrow_frames AS (\n    SELECT ts, ego_to_centerline_dist, state, is_jump, centerline_delta\n    FROM state_with_fill\n    WHERE state IN ('borrow_left', 'borrow_right')\n),\nnumbered AS (\n    SELECT ts, ego_to_centerline_dist, state, is_jump, centerline_delta,\n           ts - ROW_NUMBER() OVER (ORDER BY ts) AS grp\n    FROM borrow_frames\n),\nsegments AS (\n    SELECT\
      \ grp,\n           MIN(ts) AS segment_start_ts,\n           MAX(ts) AS segment_end_ts,\n           COUNT(*) AS nudge_duration,\n           (SELECT state FROM numbered n2 WHERE n2.grp = numbered.grp ORDER BY n2.ts ASC LIMIT 1) AS borrow_dir,\n           (SELECT ego_to_centerline_dist FROM numbered n2 WHERE n2.grp = numbered.grp ORDER BY n2.ts ASC LIMIT 1) AS first_centerline,\n           (SELECT ego_to_centerline_dist FROM numbered n2 WHERE n2.grp = numbered.grp ORDER BY n2.ts DESC LIMIT 1) AS last_centerline,\n           MIN(ego_to_centerline_dist) AS centerline_min,\n           MAX(ego_to_centerline_dist) AS centerline_max,\n           MAX(is_jump) AS has_jump,\n           MAX(centerline_delta) AS max_centerline_delta\n    FROM numbered\n    GROUP BY grp\n    HAVING COUNT(*) BETWEEN 2 AND 12\n),\n-- V7 Enhancement: Exclude intersection frames\nintersection_filter AS (\n    SELECT s.*\n    FROM segments s\n    WHERE NOT EXISTS (\n        SELECT 1 FROM ego e\n        WHERE e.ts BETWEEN\
      \ s.segment_start_ts AND s.segment_end_ts\n          AND (e.ego_lane_successor_count > 1 OR e.ego_lane_predecessor_count > 1)\n    )\n),\n-- V8.3: Lookup pre/post return-to-center timestamps and compute tag boundaries\npre_post_lookup AS (\n    SELECT s.grp,\n           (SELECT ts FROM ego e\n            WHERE e.ts < s.segment_start_ts\n              AND e.ts >= s.segment_start_ts - 3\n              AND e.ts >= (SELECT MIN(ts) FROM ego)\n              AND e.ego_to_centerline_dist != -1.0\n            ORDER BY ABS(e.ego_to_centerline_dist) ASC LIMIT 1) AS pre_ts,\n           (SELECT ego_to_centerline_dist FROM ego e\n            WHERE e.ts < s.segment_start_ts\n              AND e.ts >= s.segment_start_ts - 3\n              AND e.ts >= (SELECT MIN(ts) FROM ego)\n              AND e.ego_to_centerline_dist != -1.0\n            ORDER BY ABS(e.ego_to_centerline_dist) ASC LIMIT 1) AS pre_centerline,\n           (SELECT ts FROM ego e\n            WHERE e.ts > s.segment_end_ts\n          \
      \    AND e.ts <= s.segment_end_ts + 3\n              AND e.ts <= (SELECT MAX(ts) FROM ego)\n              AND e.ego_to_centerline_dist != -1.0\n            ORDER BY ABS(e.ego_to_centerline_dist) ASC LIMIT 1) AS post_ts,\n           (SELECT ego_to_centerline_dist FROM ego e\n            WHERE e.ts > s.segment_end_ts\n              AND e.ts <= s.segment_end_ts + 3\n              AND e.ts <= (SELECT MAX(ts) FROM ego)\n              AND e.ego_to_centerline_dist != -1.0\n            ORDER BY ABS(e.ego_to_centerline_dist) ASC LIMIT 1) AS post_centerline\n    FROM intersection_filter s\n),\nvalidated AS (\n    SELECT s.*,\n           pp.pre_ts,\n           pp.pre_centerline,\n           pp.post_ts,\n           pp.post_centerline,\n           COALESCE(pp.pre_ts, s.segment_start_ts) AS start_ts,\n           COALESCE(pp.post_ts, s.segment_end_ts) AS end_ts\n    FROM intersection_filter s\n    JOIN pre_post_lookup pp ON pp.grp = s.grp\n),\n-- V6 Enhancement: Target obstacle locking\ntarget_obstacle_candidates\
      \ AS (\n    SELECT s.grp, d.obj_id, d.type AS obj_type,\n           COUNT(*) AS appear_count,\n           MIN(d.x) AS min_x,\n           AVG(ABS(d.y)) AS avg_abs_y\n    FROM intersection_filter s\n    JOIN dynamic_obj d ON d.ts BETWEEN s.segment_start_ts AND s.segment_end_ts\n    WHERE d.x > 0 AND d.x < 40 AND ABS(d.y) < 3.5\n      AND d.type IN ('car', 'truck', 'bus', 'pedestrian', 'motorcycle', 'bicycle')\n    GROUP BY s.grp, d.obj_id, d.type\n),\ntarget_obstacle_ranked AS (\n    SELECT grp, obj_id, obj_type, appear_count, min_x,\n           ROW_NUMBER() OVER (PARTITION BY grp ORDER BY appear_count DESC, min_x, avg_abs_y) AS rn\n    FROM target_obstacle_candidates\n),\nlocked_obstacle AS (\n    SELECT grp, obj_id AS target_obj_id, obj_type AS target_obj_type, min_x AS start_x\n    FROM target_obstacle_ranked\n    WHERE rn = 1\n),\nobstacle_tracking AS (\n    SELECT lo.grp, lo.target_obj_id,\n           COUNT(DISTINCT d.ts) AS tracked_count,\n           MAX(CASE WHEN d.ts = s.segment_end_ts\
      \ THEN d.x END) AS end_x\n    FROM locked_obstacle lo\n    JOIN intersection_filter s ON s.grp = lo.grp\n    JOIN dynamic_obj d ON d.obj_id = lo.target_obj_id\n                       AND d.ts BETWEEN s.segment_start_ts AND s.segment_end_ts\n    GROUP BY lo.grp, lo.target_obj_id\n),\n-- V7 Fix: Add avoidance consistency check - ego must offset AWAY from obstacle\n-- V8.5 Enhancement: Obstacle direction must remain consistent throughout the entire segment\n-- V8.6 Enhancement: Boundary obstacle direction consistency - check segment_start_ts - 1 frame\n--   to prevent false positives caused by perception ID switch or y-coordinate jump at segment boundary\nobstacle_avoidance_check AS (\n    SELECT v.*, lo.target_obj_id, lo.target_obj_type, lo.start_x,\n           ot.tracked_count, ot.end_x,\n           (SELECT y FROM dynamic_obj d WHERE d.ts = v.segment_start_ts AND d.obj_id = lo.target_obj_id LIMIT 1) AS obs_y,\n           (SELECT MIN(y) FROM dynamic_obj d WHERE d.obj_id = lo.target_obj_id\
      \ AND d.ts BETWEEN v.segment_start_ts AND v.segment_end_ts) AS min_obs_y,\n           (SELECT MAX(y) FROM dynamic_obj d WHERE d.obj_id = lo.target_obj_id AND d.ts BETWEEN v.segment_start_ts AND v.segment_end_ts) AS max_obs_y,\n           (SELECT y FROM dynamic_obj d WHERE d.ts = v.segment_start_ts - 1 AND d.obj_id = lo.target_obj_id LIMIT 1) AS prev_obs_y\n    FROM validated v\n    JOIN locked_obstacle lo ON lo.grp = v.grp\n    JOIN obstacle_tracking ot ON ot.grp = v.grp AND ot.target_obj_id = lo.target_obj_id\n    WHERE ot.tracked_count >= CAST(v.nudge_duration * 0.5 AS INTEGER)\n      AND lo.start_x > 0\n      AND (ot.end_x IS NULL OR ot.end_x < lo.start_x)\n),\nobstacle_linked AS (\n    SELECT *\n    FROM obstacle_avoidance_check\n    WHERE (\n              (obs_y > 0 AND centerline_max < 0)   -- obstacle on LEFT, ego offsets RIGHT (away)\n           OR (obs_y < 0 AND centerline_min > 0)   -- obstacle on RIGHT, ego offsets LEFT (away)\n          )\n      AND (\n              (obs_y\
      \ > 0 AND min_obs_y > 0)        -- obstacle stays on LEFT throughout segment\n           OR (obs_y < 0 AND max_obs_y < 0)        -- obstacle stays on RIGHT throughout segment\n          )\n      AND (\n              prev_obs_y IS NULL                   -- no obstacle data before segment, cannot verify, pass conservatively\n           OR (obs_y > 0 AND prev_obs_y > 0)       -- obstacle was on LEFT before segment started\n           OR (obs_y < 0 AND prev_obs_y < 0)       -- obstacle was on RIGHT before segment started\n          )\n)\nSELECT\n    CASE\n        WHEN borrow_dir = 'borrow_left' THEN 'nudge_left'\n        WHEN borrow_dir = 'borrow_right' THEN 'nudge_right'\n        ELSE 'nudge_borrowlane'\n    END AS tag_name,\n    start_ts,\n    end_ts,\n    (end_ts - start_ts) AS total_duration,\n    nudge_duration,\n    CASE\n        WHEN centerline_min > 0 THEN 'borrow_left'\n        WHEN centerline_max < 0 THEN 'borrow_right'\n        ELSE borrow_dir\n    END AS sub_tag,\n    ROUND(centerline_min,\
      \ 3) AS centerline_min,\n    ROUND(centerline_max, 3) AS centerline_max,\n    ROUND(first_centerline, 3) AS first_centerline,\n    ROUND(last_centerline, 3) AS last_centerline,\n    ROUND(pre_centerline, 3) AS pre_centerline,\n    ROUND(post_centerline, 3) AS post_centerline,\n    segment_start_ts,\n    segment_end_ts,\n    target_obj_id,\n    target_obj_type,\n    has_jump,\n    '{' ||\n    '\"borrow_dir\":\"' || borrow_dir || '\",' ||\n    '\"max_offset\":' || ROUND(CASE WHEN ABS(centerline_min) > ABS(centerline_max) THEN ABS(centerline_min) ELSE ABS(centerline_max) END, 3) || ',' ||\n    '\"pre_center\":' || ROUND(pre_centerline, 3) || ',' ||\n    '\"post_center\":' || ROUND(post_centerline, 3) || ',' ||\n    '\"segment_start_ts\":' || segment_start_ts || ',' ||\n    '\"segment_end_ts\":' || segment_end_ts || ',' ||\n    '\"total_duration\":' || (end_ts - start_ts) || ',' ||\n    '\"nudge_duration\":' || nudge_duration || ',' ||\n    '\"target_obj_id\":\"' || COALESCE(target_obj_id,\
      \ '') || '\",' ||\n    '\"target_obj_type\":\"' || COALESCE(target_obj_type, '') || '\"' ||\n    '}' AS param\nFROM obstacle_linked\nWHERE ((centerline_min > 0 AND centerline_max > 0) OR (centerline_min < 0 AND centerline_max < 0))\n  AND pre_centerline IS NOT NULL\n  AND post_centerline IS NOT NULL\n  AND ABS(post_centerline) < 0.8\n  AND ABS(pre_centerline) < 0.8\n  AND max_centerline_delta <= 2.0\nORDER BY start_ts;"
