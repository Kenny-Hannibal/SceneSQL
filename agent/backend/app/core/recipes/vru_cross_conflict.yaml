name: vru_cross_conflict
version: '1.0'
description: VRU横穿冲突：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: vru_cross_conflict
    raw_sql: "-- 场景检索: vru_cross_conflict_v4.3\n-- 描述: VRU横穿冲突检测v4.3-从他车横穿v1.6经验迁移：增加conflict_result过滤+穿越方向验证+非横穿排除\n-- 创建时间: 2026-06-12\n-- v4.0-fix1 ~ v4.2-fix4: (见v4.2 SQL注释)\n-- v4.3改进(从他车横穿冲突v1.6经验迁移):\n--   1. 增加conflict_result过滤：只保留yielded/risky/mutual_stop/cautious\n--      + 满足特定条件的ego_proceed_clear(近距离+自车行驶+VRU快速横穿)\n--      → 他车v1.6发现ego_proceed_clear曾是100%FP(路口正常通行/多车道并行等)\n--      → 但近距离(min_dist<10)且高速横穿(cross_speed>10)且自车行驶(pre>10)的ego_proceed_clear是真实TP\n--      → VRU适配：VRU更小更慢，阈值调整为 min_dist<15 AND cross_speed>3 AND pre_speed>10 AND y_range>2.0\n--   2. 增加穿越方向检查: COALESCE(has_positive_y,0)=1 AND COALESCE(has_negative_y,0)=1\n--      → 确保VRU从一侧穿越到另一侧，而非路边行走\n--      → 他车v1.6有此检查，VRU v4.2缺失\n--   3. 增加非横穿排除: NOT(vru_y_range_m>12 AND COALESCE(has_x_positive,0)=0)\n--      → 过滤VRU沿道路方向行走而非横穿\n--      → 他车v1.6有此检查(vehicle_y_range>12 AND has_x_positive=0)\n--   4. VruProximity新增穿越方向字段: has_x_positive, has_positive_y, has_negative_y\n--      → 与他车v1.6的VehicleProximity保持一致\n\n--\
      \ ==============================================================================\n-- Scene: VRU Cross Conflict Detection v4.3\n-- 核心逻辑: 从range_tag筛选VRUCrossConflict事件，关联ego速度和VRU信息\n-- v4.3关键改进: conflict_result过滤(从他车v1.6迁移) + 穿越方向验证 + 非横穿排除\n-- 子场景分类: ego_yielded_forced / ego_yielded_smooth / ego_proceed_risky / mutual_stop\n--              ego_proceeded_cautious / ego_proceed_clear(受限)\n-- ==============================================================================\n\nWITH \n-- 第一步：从 range_tag 篮选 VRUCrossConflict 事件\nvru_events AS (\n    SELECT\n        rt.start_ts - 2.0 AS start_ts,\n        rt.end_ts + 2.0 AS end_ts,\n        (rt.end_ts + 2.0) - (rt.start_ts - 2.0) AS duration,\n        rt.param,\n        json_extract(rt.param, '$.conflict_object') AS conflict_object_operator,\n        CAST(json_extract(rt.param, '$.agent_id') AS INTEGER) AS agent_id,\n        CAST(json_extract(rt.param, '$.conflict_summary.grid_count') AS INTEGER) AS grid_count,\n        ROUND(CAST(json_extract(rt.param,\
      \ '$.conflict_summary.heading_diff_mean_deg') AS REAL), 2) AS heading_diff_mean_deg,\n        ROUND(CAST(json_extract(rt.param, '$.conflict_summary.time_diff_mean_s') AS REAL), 2) AS time_diff_mean_s\n    FROM range_tag rt\n    WHERE rt.tag_name = 'VRUCrossConflict'\n),\n\n-- 第二步：关联 ego 表获取自车速度信息 + 峰值减速计算\nEgoSpeedAnalysis AS (\n    SELECT\n        ve.start_ts, ve.end_ts, ve.duration, ve.param,\n        ve.conflict_object_operator, ve.agent_id, ve.grid_count,\n        ve.heading_diff_mean_deg, ve.time_diff_mean_s,\n        -- 冲突前平均速度（前2秒窗口）\n        ROUND(AVG(CASE WHEN e.ts < ve.start_ts THEN e.speed END), 2) AS pre_speed_kmh,\n        -- 冲突期间速度统计\n        ROUND(AVG(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END), 2) AS during_speed_avg_kmh,\n        ROUND(MIN(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END), 2) AS during_min_speed_kmh,\n        -- 新增v4.0: 总减速量(更直觉) = pre_avg - during_min\n        ROUND(AVG(CASE WHEN e.ts < ve.start_ts THEN e.speed\
      \ END) - \n              MIN(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts THEN e.speed END), 2) AS speed_drop_total_kmh,\n        -- 峰值减速：最大1秒速度差（LEFT JOIN e2获取前1秒ego点）\n        ROUND(MAX(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts \n            THEN ABS(e.speed - COALESCE(e2.speed, e.speed)) END), 2) AS speed_drop_peak_1s,\n        -- 峰值减速度（m/s²）: speed差 / 时间差(1s) * (1000/3600)\n        ROUND(MAX(CASE WHEN e.ts BETWEEN ve.start_ts AND ve.end_ts \n            THEN ABS(e.speed - COALESCE(e2.speed, e.speed)) / 1.0 * (1000.0/3600.0) END), 2) AS max_decel_mps2,\n        -- yaw\n        ROUND(MAX(e.utm_yaw) - MIN(e.utm_yaw), 2) AS yaw_range_raw,\n        -- 行驶距离\n        MAX(e.cumulative_distance) - MIN(e.cumulative_distance) AS distance_traveled_m\n    FROM vru_events ve\n    LEFT JOIN ego e ON e.ts >= ve.start_ts - 2 AND e.ts <= ve.end_ts + 2\n    LEFT JOIN ego e2 ON e2.ts = e.ts - 1\n    GROUP BY\n        ve.start_ts, ve.end_ts, ve.duration, ve.param,\n        ve.conflict_object_operator,\
      \ ve.agent_id, ve.grid_count,\n        ve.heading_diff_mean_deg, ve.time_diff_mean_s\n),\n\n-- 第三步：关联 dynamic_obj 计算 VRU 最小距离和真实类型（含VRU类型过滤+穿越方向）\n-- v4.3新增: has_x_positive, has_positive_y, has_negative_y 穿越方向字段\nVruProximity AS (\n    SELECT\n        esa.start_ts, esa.end_ts, esa.agent_id,\n        -- VRU最小距离\n        CASE WHEN COUNT(d.obj_id) = 0 THEN 999\n             ELSE ROUND(MIN(SQRT(COALESCE(d.x,0)*COALESCE(d.x,0) + COALESCE(d.y,0)*COALESCE(d.y,0))), 2)\n        END AS min_dist_to_vru_m,\n        -- VRU真实类型（只取valid VRU类型）\n        CASE \n            WHEN d.type IN ('pedestrian','cyclist','motorcycle','stroller','wheelchair','animal')\n                THEN d.type\n            ELSE NULL\n        END AS vru_type_actual,\n        -- 是否有valid VRU类型\n        CASE WHEN COUNT(d.obj_id) = 0 THEN 0\n             WHEN MAX(CASE WHEN d.type IN ('pedestrian','cyclist','motorcycle','stroller','wheelchair','animal')\n                          THEN 1 ELSE 0 END) >= 1 THEN 1\n             ELSE\
      \ 0\n        END AS has_valid_vru_type,\n        -- VRU是否有is_static=1的记录\n        MAX(CASE WHEN d.is_static = 1 THEN 1 ELSE 0 END) AS vru_has_static_record,\n        -- VRU的横穿y坐标范围\n        MAX(ABS(COALESCE(d.y,0))) - MIN(ABS(COALESCE(d.y,0))) AS vru_y_range_m,\n        -- VRU横穿时的最大绝对速度\n        ROUND(MAX(ABS(COALESCE(d.absolute_velocity_y,0))), 2) AS vru_max_cross_speed_kmh,\n        -- v4.3新增: 穿越方向字段(从他车v1.6迁移)\n        -- VRU有x>0记录(在自车前方)\n        MAX(CASE WHEN d.x > 0 THEN 1 ELSE 0 END) AS has_x_positive,\n        -- VRU有y>0记录(左侧穿越)\n        MAX(CASE WHEN d.y > 0 THEN 1 ELSE 0 END) AS has_positive_y,\n        -- VRU有y<0记录(右侧穿越)\n        MAX(CASE WHEN d.y < 0 THEN 1 ELSE 0 END) AS has_negative_y\n    FROM EgoSpeedAnalysis esa\n    LEFT JOIN dynamic_obj d \n        ON CAST(d.obj_id AS INTEGER) = esa.agent_id\n        AND d.ts BETWEEN esa.start_ts + 2 AND esa.end_ts - 2\n    GROUP BY esa.start_ts, esa.end_ts, esa.agent_id\n),\n\n-- 第四步：合并 ego速度分析 + VRU距离 + 计算冲突结果、严重度、双标注\nWithConflictResult\
      \ AS (\n    SELECT\n        esa.*,\n        vp.min_dist_to_vru_m,\n        vp.vru_type_actual,\n        vp.has_valid_vru_type,\n        vp.vru_has_static_record,\n        vp.vru_y_range_m,\n        vp.vru_max_cross_speed_kmh,\n        vp.has_x_positive,\n        vp.has_positive_y,\n        vp.has_negative_y,\n        CASE WHEN esa.yaw_range_raw > 3.14 THEN ROUND(6.28 - esa.yaw_range_raw, 2) ELSE esa.yaw_range_raw END AS delta_yaw_max,\n        CASE\n            WHEN esa.during_speed_avg_kmh IS NULL AND esa.pre_speed_kmh IS NULL THEN 'unclear'\n            WHEN esa.during_min_speed_kmh < 3 AND esa.pre_speed_kmh BETWEEN 5 AND 20 AND vp.vru_max_cross_speed_kmh > 0 THEN 'mutual_stop'\n            WHEN (esa.speed_drop_total_kmh > 12 \n                  OR esa.speed_drop_peak_1s > 10 \n                  OR esa.max_decel_mps2 > 2.8)\n                 AND esa.during_min_speed_kmh < 25 THEN 'ego_yielded_forced'\n            WHEN (esa.pre_speed_kmh - esa.during_speed_avg_kmh > 5 \n         \
      \         OR esa.speed_drop_peak_1s > 5 \n                  OR esa.max_decel_mps2 > 1.4)\n                 AND esa.during_speed_avg_kmh > 5 THEN 'ego_yielded_smooth'\n            WHEN esa.during_speed_avg_kmh >= esa.pre_speed_kmh * 0.85\n                 AND COALESCE(vp.min_dist_to_vru_m, 999) < 3\n                 AND esa.pre_speed_kmh > 15 THEN 'ego_proceed_risky'\n            WHEN esa.during_speed_avg_kmh >= esa.pre_speed_kmh * 0.85 THEN 'ego_proceed_clear'\n            ELSE 'ego_proceeded_cautious'\n        END AS conflict_result,\n        CASE\n            WHEN esa.pre_speed_kmh IS NULL OR esa.during_speed_avg_kmh IS NULL THEN 'unknown'\n            WHEN esa.during_min_speed_kmh < 3 AND esa.pre_speed_kmh < 15 AND vp.vru_max_cross_speed_kmh > 0 THEN 'boundary'\n            WHEN (esa.speed_drop_total_kmh > 12 OR esa.speed_drop_peak_1s > 10 OR esa.max_decel_mps2 > 2.8)\n                 AND esa.during_min_speed_kmh < 25 THEN 'yielded'\n            WHEN (esa.pre_speed_kmh - esa.during_speed_avg_kmh\
      \ > 5 OR esa.speed_drop_peak_1s > 5 OR esa.max_decel_mps2 > 1.4)\n                 AND esa.during_speed_avg_kmh > 5 THEN 'yielded'\n            ELSE 'proceed'\n        END AS conflict_label,\n        CASE\n            WHEN esa.pre_speed_kmh IS NULL THEN 'unclear'\n            WHEN COALESCE(vp.min_dist_to_vru_m, 999) < 10 THEN 'critical'\n            WHEN (esa.speed_drop_total_kmh > 15 OR esa.max_decel_mps2 > 4.2)\n                 AND COALESCE(vp.min_dist_to_vru_m, 999) < 20 THEN 'critical'\n            WHEN COALESCE(vp.min_dist_to_vru_m, 999) < 20 THEN 'moderate'\n            WHEN (esa.speed_drop_total_kmh > 8 OR esa.max_decel_mps2 > 2.2)\n                 AND COALESCE(vp.min_dist_to_vru_m, 999) < 30 THEN 'moderate'\n            WHEN esa.speed_drop_total_kmh > 3 OR esa.during_speed_avg_kmh < esa.pre_speed_kmh * 0.9 THEN 'minor'\n            ELSE 'no_conflict'\n        END AS severity_level\n    FROM EgoSpeedAnalysis esa\n    LEFT JOIN VruProximity vp ON esa.start_ts = vp.start_ts\
      \ AND esa.end_ts = vp.end_ts AND esa.agent_id = vp.agent_id\n),\n\n-- 第五步：筛选有效事件（v4.3新增conflict_result过滤+穿越方向验证+非横穿排除）\nfinal_events AS (\n    SELECT\n        start_ts, end_ts, duration,\n        conflict_object_operator, conflict_result, conflict_label, severity_level,\n        agent_id, grid_count, heading_diff_mean_deg, time_diff_mean_s,\n        pre_speed_kmh, during_speed_avg_kmh, during_min_speed_kmh,\n        speed_drop_total_kmh, speed_drop_peak_1s, max_decel_mps2,\n        min_dist_to_vru_m, vru_type_actual, has_valid_vru_type,\n        vru_has_static_record, vru_y_range_m, vru_max_cross_speed_kmh,\n        has_x_positive, has_positive_y, has_negative_y,\n        delta_yaw_max, distance_traveled_m, param\n    FROM WithConflictResult\n    WHERE start_ts IS NOT NULL AND end_ts IS NOT NULL\n      AND end_ts > start_ts\n      AND distance_traveled_m > 0\n      AND delta_yaw_max < 0.35\n      AND COALESCE(pre_speed_kmh, during_speed_avg_kmh) BETWEEN 1 AND 60\n      AND has_valid_vru_type\
      \ >= 1\n      AND min_dist_to_vru_m < 50\n      AND vru_y_range_m > 1.0\n      AND vru_max_cross_speed_kmh > 1.0\n      AND duration >= 5.0\n      -- v4.3新增(从他车v1.6迁移): 穿越方向验证\n      -- VRU必须从一侧穿越到另一侧(has_positive_y=1 AND has_negative_y=1)\n      -- 过滤路边行走/单向靠近的VRU\n      AND COALESCE(has_positive_y, 0) = 1\n      AND COALESCE(has_negative_y, 0) = 1\n      -- v4.3新增(从他车v1.6迁移): 非横穿排除\n      -- VRU的y_range很大但没有x变化，说明沿道路方向行走而非横穿\n      AND NOT (vru_y_range_m > 12 AND COALESCE(has_x_positive, 0) = 0)\n      -- v4.3新增(从他车v1.6迁移): conflict_result过滤\n      -- 核心改进：ego_proceed_clear不再无条件通过\n      -- 他车v1.6发现：ego_proceed_clear大部分是FP(路口正常通行/多车道并行等)\n      -- 但近距离+自车行驶+高速横穿的ego_proceed_clear可以是真实TP\n      -- VRU适配阈值：min_dist<15(VRU更小更近) AND cross_speed>3(VRU更慢但需有横穿速度)\n      --               AND pre_speed>10(自车行驶) AND y_range>2.0(真实横穿)\n      AND (conflict_result IN ('ego_yielded_forced', 'ego_yielded_smooth', 'ego_proceed_risky', 'mutual_stop', 'ego_proceeded_cautious')\n           OR (conflict_result\
      \ = 'ego_proceed_clear'\n               AND min_dist_to_vru_m < 15\n               AND COALESCE(pre_speed_kmh, 0) > 10\n               AND vru_max_cross_speed_kmh > 3\n               AND vru_y_range_m > 2.0))\n),\n\n-- 第六步：合并相邻/重叠事件（保留最严重的conflict_result和severity_level）\nsorted_events AS (\n    SELECT *, ROW_NUMBER() OVER (ORDER BY start_ts) AS rn FROM final_events\n),\nevent_boundaries AS (\n    SELECT *, MAX(end_ts) OVER (ORDER BY start_ts ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS prev_max_end FROM sorted_events\n),\nevent_groups AS (\n    SELECT *, SUM(CASE WHEN prev_max_end IS NULL OR start_ts > prev_max_end THEN 1 ELSE 0 END) OVER (ORDER BY start_ts ROWS UNBOUNDED PRECEDING) AS grp_id FROM event_boundaries\n),\nmerged_groups AS (\n    SELECT\n        grp_id,\n        MIN(start_ts) AS merged_start,\n        MAX(end_ts) AS merged_end,\n        COUNT(*) AS event_count,\n        CASE \n            WHEN SUM(CASE WHEN conflict_result = 'ego_yielded_forced' THEN 1 ELSE 0 END)\
      \ > 0 THEN 'ego_yielded_forced'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_yielded_smooth' THEN 1 ELSE 0 END) > 0 THEN 'ego_yielded_smooth'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_proceed_risky' THEN 1 ELSE 0 END) > 0 THEN 'ego_proceed_risky'\n            WHEN SUM(CASE WHEN conflict_result = 'mutual_stop' THEN 1 ELSE 0 END) > 0 THEN 'mutual_stop'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_proceeded_cautious' THEN 1 ELSE 0 END) > 0 THEN 'ego_proceeded_cautious'\n            WHEN SUM(CASE WHEN conflict_result = 'ego_proceed_clear' THEN 1 ELSE 0 END) > 0 THEN 'ego_proceed_clear'\n            ELSE 'unclear'\n        END AS severity_conflict_result,\n        CASE \n            WHEN SUM(CASE WHEN conflict_label = 'yielded' THEN 1 ELSE 0 END) > 0 THEN 'yielded'\n            WHEN SUM(CASE WHEN conflict_label = 'boundary' THEN 1 ELSE 0 END) > 0 THEN 'boundary'\n            ELSE 'proceed'\n        END AS merged_conflict_label,\n        CASE \n         \
      \   WHEN SUM(CASE WHEN severity_level = 'critical' THEN 1 ELSE 0 END) > 0 THEN 'critical'\n            WHEN SUM(CASE WHEN severity_level = 'moderate' THEN 1 ELSE 0 END) > 0 THEN 'moderate'\n            WHEN SUM(CASE WHEN severity_level = 'minor' THEN 1 ELSE 0 END) > 0 THEN 'minor'\n            ELSE 'no_conflict'\n        END AS merged_severity_level,\n        GROUP_CONCAT(DISTINCT conflict_object_operator) AS conflict_objects_operator,\n        GROUP_CONCAT(DISTINCT vru_type_actual) AS vru_types_actual,\n        GROUP_CONCAT(DISTINCT CAST(agent_id AS TEXT)) AS obj_ids,\n        SUM(grid_count) AS total_grid_count,\n        ROUND(MAX(speed_drop_total_kmh), 2) AS max_speed_drop_total,\n        ROUND(MAX(speed_drop_peak_1s), 2) AS max_speed_drop_peak,\n        ROUND(MAX(max_decel_mps2), 2) AS max_decel_peak_mps2,\n        ROUND(AVG(pre_speed_kmh), 2) AS avg_pre_speed_kmh,\n        ROUND(AVG(during_min_speed_kmh), 2) AS avg_min_speed_kmh,\n        ROUND(AVG(during_speed_avg_kmh), 2) AS\
      \ avg_during_speed_kmh,\n        ROUND(MIN(min_dist_to_vru_m), 2) AS closest_vru_dist_m,\n        ROUND(MAX(vru_y_range_m), 2) AS max_vru_y_range_m,\n        ROUND(MAX(vru_max_cross_speed_kmh), 2) AS max_vru_cross_speed_kmh,\n        MAX(vru_has_static_record) AS has_static_vru\n    FROM event_groups\n    GROUP BY grp_id\n),\n\n-- 第七步：丢弃合并后>30s的片段\nvalid_groups AS (\n    SELECT * FROM merged_groups WHERE merged_end - merged_start <= 30.0\n)\n\n-- 最终输出\nSELECT\n    'vru_cross_conflict' AS tag_name,\n    merged_start AS start_ts,\n    merged_end AS end_ts,\n    ROUND(merged_end - merged_start, 2) AS duration,\n    severity_conflict_result AS conflict_result,\n    merged_conflict_label AS conflict_label,\n    merged_severity_level AS severity_level,\n    vru_types_actual AS vru_type,\n    obj_ids AS obj_id,\n    total_grid_count AS grid_count,\n    max_speed_drop_total AS speed_drop_total_kmh,\n    max_speed_drop_peak AS speed_drop_peak_kmh,\n    max_decel_peak_mps2 AS decel_peak_mps2,\n\
      \    avg_pre_speed_kmh AS pre_speed_kmh,\n    avg_during_speed_kmh AS during_speed_avg_kmh,\n    avg_min_speed_kmh AS during_min_speed_kmh,\n    closest_vru_dist_m AS min_vru_dist_m,\n    max_vru_y_range_m AS vru_y_range_m,\n    max_vru_cross_speed_kmh AS vru_cross_speed_kmh,\n    has_static_vru AS has_static_vru\nFROM valid_groups\nORDER BY merged_start;"
