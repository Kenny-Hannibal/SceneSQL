name: link_attribute_track
version: '1.0'
description: 道路属性：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Link_Attribute_Track
    raw_sql: "-- Link 属性 Track SQL脚本\n-- 功能：通过 ego_static_map_link_id JOIN static_link 获取 link_attribute，并聚合连续的时间段\n\nWITH ego_marked AS (\n    -- 第一步：标识连续 -1 序列的起始点\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        -- 标识连续序列的起始点：当前是 -1 且前一帧不是 -1\n        CASE \n            WHEN ego_static_map_link_id = -1 AND (LAG(ego_static_map_link_id) OVER (ORDER BY ts) IS NULL OR LAG(ego_static_map_link_id) OVER (ORDER BY ts) != -1)\n            THEN 1\n            ELSE 0\n        END as is_sequence_start\n    FROM ego\n),\n\nego_with_group_id AS (\n    -- 第二步：使用累积求和为每个连续序列分配 group_id\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        SUM(is_sequence_start) OVER (ORDER BY ts) as group_id\n    FROM ego_marked\n),\n\nego_with_group_size AS (\n    -- 第三步：计算每个 group 的大小（连续 -1 的帧数）\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        group_id,\n        COUNT(*) OVER (PARTITION BY group_id) as group_size\n  \
      \  FROM ego_with_group_id\n    WHERE ego_static_map_link_id = -1\n),\n\nego_all_with_size AS (\n    -- 第四步：将 group_size 关联回所有帧\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.ego_static_map_link_id,\n        COALESCE(egs.group_size, 0) as consecutive_minus_one_count\n    FROM ego_with_group_id e\n    LEFT JOIN ego_with_group_size egs ON e.ts = egs.ts\n),\n\nego_with_prev_valid AS (\n    -- 第五步：找到每个 -1 序列之前的最后一个有效 link_id\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        consecutive_minus_one_count,\n        -- 对每个 -1 帧，找到它之前的最后一个非 -1 的 link_id\n        MAX(CASE WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id END) OVER (\n            ORDER BY ts \n            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING\n        ) as prev_valid_link_id\n    FROM ego_all_with_size\n),\n\nego_with_filled_link AS (\n    -- 第六步：只对连续 -1 长度 ≤ 2 的序列进行前向填充\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id as original_link_id,\n\
      \        CASE \n            -- 如果不是 -1，使用原始值\n            WHEN ego_static_map_link_id != -1 THEN ego_static_map_link_id\n            -- 如果连续 -1 长度 > 2，不填充，保持 -1\n            WHEN consecutive_minus_one_count > 2 THEN -1\n            -- 如果连续 ≤ 2 帧，使用序列之前的有效 link_id\n            ELSE prev_valid_link_id\n        END as ego_static_map_link_id\n    FROM ego_with_prev_valid\n),\n\nego_with_link_attribute AS (\n    SELECT \n        e.ts,\n        e.ts_ms,\n        e.ego_static_map_link_id,\n        sl.link_attribute,\n        -- 将 link_attribute 转换为文本描述\n        CASE \n            WHEN sl.link_attribute IS NULL THEN 'invalid_link_attr_unknown'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 0 THEN 'link_attr_none'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 1 THEN 'link_attr_tunnel'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 2 THEN 'link_attr_bridge'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 3 THEN 'link_attr_viaduct'\n            WHEN CAST(sl.link_attribute\
      \ AS INTEGER) = 4 THEN 'link_attr_toll_station'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 5 THEN 'link_attr_toll_entrance'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 6 THEN 'link_attr_toll_exit'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 7 THEN 'link_attr_dead_end'\n            WHEN CAST(sl.link_attribute AS INTEGER) = 255 THEN 'link_attr_other'\n            -- 处理中文字符串枚举（来自数据库）\n            WHEN CAST(sl.link_attribute AS TEXT) = '无特殊属性' THEN 'link_attr_none'\n            WHEN CAST(sl.link_attribute AS TEXT) = '隧道' THEN 'link_attr_tunnel'\n            WHEN CAST(sl.link_attribute AS TEXT) = '桥梁' THEN 'link_attr_bridge'\n            WHEN CAST(sl.link_attribute AS TEXT) = '高架桥' THEN 'link_attr_viaduct'\n            WHEN CAST(sl.link_attribute AS TEXT) = '收费站' THEN 'link_attr_toll_station'\n            WHEN CAST(sl.link_attribute AS TEXT) = '收费站入口' THEN 'link_attr_toll_entrance'\n            WHEN CAST(sl.link_attribute AS TEXT) = '收费站出口' THEN 'link_attr_toll_exit'\n\
      \            WHEN CAST(sl.link_attribute AS TEXT) = '断头路' THEN 'link_attr_dead_end'\n            WHEN CAST(sl.link_attribute AS TEXT) = '其他' THEN 'link_attr_other'\n            WHEN CAST(sl.link_attribute AS TEXT) = '未知' THEN 'invalid_link_attr_unknown'\n            ELSE 'invalid_link_attr_unknown'\n        END as tag_name\n    FROM ego_with_filled_link e\n    LEFT JOIN static_link sl ON CAST(e.ego_static_map_link_id AS TEXT) = sl.link_id\n    ORDER BY ts\n),\n\n-- 使用窗口函数检测标签变化点\ntag_changes AS (\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        link_attribute,\n        tag_name,\n        CASE \n            WHEN LAG(tag_name) OVER (ORDER BY ts) != tag_name \n                 OR LAG(tag_name) OVER (ORDER BY ts) IS NULL \n            THEN 1 \n            ELSE 0 \n        END as is_change\n    FROM ego_with_link_attribute\n),\n\n-- 为每个连续的标签段分配组ID\ngrouped_tags AS (\n    SELECT \n        ts,\n        ts_ms,\n        ego_static_map_link_id,\n        link_attribute,\n\
      \        tag_name,\n        SUM(is_change) OVER (ORDER BY ts ROWS UNBOUNDED PRECEDING) as group_id\n    FROM tag_changes\n),\n\n-- 聚合每个组的起止时间\naggregated_segments AS (\n    SELECT \n        tag_name,\n        MIN(ts) as start_ts,\n        MAX(ts) as end_ts,\n        MIN(ts_ms) as start_ts_ms,\n        MAX(ts_ms) as end_ts_ms,\n        COUNT(*) as frame_count\n    FROM grouped_tags\n    GROUP BY tag_name, group_id\n    ORDER BY start_ts\n)\n\n-- 最终输出结果\nSELECT \n    tag_name,\n    CAST(start_ts_ms * 1000000 AS INTEGER) as start_time,  -- 毫秒转纳秒\n    CAST(end_ts_ms * 1000000 AS INTEGER) as end_time,      -- 毫秒转纳秒\n    start_ts,\n    end_ts,\n    start_ts_ms,\n    end_ts_ms,\n    frame_count\nFROM aggregated_segments;"
