name: Intersection_Stop
version: '1.0'
description: 路口停车：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: Intersection_Stop
    raw_sql: "WITH stop_segments AS (\n  -- 第一步：识别连续的停车片段\n  SELECT \n    MIN(ts) AS stop_start_ts,\n    MAX(ts) AS stop_end_ts,\n    MIN(latest_stop_line_direction) AS min_distance_to_stopline,\n    MIN(cumulative_distance) AS start_cumulative_distance\n  FROM (\n    SELECT \n      e.ts, \n      e.latest_stop_line_direction,\n      e.cumulative_distance,\n      -- 使用差值技巧识别连续的帧\n      e.ts - ROW_NUMBER() OVER (ORDER BY e.ts) AS grp\n    FROM ego e\n    WHERE e.latest_stop_line_direction BETWEEN -15 AND -0.01\n      AND ABS(e.speed) < 0.1\n  ) t\n  GROUP BY grp\n  HAVING (MAX(ts) - MIN(ts)) >= 3\n),\n-- 第二步：筛选片段，检查停车前5秒内是否有速度<0.1\nstops_with_prev_check AS (\n  SELECT \n    ss.stop_start_ts,\n    ss.stop_end_ts,\n    ss.min_distance_to_stopline,\n    ss.start_cumulative_distance,\n    -- 检查停车前5秒内是否有速度<0.1\n    (SELECT COUNT(*)\n     FROM ego e2\n     WHERE e2.ts < ss.stop_start_ts\n       AND e2.ts >= ss.stop_start_ts - 5\n       AND ABS(e2.speed) < 0.1\n    ) AS slow_in_prev_5s_count\n  FROM\
      \ stop_segments ss\n),\n-- 第三步：筛选片段，只在停车开始时刻检查前方是否有障碍物\nfiltered_stops AS (\n  SELECT \n    sw.stop_start_ts,\n    sw.stop_end_ts,\n    sw.min_distance_to_stopline,\n    sw.start_cumulative_distance\n  FROM stops_with_prev_check sw\n  -- 停车前5秒内没有速度<0.1\n  WHERE sw.slow_in_prev_5s_count = 0\n    -- 只在停车开始时刻检查前方是否有障碍物\n    AND NOT EXISTS (\n      SELECT 1 \n      FROM dynamic_obj d\n      WHERE ABS(d.ts - sw.stop_start_ts) < 5  -- 精确匹配停车开始时刻\n        AND d.x > 0\n        AND d.x < 15\n        AND ABS(d.y) < 1.5\n    )\n),\n-- 第四步：为每个停车事件计算开始和结束时间\nstop_events_with_times AS (\n  SELECT \n    -- 新的开始时间：从停车开始时间往前60米\n    (SELECT MAX(ts) \n     FROM ego \n     WHERE ts <= fs.stop_start_ts\n       AND cumulative_distance <= fs.start_cumulative_distance - 60\n    ) AS start_ts,\n    -- 停车开始时间\n    fs.stop_start_ts AS stop_start_ts,\n    -- 结束时间：停车开始后3秒\n    fs.stop_start_ts + 3 AS end_ts,\n    -- 片段持续时间\n    (fs.stop_start_ts + 3) - (SELECT MAX(ts) \n                              FROM ego\
      \ \n                              WHERE ts <= fs.stop_start_ts\n                                AND cumulative_distance <= fs.start_cumulative_distance - 60\n                             ) AS duration_seconds,\n    fs.min_distance_to_stopline\n  FROM filtered_stops fs\n  WHERE (SELECT MAX(ts) \n         FROM ego \n         WHERE ts <= fs.stop_start_ts\n           AND cumulative_distance <= fs.start_cumulative_distance - 60) IS NOT NULL\n    -- 整个片段时长小于20秒\n    AND (fs.stop_start_ts + 3) - (SELECT MAX(ts) \n                                 FROM ego \n                                 WHERE ts <= fs.stop_start_ts\n                                   AND cumulative_distance <= fs.start_cumulative_distance - 60\n                                 ) <= 20\n    -- 确保结束时间不早于开始时间\n    AND (fs.stop_start_ts + 3) - (SELECT MAX(ts) \n                                 FROM ego \n                                 WHERE ts <= fs.stop_start_ts\n                                   AND cumulative_distance\
      \ <= fs.start_cumulative_distance - 60\n                                 ) >= 0\n    -- 新增逻辑：检查停车开始的3秒内，有交通灯的帧数 > 2\n    AND (\n      SELECT COUNT(*)\n      FROM ego e3\n      WHERE e3.ts >= fs.stop_start_ts -3\n        AND e3.ts <= fs.stop_start_ts + 3\n        AND e3.latest_traffic_light_status IN ('红','黄','绿')\n    ) > 2\n),\n-- 第五步：为每个停车事件统计黄灯信息\nyellow_light_analysis AS (\n  SELECT \n    se.start_ts,\n    se.stop_start_ts,\n    se.end_ts,\n    se.duration_seconds,\n    se.min_distance_to_stopline,\n    -- 统计整个时间段内的黄灯次数\n    COUNT(CASE WHEN e.latest_traffic_light_status = '黄' THEN 1 END) AS yellow_count,\n    -- 第一次出现黄灯的时间戳\n    MIN(CASE WHEN e.latest_traffic_light_status = '黄' THEN e.ts END) AS first_yellow_ts,\n    -- 最后一次出现黄灯的时间戳\n    MAX(CASE WHEN e.latest_traffic_light_status = '黄' THEN e.ts END) AS last_yellow_ts\n  FROM stop_events_with_times se\n  LEFT JOIN ego e ON e.ts >= se.start_ts \n    AND e.ts <= se.end_ts\n  GROUP BY se.start_ts, se.stop_start_ts, se.end_ts, se.duration_seconds,\
      \ se.min_distance_to_stopline\n)\n-- 最终结果：包含黄灯统计和停车事件\nSELECT \n  start_ts,\n  stop_start_ts,\n  end_ts,\n  duration_seconds,\n  min_distance_to_stopline,\n  yellow_count,\n  first_yellow_ts,\n  last_yellow_ts\nFROM yellow_light_analysis\nORDER BY start_ts;"
