name: truck_cutin_ego
version: '1.0'
description: 卡车切入：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: truck_safe_cutin_ego
    raw_sql: "WITH \n-- 配置参数\nconfig AS (\n    SELECT \n        4.5  AS ego_length,\n        1.8  AS ego_width,\n        3.0  AS nearby_lat_gap_max,\n        20.0 AS min_speed,\n        3    AS min_duration\n),\n\n-- Ego 1Hz LEAD (独立计算，避免同一 ts 多 truck 导致 LEAD 跳行)\nego_lead AS (\n    SELECT ts, speed AS ego_speed, steering_angle, acc_magnitude,\n        LEAD(ts) OVER (ORDER BY ts) AS next_ts,\n        LEAD(speed) OVER (ORDER BY ts) AS next_ego_speed,\n        LEAD(steering_angle) OVER (ORDER BY ts) AS next_steering,\n        LEAD(acc_magnitude) OVER (ORDER BY ts) AS next_acc_magnitude\n    FROM ego\n),\n\n-- 1Hz base + LEAD for 5Hz interp\nbase_1hz AS (\n    SELECT \n        d.ts, d.obj_id, d.x, d.y, d.l, d.w, d.type, d.relative_velocity_x,\n        el.ego_speed, el.steering_angle, el.acc_magnitude,\n        LEAD(d.ts) OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_ts,\n        LEAD(d.x)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_x,\n        LEAD(d.y)  OVER (PARTITION BY d.obj_id\
      \ ORDER BY d.ts) AS next_y,\n        LEAD(d.l)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_l,\n        LEAD(d.w)  OVER (PARTITION BY d.obj_id ORDER BY d.ts) AS next_w,\n        el.next_ego_speed,\n        el.next_steering,\n        el.next_acc_magnitude\n    FROM dynamic_obj d\n    INNER JOIN ego_lead el ON el.ts = d.ts\n    CROSS JOIN config cfg\n    WHERE d.type = 'truck'\n),\n\n-- 5Hz linear interp via UNION ALL\ninterp AS (\n    SELECT ts + 0.0 AS t, obj_id, x, y, l, w, type, relative_velocity_x, ego_speed, steering_angle, acc_magnitude FROM base_1hz\n    UNION ALL\n    SELECT ts + 0.2, obj_id,\n        x + (next_x - x) * 0.2 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.2 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.2 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.2 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        ego_speed + (next_ego_speed - ego_speed) * 0.2 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering\
      \ - steering_angle) * 0.2 / NULLIF(next_ts - ts, 0),\n        acc_magnitude + (next_acc_magnitude - acc_magnitude) * 0.2 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.4, obj_id,\n        x + (next_x - x) * 0.4 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.4 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.4 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.4 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        ego_speed + (next_ego_speed - ego_speed) * 0.4 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.4 / NULLIF(next_ts - ts, 0),\n        acc_magnitude + (next_acc_magnitude - acc_magnitude) * 0.4 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.6, obj_id,\n        x + (next_x - x) * 0.6 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.6 / NULLIF(next_ts - ts, 0),\n        l\
      \ + (next_l - l) * 0.6 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.6 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        ego_speed + (next_ego_speed - ego_speed) * 0.6 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.6 / NULLIF(next_ts - ts, 0),\n        acc_magnitude + (next_acc_magnitude - acc_magnitude) * 0.6 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n    UNION ALL\n    SELECT ts + 0.8, obj_id,\n        x + (next_x - x) * 0.8 / NULLIF(next_ts - ts, 0),\n        y + (next_y - y) * 0.8 / NULLIF(next_ts - ts, 0),\n        l + (next_l - l) * 0.8 / NULLIF(next_ts - ts, 0),\n        w + (next_w - w) * 0.8 / NULLIF(next_ts - ts, 0),\n        type, relative_velocity_x,\n        ego_speed + (next_ego_speed - ego_speed) * 0.8 / NULLIF(next_ts - ts, 0),\n        steering_angle + (next_steering - steering_angle) * 0.8 / NULLIF(next_ts - ts, 0),\n        acc_magnitude + (next_acc_magnitude\
      \ - acc_magnitude) * 0.8 / NULLIF(next_ts - ts, 0)\n    FROM base_1hz WHERE next_ts IS NOT NULL\n),\n\n-- 5Hz metrics + lane position + side-by-side flag + truck_speed\nvehicle_frames AS (\n    SELECT \n        t, obj_id, x, y, l, w, type, relative_velocity_x, ego_speed, steering_angle, acc_magnitude,\n        ROUND(ABS(y) - (cfg.ego_width + COALESCE(w,0))/2, 2) AS lateral_gap,\n        ROUND(x - COALESCE(l,0)/2 - cfg.ego_length/2, 2) AS front_to_rear_dist,\n        ROUND(ego_speed + relative_velocity_x, 2) AS truck_speed,\n        CASE \n            WHEN ABS(y) < 1.0 THEN 'ego_lane'\n            WHEN ABS(y) >= 1.0 AND ABS(y) < 5.0 THEN 'adjacent_lane'\n            ELSE 'far'\n        END AS lane_pos,\n        CASE WHEN x >= 0 THEN 1 ELSE 0 END AS is_side_by_side,\n        CASE \n            WHEN relative_velocity_x < 0 AND x > (cfg.ego_length + COALESCE(l,0))/2 \n            THEN ROUND((x - (cfg.ego_length + COALESCE(l,0))/2) / (-relative_velocity_x), 2)\n            ELSE NULL \n\
      \        END AS ttc\n    FROM interp\n    CROSS JOIN config cfg\n    WHERE ABS(y) - (cfg.ego_width + COALESCE(w,0))/2 < cfg.nearby_lat_gap_max\n      AND x IS NOT NULL AND y IS NOT NULL AND type = 'truck'\n),\n\n-- Gaps & Islands by obj_id + lane_pos (保留 transition 段避免断裂，但 transition 通常不满足 COUNT>=2)\nframed_with_grp AS (\n    SELECT *,\n        CAST(t * 5 AS INTEGER) - ROW_NUMBER() OVER (PARTITION BY obj_id, lane_pos ORDER BY t) AS grp\n    FROM vehicle_frames\n    WHERE lane_pos IN ('ego_lane', 'adjacent_lane')\n),\n\n-- Segment summary per lane\nsegments AS (\n    SELECT \n        obj_id, type, lane_pos, grp,\n        MIN(t) AS seg_start_t, MAX(t) AS seg_end_t,\n        MAX(t) - MIN(t) AS seg_duration,\n        COUNT(*) AS frame_count,\n        MIN(x) AS min_x, MAX(x) AS max_x,\n        MIN(ABS(y)) AS min_abs_y, MAX(ABS(y)) AS max_abs_y,\n        MIN(lateral_gap) AS min_lateral_gap,\n        MAX(lateral_gap) AS max_lateral_gap,\n        ROUND(AVG(relative_velocity_x), 2) AS avg_rel_vel_x,\n\
      \        ROUND(MAX(ego_speed), 2) AS max_ego_speed,\n        ROUND(MIN(ego_speed), 2) AS min_ego_speed,\n        ROUND(MAX(ABS(steering_angle)), 4) AS max_steering\n    FROM framed_with_grp\n    GROUP BY obj_id, type, lane_pos, grp\n    HAVING COUNT(*) >= 2\n),\n\n-- Cutin sequence: adjacent_lane -> ego_lane, 时间衔接在2秒内\ncutin_seq AS (\n    SELECT s1.obj_id, s1.type,\n        s1.seg_start_t AS adj_start, s1.seg_end_t AS adj_end,\n        s1.min_x AS adj_min_x, s1.max_x AS adj_max_x,\n        s1.min_abs_y AS adj_min_abs_y, s1.max_abs_y AS adj_max_abs_y,\n        s1.min_lateral_gap AS adj_min_lat_gap,\n        s1.avg_rel_vel_x AS adj_rel_vel_x,\n        s2.seg_start_t AS ego_start, s2.seg_end_t AS ego_end,\n        s2.min_x AS ego_min_x, s2.max_x AS ego_max_x,\n        s2.min_abs_y AS ego_min_abs_y, s2.avg_rel_vel_x AS ego_rel_vel_x\n    FROM segments s1\n    JOIN segments s2 ON s1.obj_id = s2.obj_id\n        AND s1.lane_pos = 'adjacent_lane'\n        AND s2.lane_pos = 'ego_lane'\n   \
      \     AND s2.seg_start_t BETWEEN s1.seg_end_t AND s1.seg_end_t + 2\n    WHERE s1.max_abs_y > 1.5\n      AND s1.avg_rel_vel_x > -3.0\n      AND s1.min_x < 0        -- 大车在adjacent_lane时曾在ego后方(x<0)\n      AND s1.max_x > 0        -- 大车在adjacent_lane时曾超越到ego前方(x>0)\n      AND s2.min_x > -1.0     -- 切入ego_lane后位于ego前方或并排\n      AND s1.min_ego_speed >= 5  -- 自车在adjacent_lane期间速度不低于5km/h\n      AND s2.min_ego_speed >= 5  -- 自车在ego_lane期间速度不低于5km/h\n      AND s1.seg_duration <= 25  -- 相邻车道段持续时间不超过25秒（允许从近处超越后切入）\n      AND s1.max_steering < 10.0 -- 自车在adjacent_lane期间未大幅转向（steering单位为度，排除ego变道）\n      AND s2.max_steering < 10.0 -- 自车在ego_lane期间未大幅转向\n      AND s1.min_x > -15         -- 大车从ego后方近处接近（排除从远处慢悠悠接近的场景）\n),\n\n-- 超越时刻: first frame with x >= 0 (大车超越ego车头) in [adj_start, ego_start]\ncutin_overtake AS (\n    SELECT \n        cs.obj_id, cs.adj_start, cs.ego_end,\n        MIN(CASE WHEN vf.is_side_by_side = 1 THEN vf.t END) AS ot_ts\n    FROM cutin_seq cs\n    INNER JOIN vehicle_frames\
      \ vf ON cs.obj_id = vf.obj_id \n        AND vf.t >= cs.adj_start AND vf.t <= cs.ego_start\n    GROUP BY cs.obj_id, cs.adj_start, cs.ego_end\n),\n\n-- Stable in ego_lane: last moment with |y| < 1.0 (在ego_lane段内保持)\nego_stable AS (\n    SELECT \n        cs.obj_id, cs.adj_start, cs.ego_end,\n        MAX(CASE WHEN vf.t BETWEEN cs.ego_start AND cs.ego_end AND ABS(vf.y) < 1.0 THEN vf.t END) AS stable_ts\n    FROM cutin_seq cs\n    INNER JOIN vehicle_frames vf ON cs.obj_id = vf.obj_id\n        AND vf.t >= cs.ego_start AND vf.t <= cs.ego_end\n    GROUP BY cs.obj_id, cs.adj_start, cs.ego_end\n),\n\n-- Timeline per cutin: start = ot_ts - 1.0s, end = stable_ts + 1.5s\ncutin_timeline AS (\n    SELECT \n        cot.obj_id, cot.adj_start, cot.ego_end,\n        cot.ot_ts - 1.0 AS start_ts,\n        es.stable_ts + 1.5 AS end_ts\n    FROM cutin_overtake cot\n    INNER JOIN ego_stable es ON cot.obj_id = es.obj_id \n        AND cot.adj_start = es.adj_start AND cot.ego_end = es.ego_end\n    WHERE cot.ot_ts\
      \ IS NOT NULL\n      AND es.stable_ts IS NOT NULL\n),\n\n-- Safety check: lateral_gap at overtake moment > 0.5 (超越时 lateral gap 足够)\npre_ot_safe AS (\n    SELECT \n        cot.obj_id, cot.adj_start, cot.ego_end,\n        vf.lateral_gap AS ot_lat_gap\n    FROM cutin_overtake cot\n    INNER JOIN vehicle_frames vf ON cot.obj_id = vf.obj_id AND vf.t = cot.ot_ts\n    WHERE cot.ot_ts IS NOT NULL\n),\n\n-- Pass moment: 大车车尾超过自车车头的时刻 (front_to_rear_dist > 0)\npass_moment AS (\n    SELECT \n        cs.obj_id, cs.adj_start, cs.ego_end,\n        MIN(CASE WHEN vf.front_to_rear_dist > 0 THEN vf.t END) AS pass_ts\n    FROM cutin_seq cs\n    INNER JOIN vehicle_frames vf ON cs.obj_id = vf.obj_id \n        AND vf.t >= cs.adj_start AND vf.t <= cs.ego_end\n    GROUP BY cs.obj_id, cs.adj_start, cs.ego_end\n),\n\n-- Cutin timing check: 大车车尾超过自车车头后 15s 内 lateral_gap < 0 (开始切入)\ncutin_timing_check AS (\n    SELECT \n        pm.obj_id, pm.adj_start, pm.ego_end,\n        MAX(CASE WHEN vf.lateral_gap < 0 AND\
      \ vf.t BETWEEN pm.pass_ts AND pm.pass_ts + 15 THEN 1 ELSE 0 END) AS has_cutin_within_15s\n    FROM pass_moment pm\n    INNER JOIN vehicle_frames vf ON pm.obj_id = vf.obj_id \n        AND vf.t >= pm.adj_start AND vf.t <= pm.ego_end\n    WHERE pm.pass_ts IS NOT NULL\n    GROUP BY pm.obj_id, pm.adj_start, pm.ego_end\n),\n\n-- Acceleration check: truck切入ego_lane后(lateral_gap<0,x>0)，若ttc<1.5s，ego不应加速(acc_magnitude<=0.5)\ncutin_accel_check AS (\n    SELECT \n        cs.obj_id, cs.adj_start, cs.ego_end,\n        MAX(CASE \n            WHEN f.lateral_gap < 0 AND f.x > 0 AND f.ttc < 1.5 AND f.acc_magnitude > 0.5 \n            THEN 1 ELSE 0 \n        END) AS has_hard_accel\n    FROM cutin_seq cs\n    INNER JOIN vehicle_frames f ON cs.obj_id = f.obj_id\n        AND f.t >= cs.ego_start AND f.t <= cs.ego_end\n    GROUP BY cs.obj_id, cs.adj_start, cs.ego_end\n),\n\n-- Ego speed analysis\nego_speed_analysis AS (\n    SELECT \n        cs.obj_id, cs.adj_start, cs.ego_end,\n        (SELECT MAX(e.speed)\
      \ FROM ego e WHERE e.ts BETWEEN cs.adj_start - 3 AND cs.adj_start) AS pre_max_speed,\n        (SELECT MIN(e.speed) FROM ego e WHERE e.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_min_speed,\n        (SELECT MAX(e.speed) FROM ego e WHERE e.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_max_speed,\n        (SELECT COUNT(*) FROM ego e WHERE e.ts BETWEEN cs.ego_start AND cs.ego_end + 5) AS post_ego_frames\n    FROM cutin_seq cs\n)\n\n-- Output\nSELECT \n    'truck_safe_cutin_ego' AS tag_name,\n    CAST(ct.start_ts AS INTEGER) AS start_ts,\n    CAST(ct.end_ts AS INTEGER) AS end_ts,\n    CAST(ct.end_ts AS INTEGER) - CAST(ct.start_ts AS INTEGER) AS duration,\n    cs.obj_id,\n    cs.type,\n    pre.ot_lat_gap,\n    ROUND(sa.pre_max_speed, 1) AS pre_max_speed,\n    ROUND(sa.post_min_speed, 1) AS post_min_speed,\n    ROUND(sa.pre_max_speed - sa.post_min_speed, 1) AS speed_drop,\n    cs.adj_start, cs.adj_end, cs.ego_start, cs.ego_end,\n    CASE \n        WHEN sa.post_min_speed < 3\
      \ THEN 'cutin_then_stop'\n        WHEN sa.pre_max_speed - sa.post_min_speed >= 8 THEN 'cutin_hard_yield'\n        WHEN sa.pre_max_speed - sa.post_min_speed >= 4 THEN 'cutin_soft_yield'\n        ELSE 'cutin_no_yield'\n    END AS sub_scenario,\n    json_object(\n        'obj_id', cs.obj_id,\n        'obj_type', cs.type,\n        'adj_min_x', ROUND(cs.adj_min_x, 1),\n        'ego_min_x', ROUND(cs.ego_min_x, 1),\n        'pre_max_speed', ROUND(sa.pre_max_speed, 1),\n        'post_min_speed', ROUND(sa.post_min_speed, 1),\n        'speed_drop', ROUND(sa.pre_max_speed - sa.post_min_speed, 1),\n        'sub_scenario', CASE \n            WHEN sa.post_min_speed < 3 THEN 'cutin_then_stop'\n            WHEN sa.pre_max_speed - sa.post_min_speed >= 8 THEN 'cutin_hard_yield'\n            WHEN sa.pre_max_speed - sa.post_min_speed >= 4 THEN 'cutin_soft_yield'\n            ELSE 'cutin_no_yield'\n        END\n    ) AS param\nFROM cutin_seq cs\nINNER JOIN cutin_timeline ct ON cs.obj_id = ct.obj_id \n\
      \    AND cs.adj_start = ct.adj_start AND cs.ego_end = ct.ego_end\nINNER JOIN pre_ot_safe pre ON cs.obj_id = pre.obj_id \n    AND cs.adj_start = pre.adj_start AND cs.ego_end = pre.ego_end\nINNER JOIN cutin_accel_check ca ON cs.obj_id = ca.obj_id \n    AND cs.adj_start = ca.adj_start AND cs.ego_end = ca.ego_end\nINNER JOIN cutin_timing_check ctc ON cs.obj_id = ctc.obj_id \n    AND cs.adj_start = ctc.adj_start AND cs.ego_end = ctc.ego_end\nINNER JOIN ego_speed_analysis sa ON cs.obj_id = sa.obj_id \n    AND cs.adj_start = sa.adj_start AND cs.ego_end = sa.ego_end\nWHERE ct.end_ts > ct.start_ts\n  AND pre.ot_lat_gap > 0.5\n  AND ca.has_hard_accel = 0\n  AND ctc.has_cutin_within_15s = 1\n  AND sa.post_ego_frames >= 4\nORDER BY start_ts;"
