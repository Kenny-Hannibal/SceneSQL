name: intersection_straight_simple
version: '1.0'
description: 路口直行简单：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: intersection_straight
    raw_sql: "SELECT\n    'intersection_straight' AS tag_name,\n    start_ts,\n    end_ts,\n    end_ts - start_ts AS duration,\n    param\nFROM range_tag \nWHERE tag_name = 'Intersection'\n  AND end_ts - start_ts > 4  \n  AND json_extract(param, '$.sub_tag') ='IsIntersection'   --导航直行\n  AND (\n      SELECT COUNT(*)\n      FROM ego e\n      WHERE e.ts BETWEEN start_ts AND end_ts\n        AND ABS(e.steering_angle) > 1\n  ) <= 1;"
