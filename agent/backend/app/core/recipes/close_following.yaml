name: close_following
version: '1.0'
description: 跟车太近：产线SQL直通模式(raw_sql)
blocks: []
variants:
  default:
    tag_name: close_following
    raw_sql: "-- ==============================================================================\n-- Scene: Close Following Scenario (V4.1)\n-- Description: Detects close following scenarios where ego follows a lead vehicle\n--              at close distance. Sub-scenario: ego actively brakes to increase\n--              safety gap after close following.\n--              Uses 0.2s DR trajectory deceleration for precise braking detection.\n-- Version: v4.1\n-- ==============================================================================\n\nWITH \n-- Step 0: Calculate ego deceleration per frame (prefer 0.2s DR trajectory, fallback to 1s diff)\nego_accel_raw AS (\n    SELECT e1.ts,\n           COALESCE(\n               CASE \n                   WHEN json_extract(e1.ego_dr_trajectory, '$.exists[0]') = 1\n                        AND json_extract(e1.ego_dr_trajectory, '$.exists[4]') = 1\n                   THEN (json_extract(e1.ego_dr_trajectory, '$.speed[4]') - \n                         json_extract(e1.ego_dr_trajectory,\
      \ '$.speed[0]')) / 0.8\n               END,\n               e1.speed - e0.speed\n           ) AS ego_accel\n    FROM ego e1\n    INNER JOIN ego e0 ON e0.ts = e1.ts - 1\n),\n-- Step 1: Find all frames satisfying close following conditions (by obj_id)\nclose_frames AS (\n    SELECT e.ts, d.obj_id, d.x, d.y, e.speed\n    FROM ego e\n    JOIN dynamic_obj d ON e.ts = d.ts\n    WHERE d.type IN ('car', 'truck', 'bus')\n      AND d.x > 2 AND d.x < 25\n      AND ABS(d.y) < 2.5\n      AND e.speed > 10\n),\n-- Step 2: gaps-and-islands by obj_id to find continuous following segments\nnumbered AS (\n    SELECT ts, obj_id, x, y, speed,\n           ts - ROW_NUMBER() OVER (PARTITION BY obj_id ORDER BY ts) AS grp\n    FROM close_frames\n),\n-- Step 3: Form following segments, filter short segments (< 4s)\nsegments AS (\n    SELECT obj_id, MIN(ts) AS start_ts, MAX(ts) AS end_ts, COUNT(*) AS duration\n    FROM numbered\n    GROUP BY obj_id, grp\n    HAVING COUNT(*) BETWEEN 4 AND 45\n),\n-- Step 4: Calculate\
      \ segment statistics and post-segment 5s changes\nsegment_stats AS (\n    SELECT \n        s.obj_id, s.start_ts, s.end_ts, s.duration,\n        (SELECT AVG(e1.speed) FROM ego e1 WHERE e1.ts BETWEEN s.start_ts AND s.end_ts) AS avg_speed,\n        (SELECT MIN(e1.speed) FROM ego e1 WHERE e1.ts BETWEEN s.start_ts AND s.end_ts) AS min_speed,\n        (SELECT MAX(e1.speed) FROM ego e1 WHERE e1.ts BETWEEN s.start_ts AND s.end_ts) AS max_speed,\n        (SELECT MIN(d1.x) \n         FROM dynamic_obj d1 \n         WHERE d1.ts BETWEEN s.start_ts AND s.end_ts\n           AND d1.obj_id = s.obj_id) AS min_dist,\n        (SELECT AVG(d1.x) \n         FROM dynamic_obj d1 \n         WHERE d1.ts BETWEEN s.start_ts AND s.end_ts\n           AND d1.obj_id = s.obj_id) AS avg_dist,\n        (SELECT MIN(d1.x) \n         FROM dynamic_obj d1 \n         WHERE d1.ts BETWEEN s.start_ts AND s.end_ts\n           AND d1.obj_id = s.obj_id) AS min_long_dist,\n        (SELECT MAX(ABS(d1.y)) - MIN(ABS(d1.y))\n       \
      \  FROM dynamic_obj d1 \n         WHERE d1.ts BETWEEN s.start_ts AND s.end_ts\n           AND d1.obj_id = s.obj_id) AS y_range,\n        (SELECT MAX(e2.speed) FROM ego e2 WHERE e2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5) AS post_max_speed,\n        (SELECT MIN(e2.speed) FROM ego e2 WHERE e2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5) AS post_min_speed,\n        (SELECT COUNT(*) FROM ego e2 WHERE e2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5) AS post_ego_frame_count,\n        (SELECT MIN(ea.ego_accel) \n         FROM ego_accel_raw ea \n         WHERE ea.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5) AS post_max_decel,\n        (SELECT AVG(ea.ego_accel) \n         FROM ego_accel_raw ea \n         WHERE ea.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5\n           AND ea.ego_accel < 0) AS post_avg_decel,\n        (SELECT MIN(d2.x) \n         FROM dynamic_obj d2 \n         WHERE d2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5\n           AND d2.obj_id = s.obj_id) AS post_min_long_dist,\n        (SELECT\
      \ AVG(d2.x) \n         FROM dynamic_obj d2 \n         WHERE d2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5\n           AND d2.obj_id = s.obj_id) AS post_avg_long_dist,\n        (SELECT COUNT(*) \n         FROM dynamic_obj d2 \n         WHERE d2.ts BETWEEN s.end_ts + 1 AND s.end_ts + 5\n           AND d2.obj_id = s.obj_id) AS post_obj_frame_count\n    FROM segments s\n),\n-- Step 5: Filter main scenario conditions (close distance + lateral stability)\nfiltered_segments AS (\n    SELECT *\n    FROM segment_stats\n    WHERE min_dist < 20\n      AND min_long_dist < 25\n      AND y_range < 2.5\n),\n-- Step 6: Check for LongitudinalDeceleration tags near segment end (auxiliary sub-scenario)\ndecel_info AS (\n    SELECT \n        fs.obj_id,\n        fs.start_ts,\n        COUNT(DISTINCT r.start_ts) AS decel_tag_count,\n        MAX(CAST(json_extract(r.param, '$.duration') AS FLOAT)) AS max_decel_duration\n    FROM filtered_segments fs\n    LEFT JOIN range_tag r \n        ON r.tag_name = 'LongitudinalDeceleration'\n\
      \        AND r.start_ts BETWEEN fs.end_ts - 2 AND fs.end_ts + 5\n    GROUP BY fs.obj_id, fs.start_ts\n)\n-- Final output: main scenario + sub-scenario markers\nSELECT \n    'close_following' AS tag_name,\n    fs.start_ts,\n    fs.end_ts,\n    fs.duration,\n    fs.obj_id,\n    ROUND(fs.avg_speed, 1) AS avg_speed,\n    ROUND(fs.min_speed, 1) AS min_speed,\n    ROUND(fs.max_speed, 1) AS max_speed,\n    ROUND(fs.min_dist, 1) AS min_dist,\n    ROUND(fs.avg_dist, 1) AS avg_dist,\n    ROUND(fs.min_long_dist, 1) AS min_long_dist,\n    ROUND(fs.y_range, 2) AS y_range,\n    ROUND(COALESCE(fs.post_max_speed, 0), 1) AS post_max_speed,\n    ROUND(COALESCE(fs.post_min_speed, 0), 1) AS post_min_speed,\n    ROUND(COALESCE(fs.post_max_speed - fs.post_min_speed, 0), 1) AS speed_drop,\n    ROUND(COALESCE(fs.post_max_decel, 0), 2) AS post_max_decel,\n    ROUND(COALESCE(fs.post_avg_decel, 0), 2) AS post_avg_decel,\n    ROUND(fs.post_min_long_dist, 1) AS post_min_long_dist,\n    ROUND(fs.post_avg_long_dist,\
      \ 1) AS post_avg_long_dist,\n    fs.post_ego_frame_count,\n    fs.post_obj_frame_count,\n    COALESCE(di.decel_tag_count, 0) AS decel_tag_count,\n    ROUND(COALESCE(di.max_decel_duration, 0), 1) AS max_decel_duration,\n    CASE \n        WHEN fs.post_ego_frame_count < 3 THEN 0\n        WHEN fs.post_min_speed < 3 THEN 0\n        WHEN COALESCE(fs.post_max_decel, 0) < -0.8\n             AND COALESCE(fs.post_max_speed, 0) - COALESCE(fs.post_min_speed, 0) >= 3\n             AND fs.post_min_long_dist IS NOT NULL\n             AND fs.post_min_long_dist > 0\n             AND fs.post_avg_long_dist > fs.avg_dist THEN 1\n        ELSE 0\n    END AS is_brake_to_increase_gap,\n    CASE \n        WHEN fs.post_ego_frame_count < 3 THEN 'close_following_only'\n        WHEN fs.post_min_speed < 3 THEN 'close_following_then_stop'\n        WHEN COALESCE(fs.post_max_decel, 0) < -0.8\n             AND COALESCE(fs.post_max_speed, 0) - COALESCE(fs.post_min_speed, 0) >= 3\n             AND fs.post_min_long_dist\
      \ IS NOT NULL\n             AND fs.post_min_long_dist > 0\n             AND fs.post_avg_long_dist > fs.avg_dist THEN 'close_following_then_brake'\n        ELSE 'close_following_only'\n    END AS sub_scenario,\n    json_object(\n        'obj_id', fs.obj_id,\n        'min_dist', ROUND(fs.min_dist, 1),\n        'avg_dist', ROUND(fs.avg_dist, 1),\n        'avg_speed', ROUND(fs.avg_speed, 1),\n        'sub_scenario', CASE \n            WHEN fs.post_ego_frame_count < 3 THEN 'close_following_only'\n            WHEN fs.post_min_speed < 3 THEN 'close_following_then_stop'\n            WHEN COALESCE(fs.post_max_decel, 0) < -0.8\n                 AND COALESCE(fs.post_max_speed, 0) - COALESCE(fs.post_min_speed, 0) >= 3\n                 AND fs.post_min_long_dist IS NOT NULL\n                 AND fs.post_min_long_dist > 0\n                 AND fs.post_avg_long_dist > fs.avg_dist THEN 'close_following_then_brake'\n            ELSE 'close_following_only'\n        END,\n        'is_brake_to_increase_gap',\
      \ CASE \n            WHEN fs.post_ego_frame_count < 3 THEN 0\n            WHEN fs.post_min_speed < 3 THEN 0\n            WHEN COALESCE(fs.post_max_decel, 0) < -0.8\n                 AND COALESCE(fs.post_max_speed, 0) - COALESCE(fs.post_min_speed, 0) >= 3\n                 AND fs.post_min_long_dist IS NOT NULL\n                 AND fs.post_min_long_dist > 0\n                 AND fs.post_avg_long_dist > fs.avg_dist THEN 1\n            ELSE 0\n        END,\n        'post_max_decel', ROUND(COALESCE(fs.post_max_decel, 0), 2),\n        'speed_drop', ROUND(COALESCE(fs.post_max_speed - fs.post_min_speed, 0), 1)\n    ) AS param\nFROM filtered_segments fs\nLEFT JOIN decel_info di ON fs.obj_id = di.obj_id AND fs.start_ts = di.start_ts\nORDER BY fs.start_ts;"
