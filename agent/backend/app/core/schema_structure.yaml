version: 2.0.0
note: '纯 SQLite 结构文件，用于 LLM SQL 生成阶段注入 prompt。

  不含任何自然语言解释，只包含表名、列名、数据类型、主键、枚举值。

  字段/标签的详细定义请查阅 schema_dictionary.yaml。


  本文件由 derive_schemas.py 从 schema_master_raw.yaml 自动派生，请勿手动编辑。'
database_schema:
  tables:
  - name: range_tag
    type: horizontal_event
    description: 时间区间标签表——每个标签标记一个时间区间[start_ts, end_ts]内的场景/行为
    columns:
    - name: start_ts
      type: BIGINT
      nullable: true
      pk: true
    - name: end_ts
      type: BIGINT
      nullable: true
      pk: true
    - name: tag_name
      type: TEXT
      nullable: true
      pk: true
      enum:
      - AVOIDANCE_INLANE
      - AVOIDANCE_INSAMELANE
      - AVOIDANCE_LANEYIELDBICYCLISTORTRICYCLIST
      - AVOIDANCE_LANEYIELDCARORTRUCK
      - AVOIDANCE_LANEYIELDCONE
      - AVOIDANCE_LANEYIELDCRUB
      - AVOIDANCE_LANEYIELDTRUCKINADJACENTLANE
      - AVOIDANCE_LANEYIELDVRU
      - AVOIDANCE_MULTIOBSTACLEAROUNDEGO
      - AbnormalLaneChange
      - AbnormalRightLaneChangeToRightestStop
      - AbnormalRightLaneChangeToRightestStopV1
      - ActiveWiperState
      - AvoidanceBorrowLane
      - Avoidance_InLane
      - Avoidance_InLane_VLM
      - BinCounter
      - CRUISE_CARORTRUCKCROSS
      - CRUISE_CARORTRUCKCUTIN
      - CRUISE_CARORTRUCKCUTOUT
      - CRUISE_CLOSECUTIN
      - CRUISE_CONGESTION
      - CRUISE_CREEP
      - CRUISE_CURVE
      - CRUISE_CUTIN
      - CRUISE_CUTOUT
      - CRUISE_DISTANTFOLLOW
      - CRUISE_FOLLOW
      - CRUISE_FREESPACEAVOIDANCE
      - CRUISE_FREESPACEYIELD
      - CRUISE_LEADCUTOUTLEADINGSTOPPED
      - CRUISE_RAMP
      - CRUISE_SLOWFOLLOW
      - CRUISE_SLOWMOVE
      - CRUISE_STRAIGHT
      - CRUISE_VRUCROSS
      - CRUISE_VRUCUTIN
      - CRUISE_VRUCUTOUT
      - CloseFollow
      - CongestedFollow
      - CrawlingFollow
      - CrossConflict
      - CrossStopLineOnYellowLight
      - CrossVRU
      - CrossVRUV1
      - CrossVehicle
      - Cutin
      - GreenLightNotProceeding
      - HighAccPedal
      - HighSpeed
      - HighSteeringWheelTorque
      - INTERSECTION_LEFTTURN
      - INTERSECTION_RIGHTTURN
      - INTERSECTION_ROUNDABOUT
      - INTERSECTION_ROUNDABOUTUNSIGNAL
      - INTERSECTION_STRAIGHT
      - INTERSECTION_UTURNLANE
      - InteractivePedestrian
      - InteractiveVRU
      - InteractiveVehicle
      - Intersection
      - Jerk
      - LANECHANGE_ABANDON
      - LANECHANGE_AVOIDANCE
      - LANECHANGE_DIVERGELANECHANGERIGHTTURN
      - LANECHANGE_FREEWAY
      - LANECHANGE_MERGELANECHANGEDROP
      - LANECHANGE_MERGELANECHANGEMAINROAD
      - LANECHANGE_MERGELANECHANGEZIPPER
      - LANECHANGE_NAVIGATION
      - LANECHANGE_NAVLANECHANGECONGESTION
      - LANECHANGE_NAVLANECHANGERAMP
      - LANECHANGE_OVERTAKE
      - LANECHANGE_OVERTAKELEFTBICYCLISTORTRICYCLIST
      - LANECHANGE_OVERTAKELEFTCARORTRUCK
      - LANECHANGE_OVERTAKERIGHTBICYCLISTORTRICYCLIST
      - LANECHANGE_OVERTAKERIGHTCARORTRUCK
      - LaneChange
      - LaneKeep
      - LongitudinalAcceleration
      - LongitudinalDeceleration
      - LowSpeed
      - LowSpeedOvertake
      - LowTTC
      - LowerSpeed
      - MediumLowSpeed
      - MediumSpeed
      - NavLaneChangeLate
      - NoSpeedIncrease
      - NotCenter
      - ObstacleAvoidance
      - ObstacleCollision
      - ObstacleNearMiss
      - OffRamp
      - OnRamp
      - OnRightestLane
      - OppositeLaneDriving
      - OppositeLaneDrivingV1
      - OppositeLaneDrivingV2
      - OtherRamp
      - OverSpeedLimit
      - RoadConstruction
      - Roundabout
      - RunFullYellowLight
      - RunRedLight
      - RunYellowLight
      - STOPANDGO_BRAKESTOPANTICRASHBUCKET
      - STOPANDGO_BRAKESTOPCONE
      - STOPANDGO_FIRSTCARSTARTATGREENLIGHT
      - STOPANDGO_FIRSTCARSTOPATREDLIGHT
      - STOPANDGO_STARTCONGESTION
      - STOPANDGO_STARTFOLLOWOBSTACLE
      - STOPANDGO_STARTNONFOLLOWOBSTACLE
      - STOPANDGO_STARTRAMP
      - STOPANDGO_STOP
      - STOPANDGO_STOPBEHINDOBSTACLE
      - Slope
      - SlowFrontLaneChange
      - SolidLaneChange
      - SpeedIncreaseStats
      - Static
      - SteeringSmallSwing
      - SteeringWheelSlam
      - StraightDriving
      - ToRoadsideStop
      - TrafficIntersection
      - TrafficLightAbnormal
      - Turning
      - VRUCrossConflict
      - WrongWay_Deviation
      - WrongwayNavi
      - YieldToPedestrian
      - accelerating
      - creeping
      - cruising
      - decelerating
      - hard_braking
      - invalid_navi_guide_line_infos_empty
      - invalid_navi_not_in_sd
      - invalid_topology_ego_static_map_link_id_invalid
      - invalid_topology_ego_static_map_link_id_not_match
      - invalid_topology_no_map_schema
      - invalid_topology_other_no_match
      - navi_enter
      - navi_exit
      - navi_keep
      - navi_other
      - navi_turn_left
      - navi_turn_right
      - navi_u_turn
      - over_rain_level
      - reversing
      - route_deviation_curb
      - route_deviation_guide_line
      - route_deviation_sd_newpath_need_action
      - route_deviation_sd_newpath_noneed_action
      - route_deviation_sd_yaw
      - stationary
      - steering_left_120_185
      - steering_left_15_60
      - steering_left_60_120
      - steering_left_above_185
      - steering_right_120_185
      - steering_right_15_60
      - steering_right_60_120
      - steering_right_above_185
      - steering_slightly
      - topology_auxiliary
      - topology_bridge
      - topology_interchange
      - topology_interchange_roundabout
      - topology_intersection
      - topology_intersection_cross_road
      - topology_intersection_multi_fork
      - topology_intersection_other
      - topology_intersection_small_cross_road
      - topology_intersection_small_t_junction
      - topology_intersection_straight_intersection
      - topology_intersection_t_junction
      - topology_intersection_y_junction
      - topology_left_turn_lane
      - topology_main
      - topology_merge
      - topology_ramp
      - topology_right_turn_lane
      - topology_roundabout
      - topology_service_area
      - topology_split
      - topology_toll_station
      - topology_tunnel
      - topology_tunnel_roundabout
      - topology_unstructured_road
    - name: param
      type: TEXT
      nullable: true
    primary_key:
    - start_ts
    - end_ts
    - tag_name
    notes:
    - range_tag是时间区间标签表，tag_name列的枚举值是所有合法标签
    - '标签来源: 车端行为标签(refDictEn) + 云端算子(op_*.py + feature_op)'
  - name: dynamic_obj
    type: vertical_timeseries
    description: 动态障碍物表——每个时间步的动态物体位置/速度/类型信息
    columns:
    - name: ts
      type: BIGINT
      nullable: true
      pk: true
    - name: obj_id
      type: TEXT
      nullable: true
      pk: true
    - name: obs_lane_id
      type: INTEGER
      nullable: true
    - name: obs_static_map_link_id
      type: INTEGER
      nullable: true
    - name: obs_hq_lane_id
      type: INTEGER
      nullable: true
    - name: obs_to_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_to_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_fl_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_fr_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_rl_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_rr_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_fl_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_fr_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_rl_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_corner_rr_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: obs_to_centerline_dist
      type: FLOAT
      nullable: true
    - name: obs_dr_trajectory
      type: TEXT
      nullable: true
    - name: ts_ms
      type: FLOAT
      nullable: true
    - name: x
      type: FLOAT
      nullable: true
    - name: y
      type: FLOAT
      nullable: true
    - name: z
      type: FLOAT
      nullable: true
    - name: l
      type: FLOAT
      nullable: true
    - name: w
      type: FLOAT
      nullable: true
    - name: h
      type: FLOAT
      nullable: true
    - name: heading
      type: FLOAT
      nullable: true
    - name: type
      type: TEXT
      nullable: true
      enum:
      - animal
      - bus
      - car
      - cyclist
      - motorcycle
      - motorcyclist
      - pedestrian
      - stroller
      - suv
      - truck
      - wheelchair
    - name: absolute_velocity_x
      type: FLOAT
      nullable: true
    - name: absolute_velocity_y
      type: FLOAT
      nullable: true
    - name: relative_velocity_x
      type: FLOAT
      nullable: true
    - name: relative_velocity_y
      type: FLOAT
      nullable: true
    - name: is_static
      type: BOOLEAN
      nullable: true
    primary_key:
    - ts
    - obj_id
  - name: static_obj
    type: vertical_timeseries
    description: 静态障碍物表——每个时间步的静态物体位置/类型信息
    columns:
    - name: ts
      type: BIGINT
      nullable: true
      pk: true
    - name: obj_id
      type: TEXT
      nullable: true
      pk: true
    - name: ts_ms
      type: FLOAT
      nullable: true
    - name: x
      type: FLOAT
      nullable: true
    - name: y
      type: FLOAT
      nullable: true
    - name: z
      type: FLOAT
      nullable: true
    - name: l
      type: FLOAT
      nullable: true
    - name: w
      type: FLOAT
      nullable: true
    - name: h
      type: FLOAT
      nullable: true
    - name: heading
      type: FLOAT
      nullable: true
    - name: type
      type: TEXT
      nullable: true
      enum:
      - traffic_warning_object
    - name: param
      type: TEXT
      nullable: true
    primary_key:
    - ts
    - obj_id
  - name: ego
    type: vertical_timeseries
    description: 自车状态表——每个时间步的自车速度/加速度/转向/信号灯等状态
    columns:
    - name: ts
      type: BIGINT
      nullable: true
      pk: true
    - name: acc_magnitude
      type: FLOAT
      nullable: true
    - name: ego_lane_id
      type: INTEGER
      nullable: true
    - name: ego_link_id
      type: INTEGER
      nullable: true
    - name: ego_static_map_link_id
      type: INTEGER
      nullable: true
    - name: ego_hq_lane_id
      type: INTEGER
      nullable: true
    - name: ego_lane_curvature
      type: FLOAT
      nullable: true
    - name: ego_to_centerline_dist
      type: FLOAT
      nullable: true
    - name: ego_to_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_to_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_fl_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_fr_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_rl_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_rr_2_left_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_fl_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_fr_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_rl_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: ego_corner_rr_2_right_boundary_dist
      type: FLOAT
      nullable: true
    - name: traffic_light_status
      type: INTEGER
      nullable: true
      enum:
      - -1
      - 1
      - 2
      - 3
      enum_descriptions:
        '-1': 无信号灯
        '1': 绿灯
        '2': 黄灯
        '3': 红灯
    - name: ego_hq_lane_ids_on_cross_section
      type: TEXT
      nullable: true
    - name: ego_lane_index_on_hq_cross_section
      type: INTEGER
      nullable: true
    - name: ego_lane_successor_count
      type: INTEGER
      nullable: true
    - name: ego_lane_predecessor_count
      type: INTEGER
      nullable: true
    - name: ego_lane_width
      type: FLOAT
      nullable: true
    - name: ego_dr_trajectory
      type: TEXT
      nullable: true
    - name: ts_ms
      type: FLOAT
      nullable: true
    - name: speed
      type: FLOAT
      nullable: true
    - name: steering_angle
      type: FLOAT
      nullable: true
    - name: latest_traffic_light_status
      type: TEXT
      nullable: true
      enum:
      - 绿
      - 黄
      - 红
      - 未知
      enum_descriptions:
        绿: 绿灯
        黄: 黄灯
        红: 红灯
        未知: 未知
    - name: latest_stop_line_direction
      type: FLOAT
      nullable: true
    - name: navigation_status
      type: TEXT
      nullable: true
      enum:
      - 导航中
    - name: wiper_status
      type: TEXT
      nullable: true
      enum:
      - 关闭
      - 间歇档
    - name: indicator_status
      type: TEXT
      nullable: true
    - name: cumulative_distance
      type: FLOAT
      nullable: true
    - name: utm_x
      type: FLOAT
      nullable: true
    - name: utm_y
      type: FLOAT
      nullable: true
    - name: utm_yaw
      type: FLOAT
      nullable: true
    - name: gl_dis_to_left
      type: FLOAT
      nullable: true
    - name: gl_dis_to_right
      type: FLOAT
      nullable: true
    - name: gl_lane_cnt
      type: INTEGER
      nullable: true
    - name: gl_left_cnt
      type: INTEGER
      nullable: true
    - name: gl_right_cnt
      type: INTEGER
      nullable: true
    primary_key:
    - ts
    notes:
    - ego表无tag_name列，其分类列(traffic_light_status等)由车端传感器直接上报
  - name: intersection_info
    type: horizontal_event
    description: 路口信息表——记录路口ID、车道数、自车车道索引、车道详情
    columns:
    - name: intersection_id
      type: TEXT
      nullable: true
    - name: lane_count
      type: BIGINT
      nullable: true
    - name: ego_lane_index
      type: BIGINT
      nullable: true
    - name: lane_info
      type: TEXT
      nullable: true
    notes:
    - 存储 EgoIntoIntersection 事件，从 range_tag 中过滤后单独存放
  - name: static_link
    type: static
    description: 静态道路链接表——道路拓扑链接的静态属性
    columns:
    - name: link_id
      type: TEXT
      nullable: true
      pk: true
    - name: link_type
      type: TEXT
      nullable: true
      enum:
      - 主干道
      - 主路
      - 入口匝道
      - 匝道
      - 路口
      - 辅路
    - name: link_turn_type
      type: TEXT
      nullable: true
      enum:
      - 右转
      - 左转
      - 掉头
      - 直行
      - 直行右转
      - 路口
      - 进入
      - 退出
    - name: link_class
      type: TEXT
      nullable: true
      enum:
      - 主要大街/城市快速道
      - 主要道路
      - 国道
      - 次要道路
      - 省道
      - 高速公路
    - name: link_attribute
      type: TEXT
      nullable: true
      enum:
      - 无特殊属性
      - 隧道
      - 其他
    - name: link_speed_limit
      type: FLOAT
      nullable: true
    - name: link_predecessor
      type: TEXT
      nullable: true
    - name: link_successor
      type: TEXT
      nullable: true
    - name: link_exp_speed_limit
      type: FLOAT
      nullable: true
    primary_key:
    - link_id
  - name: dynamic_link
    type: vertical_timeseries
    description: 动态道路链接表——随时间变化的道路拓扑链接属性
    columns:
    - name: ts
      type: BIGINT
      nullable: true
      pk: true
    - name: link_id
      type: TEXT
      nullable: true
      pk: true
    - name: link_type
      type: TEXT
      nullable: true
      enum:
      - 主干道
      - 主路
      - 入口匝道
      - 匝道
      - 路口
      - 辅路
    - name: link_attribute
      type: TEXT
      nullable: true
      enum:
      - 无特殊属性
      - 隧道
      - 其他
    - name: link_exp_speed_limit
      type: FLOAT
      nullable: true
    - name: link_predecessor
      type: TEXT
      nullable: true
    - name: link_successor
      type: TEXT
      nullable: true
    - name: include_lane_ids
      type: TEXT
      nullable: true
    primary_key:
    - ts
    - link_id
  - name: dynamic_lane
    type: vertical_timeseries
    description: 动态车道表——随时间变化的车道属性
    columns:
    - name: ts
      type: BIGINT
      nullable: true
      pk: true
    - name: lane_id
      type: TEXT
      nullable: true
      pk: true
    - name: ref_link_id
      type: INTEGER
      nullable: true
    - name: left_boundary_id
      type: INTEGER
      nullable: true
    - name: right_boundary_id
      type: INTEGER
      nullable: true
    - name: lane_type
      type: TEXT
      nullable: true
      enum:
      - LANE_TYPE_EMERGENCY
      - 未知
    - name: lane_turn_type
      type: TEXT
      nullable: true
      enum:
      - TURN_TYPE_AHEADRIGHT
      - TURN_TYPE_LEFTLUTURN
      - 右转
      - 左转
      - 掉头
      - 直行
      - 路口
    - name: lane_trans_type
      type: TEXT
      nullable: true
      enum:
      - TRANS_TYPE_Ending
      - TRANS_TYPE_FullConnect
      - TRANS_TYPE_LeftConnect
      - TRANS_TYPE_OneSplitTwo
      - TRANS_TYPE_RightConnect
      - TRANS_TYPE_UNDEFINED
    - name: predecessors
      type: TEXT
      nullable: true
    - name: successors
      type: TEXT
      nullable: true
    - name: lane_relate_obs_ids
      type: TEXT
      nullable: true
    primary_key:
    - ts
    - lane_id
  - name: static_lane
    type: static
    description: 静态车道表——车道的静态属性
    columns:
    - name: lane_id
      type: TEXT
      nullable: true
      pk: true
    primary_key:
    - lane_id
