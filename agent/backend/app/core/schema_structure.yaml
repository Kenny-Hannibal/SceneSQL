    - steering_left_60_120
    - steering_left_120_185
    - steering_left_above_185
    - steering_right_15_60
    - steering_right_60_120
    - steering_right_120_185
    - steering_right_above_185
    - navi_guide_line_infos_empty
    - navi_not_in_sd
    - navi_keep
    - navi_enter
    - navi_exit
    - navi_other
    - navi_turn_left
    - navi_turn_right
    - navi_u_turn
    - CRUISE_CURVE
    - CRUISE_FOLLOW
    - CRUISE_STRAIGHT
    - INTERSECTION_RIGHTTURN
    - INTERSECTION_STRAIGHT
    - AVOIDANCE_MULTIOBSTACLEAROUNDEGO
    - CongestedFollow
    - CRUISE_CREEP
    - CRUISE_RAMP
    - CRUISE_SLOWFOLLOW
    - CRUISE_SLOWMOVE
    - INTERSECTION_LEFTTURN
    - LANECHANGE_ABANDON
    - over_rain_level
    - STOPANDGO_FIRSTCARSTARTATGREENLIGHT
    - STOPANDGO_FIRSTCARSTOPATREDLIGHT
    notes:
    - 车端行为标签还可能包含以下前缀类别（取决于 bag 文件中的 beh_tag 消息）： CRUISE_*, STOPANDGO_*, LANECHANGE_*,
      AVOIDANCE_*, INTERSECTION_*
    - EgoIntoIntersection 被过滤到 intersection_info 表，不在 range_tag 中
    - param 列为 JSON 字符串，可用 json_extract() 提取子标签（sub_tag）、障碍物 ID 等
