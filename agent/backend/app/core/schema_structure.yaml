version: 1.2.0
note: '纯 SQLite 结构文件，用于 LLM SQL 生成阶段注入 prompt。 不含任何自然语言解释，只包含表名、列名、数据类型、主键、标签枚举值。 字段/标签的详细定义请查阅 schema_dictionary.yaml。

  '
database_schema:
  tables:
  - name: range_tag
    type: horizontal_event
    columns:
    - name: start_ts
      type: BIGINT
      nullable: false
    - name: end_ts
      type: BIGINT
      nullable: false
    - name: tag_name
      type: TEXT
      nullable: false
    - name: param
      type: TEXT
      nullable: false
    primary_key:
    - start_ts
    - end_ts
    - tag_name
    enum:
    - AbnormalLaneChange
    - AbnormalRightLaneChangeToRightestStopV3
    - AbnormalRightLaneChangeToRightestStopV5
    - ActiveWiperState
    - AvoidanceBorrowLane
    - Avoidance_InLane
    - BinCounter
    - CloseFollow
    - CrossStopLineOnYellowLight
    - CrossVRUV1
    - CrossVehicle
    - CrawlingFollow
    - Cutin
    - GreenLightNotProceeding
    - HighSteeringWheelTorque
    - Intersection
    - Jerk
    - LaneChange
    - LaneKeep
    - LaneMerging
    - LowTTC
    - NoSpeedIncrease
    - NotCenter
    - ObstacleCollision
    - ObstacleNearMiss
    - OffRamp
    - OnRamp
    - OtherRamp
    - OverSpeedLimit
    - RainLevel
    - Roundabout
    - RunRedLight
    - Slope
    - SolidLaneChange
    - SteeringSmallSwing
    - SteeringWheelSlam
    - StraightDriving
    - TrafficIntersection
    - TrafficLightAbnormal
    - Turning
    - YellowLightStop
    - route_deviation
    - stationary
    - creeping
    - cruising
    - decelerating
    - accelerating
    - hard_braking
    - reversing
    - steering_slightly
    - steering_left_15_60
    - steering_left_60_120
    - steering_left_120_185
    - steering_left_above_185
    - steering_right_15_60
    - steering_right_60_120
    - steering_right_120_185
    - steering_right_above_185
    - navi_guide_line_infos_empty
    - navi_not_in_sd
    - navi_keep
    - navi_enter
    - navi_exit
    - navi_other
    - navi_turn_left
    - navi_turn_right
    - navi_u_turn
    - CRUISE_CURVE
    - CRUISE_FOLLOW
    - CRUISE_STRAIGHT
    - INTERSECTION_RIGHTTURN
    - INTERSECTION_STRAIGHT
    notes:
    - 车端行为标签还可能包含以下前缀类别（取决于 bag 文件中的 beh_tag 消息）： CRUISE_*, STOPANDGO_*, LANECHANGE_*, AVOIDANCE_*, INTERSECTION_*
    - EgoIntoIntersection 被过滤到 intersection_info 表，不在 range_tag 中
    - param 列为 JSON 字符串，可用 json_extract() 提取子标签（sub_tag）、障碍物 ID 等
  - name: intersection_info
