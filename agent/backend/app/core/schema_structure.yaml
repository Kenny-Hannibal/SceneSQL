    - Intersection
    - Jerk
    - LaneChange
    - LaneKeep
    - LaneMerging
    - LowTTC
    - NoSpeedIncrease
    - NotCenter
    - ObstacleCollision
    - ObstacleNearMiss
    - OffRamp
    - OnRamp
    - OtherRamp
    - OverSpeedLimit
    - RainLevel
    - Roundabout
    - RunRedLight
    - Slope
    - SolidLaneChange
    - SteeringSmallSwing
    - SteeringWheelSlam
    - StraightDriving
    - TrafficIntersection
