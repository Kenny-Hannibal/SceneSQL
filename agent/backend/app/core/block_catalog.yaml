# block_catalog.yaml — 供Round1 LLM查阅的Block能力目录
# 当用户查询没有匹配的recipe时，LLM可以从这里选择block组合

version: "1.0"

blocks:
  continuous_segment:
    description: "从ego表提取满足条件的连续帧，用ROW_NUMBER差值技巧分组为连续时间段"
    input: ego
    output: [start_ts, end_ts, duration, frame_count]
    required_params: [where_condition]
    optional_params: {min_duration: 3.0, pre_pad: 0.0, post_pad: 0.0}
    example_where: "ABS(steering_angle) > 0.6 AND speed > 25"
    used_in: [大曲率道路, 停车线前停车, 右转A, 下匝道]

  tag_gap_merge:
    description: "合并range_tag碎片：间隔<=N秒的标签归为同一事件"
    input: range_tag
    output: [scene_start_ts, scene_end_ts, total_duration, group_id]
    required_params: [tag_name]
    optional_params: {gap_seconds: 3.0, min_duration: 0, pre_pad: 0.0, post_pad: 0.0, sub_tag: null}
    used_in: [Y型路口, 近红绿灯路口, 直行红绿灯路口]

  static_link_segment:
    description: "ego轨迹关联静态地图link，按link_type过滤，检测连续时间段"
    input: [ego, static_link]
    output: [start_ts, end_ts, link_id, link_type, link_turn_type, duration]
    required_params: [link_type]
    optional_params: {link_turn_type: null, pre_pad: 0.0, post_pad: 0.0, min_duration: 0}
    used_in: [下匝道, 上匝道, 合流, 右转A]

  obstacle_proximity:
    description: "检测自车附近的静态/动态障碍物"
    input: [static_obj或dynamic_obj]
    output: [detect_ts, obj_id, x, y, type]
    required_params: []
    optional_params: {obj_table: static_obj, obj_type: null, x_min: 0, x_max: 15, y_max: 1.5}
    used_in: [绕障, 路口停车, 借道避让]

  steering_change_detect:
    description: "检测方向盘先急转后反打的模式（绕障/避让的典型特征）"
    input: ego
    output: [turn_start, counter_turn_start, turn_duration]
    required_params: []
    optional_params: {initial_angle_threshold: 0.2618, counter_angle_threshold: 0.1, lookback_seconds: 10}
    used_in: [绕障]

  ego_field_condition:
    description: "通用ego字段条件过滤+连续段分组（比continuous_segment更灵活，支持多列输出）"
    input: ego
    output: [start_ts, end_ts, duration, frame_count]
    required_params: [where_condition]
    optional_params: {select_fields: "ts", min_duration: 3.0, pre_pad: 0.0, post_pad: 0.0, group_by_extra: null}
    used_in: [车道结束, 大曲率道路]
