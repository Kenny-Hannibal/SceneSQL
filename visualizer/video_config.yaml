# Video extraction configuration
# This file controls frame rate and quality settings for bag-to-video extraction.
# Modify values here to adjust extraction behavior without code changes.

# Default input frame rate (frames per second from bag)
# Lower values = faster extraction, smaller file; higher = smoother but slower
# 实际优先使用 bag metadata 中每个 topic 的 message_freq，此值仅作为 fallback
input_fps: 10

# Default output frame rate
# 留空或删除表示自动跟随 input_fps（推荐，保持与 bag 原始帧率一致）
# 若显式设置，则所有 topic 统一输出为此帧率
# output_fps: 10

# H.264 encoding quality (lower = better quality, larger file)
# Range: 0 (lossless) to 51 (worst). Recommended: 18-28
crf: 23

# Encoding speed preset: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
# "fast" is a good balance; "ultrafast" for quick previews
preset: fast

# Topic-specific frame rate overrides
# Example: high-rate camera topics can be downsampled for faster extraction
topic_fps_overrides:
  # "/camera/front_center": 5
  # "/camera/rear_center": 5
